<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11月底 · 河南陕西14天路线图 · 杭州出发</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.css"
      onerror="var l=document.createElement('link');l.rel='stylesheet';l.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l)">
<script src="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>if(!window.L){document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"><\/script>');}</script>
<style>
  :root{
    --red:#d9433a; --amber:#e8902a; --blue:#2f6fd0; --green:#2e8b57; --purple:#7b5ea7;
    --ink:#23272f; --sub:#6b7280; --line:#ececf0; --bg:#f7f7f9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:var(--ink)}
  #app{display:flex;height:100vh;overflow:hidden}

  /* ---------- 侧边栏 ---------- */
  #sidebar{width:348px;min-width:348px;background:#fff;display:flex;flex-direction:column;box-shadow:2px 0 18px rgba(0,0,0,.08);z-index:1200}
  .sb-head{padding:20px 20px 14px;background:linear-gradient(135deg,#c9352c,#e86a3f);color:#fff}
  .sb-head h1{font-size:19px;letter-spacing:.5px}
  .sb-head p{font-size:12.5px;opacity:.9;margin-top:5px}
  .stats{display:flex;gap:8px;margin-top:13px}
  .stat{flex:1;background:rgba(255,255,255,.16);border-radius:9px;padding:7px 4px;text-align:center}
  .stat b{display:block;font-size:16px}
  .stat span{font-size:10.5px;opacity:.92}

  .legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:11px 20px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--sub)}
  .legend i{display:inline-block;width:22px;height:0;border-top-width:3px;border-top-style:solid;vertical-align:middle;margin-right:5px}
  .lg-main{border-color:var(--red)} .lg-branch{border-color:var(--amber);border-top-style:dashed!important} .lg-fly{border-color:var(--blue);border-top-style:dashed!important}
  .lg-dot{width:11px;height:11px;border-radius:50%;vertical-align:middle;margin-right:5px;display:inline-block}

  #timeline{flex:1;overflow-y:auto;padding:8px 12px 20px}
  #timeline::-webkit-scrollbar{width:6px}
  #timeline::-webkit-scrollbar-thumb{background:#d7d7de;border-radius:3px}
  .day{display:flex;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer;transition:.15s;border:1px solid transparent}
  .day:hover{background:var(--bg);border-color:var(--line)}
  .day.active{background:#fdf1ef;border-color:#f3c9c4}
  .day .d{flex:0 0 38px;height:38px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .day .d.mt{background:var(--green)} .day .d.fly{background:var(--blue)}
  .day .t{font-size:13.5px;font-weight:600;line-height:1.35;padding-top:1px}
  .day .t small{display:block;font-weight:400;color:var(--sub);font-size:11.5px;margin-top:2px}

  .sb-foot{padding:10px 20px 14px;border-top:1px solid var(--line);font-size:11px;color:#9aa0aa;line-height:1.6}

  /* ---------- 地图 ---------- */
  #map{flex:1;height:100%;background:#e9eef3}
  .pin{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
       color:#fff;font-size:12px;font-weight:700;border:2.5px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.35)}
  .pin.city{background:linear-gradient(145deg,#e8554b,#c32f27)}
  .pin.mountain{background:linear-gradient(145deg,#3aa76a,#1f7a48)}
  .pin.home{background:linear-gradient(145deg,#4b86e0,#2456a8)}
  .pin.site{background:linear-gradient(145deg,#9575c4,#6641a0);font-size:16px}
  .pin.airplane{background:var(--blue);font-size:14px}

  /* 选中某天：命中点光圈脉冲，其余变暗 */
  .leaflet-marker-icon.dayhit .pin{animation:pinPulse 1.3s ease-in-out infinite alternate}
  @keyframes pinPulse{
    from{box-shadow:0 0 0 3px rgba(217,67,58,.35),0 2px 7px rgba(0,0,0,.35)}
    to{box-shadow:0 0 0 9px rgba(217,67,58,.10),0 2px 7px rgba(0,0,0,.35)}
  }
  .leaflet-marker-icon.daydim{opacity:.18;transition:opacity .3s}

  .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
  .leaflet-popup-content{margin:13px 16px;font-size:13px;line-height:1.55;min-width:230px;max-height:60vh;overflow-y:auto}
  .pop h3{font-size:14.5px;margin-bottom:3px}
  .pop .tag{display:inline-block;font-size:10.5px;color:#fff;background:var(--red);border-radius:5px;padding:1px 7px;margin:2px 4px 7px 0}
  .pop .tag.mt{background:var(--green)} .pop .tag.st{background:var(--purple)} .pop .tag.hm{background:var(--blue)}
  .pop .tag.free{background:#1f9d6b} .pop .tag.opt{background:#8b929e} .pop .tag.warn{background:#c0392b}
  .pop ul{list-style:none;color:#444;font-size:12px}
  .pop li{padding:1.5px 0}
  .pop li::before{content:"· ";color:var(--red);font-weight:700}
  .pop .sec{font-size:11px;font-weight:700;color:var(--purple);margin:7px 0 2px}
  .pop .sec.food{color:var(--amber)} .pop .sec.tip{color:var(--green)}
  .pop .tipbox{font-size:11.5px;background:#f2f8f4;border-left:3px solid var(--green);border-radius:0 7px 7px 0;padding:5px 9px;margin-top:6px;color:#3d5447}
  .pop .warnbox{font-size:11.5px;background:#fdf3f2;border-left:3px solid #c0392b;border-radius:0 7px 7px 0;padding:5px 9px;margin-top:6px;color:#7d2b22}

  /* 悬停名称气泡 */
  .mttip{background:#23272f!important;color:#fff!important;border:none!important;border-radius:8px!important;
         font-size:11.5px!important;padding:4px 10px!important;box-shadow:0 3px 10px rgba(0,0,0,.28)!important;white-space:nowrap}
  .mttip::before{display:none!important}

  .leaflet-control-scale-line{background:rgba(255,255,255,.85);border-radius:6px;font-size:10px;padding:2px 7px;color:#444;margin:0 8px 8px}

  .route-main{stroke:var(--red);stroke-width:3.5;fill:none;opacity:.9;
    stroke-dasharray:11 7;animation:dash 1.1s linear infinite}
  .route-branch{stroke:var(--amber);stroke-width:3;fill:none;opacity:.95;
    stroke-dasharray:4 7;stroke-linecap:round;animation:dash .7s linear infinite}
  .route-fly{stroke:var(--blue);stroke-width:3;fill:none;opacity:.85;
    stroke-dasharray:3 9;stroke-linecap:round;animation:dash .8s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-18}}

  .mapbtn{position:absolute;top:12px;right:12px;z-index:1000;display:flex;gap:8px}
  .mapbtn button{border:none;background:#fff;border-radius:9px;padding:8px 13px;font-size:12.5px;color:var(--ink);
    box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;font-family:inherit}
  .mapbtn button:hover{background:#f3f3f5}
  #menuBtn{display:none;position:absolute;top:12px;left:12px;z-index:1100;border:none;background:#fff;border-radius:9px;
    width:40px;height:40px;font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer}

  @media (max-width:860px){
    #sidebar{position:absolute;top:0;left:0;height:100%;transform:translateX(-100%);transition:.25s}
    #sidebar.open{transform:none}
    #menuBtn{display:block}
  }
  @media (max-width:520px){
    .leaflet-popup-content{min-width:0!important;width:200px;padding:11px 13px!important}
    .pop li,.pop .tipbox,.pop .warnbox{font-size:11px}
  }
  /* 系统「减少动态效果」：关掉路线流动和脉冲，省电 */
  @media (prefers-reduced-motion:reduce){
    .route-main,.route-branch,.route-fly{animation:none}
    .leaflet-marker-icon.dayhit .pin{animation:none;box-shadow:0 0 0 4px rgba(217,67,58,.35)}
  }
  @media print{
    #sidebar,.mapbtn,#menuBtn{display:none!important}
    #map{position:absolute;inset:0}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <h1>河南陕西 14 天</h1>
      <p>杭州 → 中原 → 老君山 → 关中 · 11 月底淡季版</p>
      <div class="stats">
        <div class="stat"><b>14</b><span>天</span></div>
        <div class="stat"><b>5</b><span>座城市</span></div>
        <div class="stat"><b>2</b><span>座名山</span></div>
        <div class="stat"><b>22</b><span>个标记点</span></div>
      </div>
    </div>
    <div class="legend">
      <span><i class="lg-main"></i>高铁主线</span>
      <span><i class="lg-branch"></i>短途支线</span>
      <span><i class="lg-fly"></i>飞机航线</span>
      <span><i class="lg-dot" style="background:var(--red)"></i>城市</span>
      <span><i class="lg-dot" style="background:var(--green)"></i>名山</span>
      <span><i class="lg-dot" style="background:var(--purple)"></i>活动点</span>
    </div>
    <div id="timeline"></div>
    <div class="sb-foot">
      地图瓦片：高德地图 · 悬停看名称，点击看时间段 / 门票 / 餐饮 / 贴士<br>
      <b style="color:#c0392b">本版按 11 月底重排</b>：已删去菊花花会、古观音银杏、露天演出；<br>
      换来淡季清静 + 山上雪景。红色提示为冬季特有风险。
    </div>
  </aside>

  <div id="map"></div>
  <button id="menuBtn">☰</button>
  <div class="mapbtn">
    <button onclick="resetView()">⤢ 全程</button>
    <button onclick="window.print()">🖨 打印</button>
  </div>
</div>

<script>
/* ================= 地图底图 ================= */
const map = L.map('map').setView([33.6,110.5],6);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
  {subdomains:'1234',maxZoom:18,attribution:'© 高德地图'}).addTo(map);
L.control.scale({metric:true,imperial:false}).addTo(map);

const C = {
  hangzhou:[30.2741,120.1551], zhengzhou:[34.7466,113.6253], kaifeng:[34.7973,114.3076],
  tieta:[34.8130,114.3480], qingming:[34.8085,114.3020],
  luoyang:[34.6197,112.4540], longmen:[34.5550,112.4690], luobo:[34.6320,112.4470],
  yingtianmen:[34.6670,112.4540], luoyigucheng:[34.6745,112.4760], baimasi:[34.7205,112.5990],
  laojun:[33.7210,111.6660],
  xian:[34.2660,108.9450], bingmayong:[34.3848,109.2734], huaqing:[34.3637,109.2136],
  shanlibo:[34.2367,108.9339], chengqiang:[34.2527,108.9400], zhonggulou:[34.2612,108.9402],
  dayanta:[34.2187,108.9590], beilin:[34.2530,108.9520],
  daminggong:[34.2930,108.9600], hanyangling:[34.4430,108.7150], huashan:[34.4838,110.0838]
};

/* ================= 路线 ================= */
L.polyline([C.hangzhou,C.zhengzhou,C.kaifeng,C.luoyang,C.laojun,C.xian],
  {className:'route-main'}).addTo(map);
[
  [C.xian,C.huaqing,C.bingmayong,C.xian],   // D8 东线
  [C.xian,C.huashan,C.xian],                // D11–D12 华山
  [C.xian,C.daminggong,C.xian],             // D12 大明宫
  [C.xian,C.hanyangling,C.xian]             // D13 北线
].forEach(p=>L.polyline(p,{className:'route-branch'}).addTo(map));

/* 飞机航线：球面大圆弧 */
function arc(a,b,n=40){
  const toR=d=>d*Math.PI/180,toD=r=>r*180/Math.PI;
  let [la1,lo1]=a.map(toR),[la2,lo2]=b.map(toR);
  const d=Math.acos(Math.sin(la1)*Math.sin(la2)+Math.cos(la1)*Math.cos(la2)*Math.cos(lo2-lo1));
  const pts=[];
  for(let i=0;i<=n;i++){const f=i/n;
    const A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
    const x=A*Math.cos(la1)*Math.cos(lo1)+B*Math.cos(la2)*Math.cos(lo2);
    const y=A*Math.cos(la1)*Math.sin(lo1)+B*Math.cos(la2)*Math.sin(lo2);
    const z=A*Math.sin(la1)+B*Math.sin(la2);
    pts.push([toD(Math.atan2(z,Math.hypot(x,y))),toD(Math.atan2(y,x))]);}
  return pts;
}
const flyPath = arc(C.xian,C.hangzhou);
L.polyline(flyPath,{className:'route-fly'}).addTo(map);

/* ================= 弹窗工具函数 ================= */
function P(h3,tags,secs){
  return `<div class="pop"><h3>${h3}</h3><div>${tags.map(t=>`<span class="tag ${t[1]}">${t[0]}</span>`).join('')}</div>${secs.join('')}</div>`;
}
const S=(title,items,cls='')=>`<div class="sec ${cls}">${title}</div><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
const TIP=t=>`<div class="tipbox">💡 ${t}</div>`;
const WARN=t=>`<div class="warnbox">⚠ ${t}</div>`;

/* pin：days=该点出现在第几天（可多天），tt=悬停名称 */
const allPins=[];
function pin(coord,label,type,html,days,tt){
  const m=L.marker(coord,{icon:L.divIcon({className:'',html:`<div class="pin ${type}">${label}</div>`,
    iconSize:[32,32],iconAnchor:[16,16]})}).addTo(map).bindPopup(html);
  if(tt)m.bindTooltip(tt,{direction:'top',offset:[0,-15],className:'mttip'});
  m._days=days; m._coord=coord;
  allPins.push(m);
  return m;
}

/* ================= D1–D7 中原段 ================= */
pin(C.hangzhou,'起','home',P('杭州',[['D1 出发 / D14 返程','hm']],[
  S('交通',['D1 早班高铁 杭州东 → 郑州东（约 4h10，¥440）','D14 下午飞机 西安咸阳 → 杭州萧山（约 2h）'])]),
  [1,14],'杭州');

pin(C.zhengzhou,'1','city',P('郑州',[['D1',''],['河南博物院 免费','free']],[
  S('时间安排',['11:10 到郑州东，先入住 / 寄存行李','13:00 前到河南博物院（17:00 闭馆，周一闭馆）','傍晚 二七广场 + 德化街步行街']),
  S('必看',['贾湖骨笛 · 莲鹤方壶 · 妇好鸮尊 · 云纹铜禁'],'tip'),
  S('晚餐',['合记 / 萧记 烩面（¥20–30）'],'food'),
  TIP('博物院提前 3–7 天在公众号预约；淡季好约，但仍建议提前')]),
  [1],'郑州');

pin(C.kaifeng,'2','city',P('开封',[['D2–D3','']],[
  S('D2',['城际 25 分钟（¥22）到开封北','开封府（¥65）→ 大相国寺（¥45）→ 铁塔公园（¥30），步行可串','15:00 进清明上河园（¥120），只逛白天园区','晚上 鼓楼夜市 / 书店街']),
  S('D3 上午',['万岁山武侠城（¥80–100，实景武侠演出）','不想再看园区 → 改开封博物馆（免费）+ 州桥遗址','16:00 开封北 → 郑州东 → 洛阳龙门']),
  S('必吃',['第一楼灌汤包 · 桶子鸡 · 炒凉粉 · 杏仁茶'],'food'),
  WARN('11 月底菊花文化节（10/18–11/18）已结束，龙亭菊展看不到；《大宋·东京梦华》露天夜场冬季停演，别为此留夜')]),
  [2,3],'开封');

pin(C.tieta,'塔','site',P('铁塔公园',[['D2','st'],['¥30','st']],[
  S('看点',['北宋开宝寺塔，琉璃砖塔，900 多年历史','开封城里少数「真古迹」，不是重建的仿古街区','登塔另收费，塔下拍照最好看']),
  TIP('替代原行程里的菊花展——11 月底花会已结束，这里不受季节影响')]),
  [2],'铁塔公园');

pin(C.qingming,'园','site',P('清明上河园',[['D2','st'],['¥120','st']],[
  S('时间安排',['15:00 进园，逛到 17:30 天黑前后出','园内按《清明上河图》1:1 复原，虹桥、汴河码头值得看','各类实景演出按当日时刻表，进园先拿节目单']),
  WARN('夜场《大宋·东京梦华》为露天演出，冬季停演（往年 11 月中收官，以当年官方公告为准）')]),
  [2],'清明上河园');

pin(C.luoyang,'3','city',P('洛阳',[['D3–D6','']],[
  S('整体安排',['D3 晚 抵达，宿洛邑古城 / 应天门附近（3 晚）','D4 龙门石窟 + 洛阳博物馆 + 应天门','D5 白马寺 + 老城','D6 一早出发去老君山']),
  S('随时可吃',['不翻汤 · 洛阳水席 · 浆面条 · 十字街夜市'],'food'),
  TIP('三个人文点（龙门 / 洛博 / 应天门）都要预约；11 月底淡季，人少很多')]),
  [3,4,5],'洛阳');

pin(C.luoyigucheng,'🏮','site',P('洛邑古城',[['D3 晚','st'],['免费','free']],[
  S('时间安排',['文峰塔周边，晚上灯笼亮起最好看','满街汉服店，租金约 ¥50–150（含妆造）','出来步行到十字街夜市吃晚饭']),
  TIP('淡季汉服店不用排队，想拍就趁这趟——旺季根本挤不进去')]),
  [3],'洛邑古城');

pin(C.longmen,'🗿','site',P('龙门石窟',[['D4 上午','st'],['¥90','st']],[
  S('时间安排',['8:00 开园即入，先西山后东山','卢舍那大佛（奉先寺）——朝东，上午正面光最好','建议时长 3–4h，西山石窟密集，东山可走快些']),
  S('交通',['市区公交 / 打车约 30 分钟']),
  TIP('淡季早上人很少，可以在一尊佛前蹲很久等光——这是带人玩做不到的')]),
  [4],'龙门石窟');

pin(C.luobo,'🏺','site',P('洛阳博物馆',[['D4 下午','st'],['免费需预约','free']],[
  S('时间安排',['9:00–17:00，周一闭馆，建议 2h','必看：唐三彩 · 曹魏白玉杯 · 夏代乳钉纹铜爵']),
  TIP('和河南博物院互补，一个看中原通史，一个看洛阳十三朝')]),
  [4],'洛阳博物馆');

pin(C.yingtianmen,'🏯','site',P('应天门 · 明堂天堂',[['D4 晚','st'],['应天门 ¥30','st']],[
  S('时间安排',['隋唐洛阳城遗址，应天门灯光秀晚上最好看','可登应天门看中轴线夜景','明堂天堂（¥120）联票，对唐史有兴趣再进']),
  TIP('不进景区也能在广场拍夜景，机位在定鼎路中轴线上')]),
  [4],'应天门 · 明堂天堂');

pin(C.baimasi,'🛕','site',P('白马寺',[['D5 上午','st'],['¥35','st']],[
  S('时间安排',['中国第一古刹（公元 68 年），洛阳东郊，市区打车约 40 分钟','中轴古建 + 印度 / 泰国 / 缅甸风格国际佛殿区','建议 2–3h']),
  S('下午',['回老城逛丽景门 + 隋唐大运河文化博物馆（免费）'],'tip'),

/* 当天视野：取相互距离 ≤250km 的最大点簇，避免把出发/到达城市拉进同一视野 */
function dayBounds(points){
  const R=6371,toR=x=>x*Math.PI/180;
  const dist=(a,b)=>{
    const dLa=toR(b[0]-a[0]),dLo=toR(b[1]-a[1]);
    const h=Math.sin(dLa/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLo/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  };
  let best=[];
  points.forEach(p=>{
    const near=points.filter(q=>dist(p._coord,q._coord)<=250);
    if(near.length>best.length)best=near;
  });
  if(best.length<=1 && points.length>1){
    const nonHome=points.filter(p=>!(p._icon&&p._icon.querySelector('.pin.home')));
    best=[nonHome[nonHome.length-1]||points[points.length-1]]; // 散点时落到目的地城市
  }
  return L.latLngBounds(best.map(p=>p._coord)).pad(.28);
}

/* ================= 按天高亮 ================= */
function showDay(day){
  const hit=allPins.filter(m=>m._days.includes(day));
  allPins.forEach(m=>{
    const ok=m._days.includes(day);
    if(m._icon)m._icon.classList.toggle('dayhit',ok),m._icon.classList.toggle('daydim',!ok);
  });
  if(hit.length>1){
    map.flyToBounds(dayBounds(hit),{duration:.9,padding:[24,24],maxZoom:14});
  }else if(hit.length===1){
    map.flyTo(hit[0]._coord,Math.max(map.getZoom(),13),{duration:.9});
  }
}
function resetDay(){
  allPins.forEach(m=>{if(m._icon)m._icon.classList.remove('dayhit','daydim')});
}

const tl=document.getElementById('timeline');
const dayEls=[];
days.forEach((day,i)=>{
  const el=document.createElement('div');
  el.className='day';
  el.innerHTML=`<div class="d ${day.cls||''}">D${day.d}</div><div class="t">${day.t}<small>${day.s}</small></div>`;
  el.onclick=()=>selectDay(i);
  dayEls.push(el);
  tl.appendChild(el);
});
function selectDay(i,silent){
  const day=days[i];
  dayEls.forEach((x,j)=>x.classList.toggle('active',i===j));
  showDay(day.d);
  if(!silent){
    const h='#D'+day.d;
    if(location.hash!==h)history.pushState({day:day.d},'',h);
  }
  if(innerWidth<=860)document.getElementById('sidebar').classList.remove('open');
}
function resetView(){
  resetDay();
  dayEls.forEach(x=>x.classList.remove('active'));
  map.fitBounds(fullBounds);
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
}
/* 浏览器前进/后退 & 分享链接打开 */
addEventListener('hashchange',()=>{
  const m=location.hash.match(/^#D(\d{1,2})$/);
  if(m&&+m[1]>=1&&+m[1]<=14)selectDay(+m[1]-1,true);
  else if(!location.hash){resetDay();dayEls.forEach(x=>x.classList.remove('active'));}
});
