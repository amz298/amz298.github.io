<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#07c160" />
  <!-- iPhone 加到主屏幕后的全屏 App 模式与图标 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="阿哲" />
  <link rel="apple-touch-icon" href="icon.png" />
  <title>AI 陪伴</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
:root {
  --topbar: #ededed;          /* 顶栏/聊天底，微信灰 */
  --chatbg: #ededed;
  --composer-bg: #f7f7f7;      /* 输入区 */
  --panel: #ffffff;
  --border: #e0e0e0;
  --text: #191919;
  --muted: #9a9a9a;
  --green: #07c160;            /* 微信绿 */
  --mine: #95ec69;             /* 我方气泡 */
  --theirs: #ffffff;           /* 对方气泡 */
  --danger: #fa5151;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
body {
  margin: 0;
  background: var(--chatbg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  display: flex;
  flex-direction: column;
  -webkit-tap-highlight-color: transparent;
}

/* 顶栏 */
.topbar {
  display: flex; align-items: center; gap: 4px;
  padding: 10px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: calc(env(safe-area-inset-left, 0px) + 10px);
  padding-right: calc(env(safe-area-inset-right, 0px) + 10px);
  background: var(--topbar);
  border-bottom: 1px solid var(--border);
}
.topbar .nav {
  flex: none; width: 36px; height: 36px;
  display: grid; place-items: center;
  background: transparent; border: none; color: #191919;
  font-size: 24px; line-height: 1; cursor: pointer; padding: 0;
}
.topbar .nav.back { font-size: 32px; padding-bottom: 4px; }
.topbar .nav.dots { letter-spacing: -3px; font-weight: 700; }
.topbar .meta { flex: 1; min-width: 0; text-align: center; }
.topbar .name {
  font-size: 17px; font-weight: 600; color: #000;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar .status { font-size: 12px; color: var(--muted); margin-top: 1px; }
.status.ok { color: var(--green); }
.status.err { color: var(--danger); }
.status.idle { visibility: hidden; }   /* 平时不显示，顶栏只留名字；保留占位不跳动 */

/* 会话列表屏（默认首页） vs 聊天屏 切换 */
.topbar-row { display: flex; align-items: center; gap: 4px; width: 100%; min-width: 0; }
body:not(.in-chat) #chatHeader { display: none; }
body:not(.in-chat) #chat { display: none; }
body:not(.in-chat) #composer { display: none; }
body.in-chat #listScreen { display: none; }
body.in-chat #listHeader { display: none; }
.list-screen {
  flex: 1; min-height: 0; overflow-y: auto;
  background: #fff;
}

/* 聊天区 */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 14px 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--chatbg);
}
.msg { max-width: 72%; display: flex; }
.msg.me { align-self: flex-end; gap: 10px; align-items: flex-start; flex-direction: row; }
.msg.ta { align-self: flex-start; gap: 10px; align-items: flex-start; }
/* 我的默认头像色调（区别于 TA 的绿紫渐变） */
.avatar-img.me {
  background: linear-gradient(135deg, #7a8a99, #4a5a6a);
}
.time-label {
  align-self: center;
  margin: 16px 0 2px;
  color: #b2b2b2;
  font-size: 12px;
  line-height: 1.4;
}
.avatar-img {
  flex: none; width: 40px; height: 40px;
  border-radius: 6px;
  background: linear-gradient(135deg, #07c160, #7c5cff);
  background-size: cover; background-position: center;
  color: #fff; font-size: 16px; font-weight: 600;
  display: grid; place-items: center;
}
.bubble {
  padding: 10px 12px;
  border-radius: 8px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 17px;
  color: #000;
  position: relative;
}
/* 微信式气泡：白/绿 + 朝头像的小尾巴 */
.msg.ta .bubble {
  background: var(--theirs);
  border-top-left-radius: 3px;
  box-shadow: 0 1px 1px rgba(0,0,0,.05);
}
.msg.ta .bubble::before {
  content: ''; position: absolute; left: -6px; top: 12px;
  border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  border-right: 6px solid var(--theirs);
}
.msg.me .bubble {
  background: var(--mine);
  border-top-right-radius: 3px;
}
.msg.me .bubble::before {
  content: ''; position: absolute; right: -6px; top: 12px;
  border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  border-left: 6px solid var(--mine);
}
.typing .bubble { color: var(--muted); }
.typing .bubble::after { content: " ···"; animation: blink 1.2s infinite; }
@keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }

.hint-block {
  align-self: center;
  color: #b2b2b2;
  font-size: 12px;
  text-align: center;
  padding: 6px 12px;
  background: rgba(0,0,0,.045);
  border-radius: 4px;
}
.hint-block button { margin-left: 8px; border: 0; background: none; color: var(--green); font: inherit; font-weight: 600; cursor: pointer; }
.toast {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 64px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.78);
  color: #fff;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
  z-index: 30;
  display: none;
  pointer-events: none;
  white-space: nowrap;
}

/* 输入区 */
.composer {
  padding: 8px 10px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  padding-left: calc(env(safe-area-inset-left, 0px) + 10px);
  padding-right: calc(env(safe-area-inset-right, 0px) + 10px);
  background: #f7f7f7;           /* 微信输入栏浅灰底 */
  border-top: 1px solid #e5e5e5;
}
.composer-row { display: flex; gap: 8px; align-items: flex-end; }
.input-wrap { flex: 1; min-width: 0; }
.composer textarea {
  width: 100%;
  resize: none;
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  color: var(--text);
  padding: 9px 12px;
  font-size: 16px;
  line-height: 1.4;
  max-height: 120px;
  outline: none;
  font-family: inherit;
}
.composer button { flex: none; cursor: pointer; }
.composer .tool {
  width: 40px; height: 40px;
  background: transparent; border: none; color: #191919;
  font-size: 28px; line-height: 1; padding: 0;
  opacity: .55;
}
.composer .tool.on { opacity: 1; filter: drop-shadow(0 0 4px rgba(7,193,96,.5)); }
.send-btn {
  height: 40px; padding: 0 16px;
  border: none; border-radius: 6px;
  background: var(--green); color: #fff;
  font-size: 15px; font-weight: 500;
}
.composer button:disabled { opacity: .4; }

/* 待发送图片预览 */
.previews { display: none; flex-wrap: wrap; gap: 8px; padding: 0 4px 8px; }
.previews.show { display: flex; }
.preview { position: relative; }
.preview img {
  width: 64px; height: 64px; object-fit: cover;
  border-radius: 6px; display: block;
  border: 1px solid var(--border);
}
.previews .preview-x {
  position: absolute; top: -7px; right: -7px;
  width: 20px; height: 20px; padding: 0;
  border-radius: 50%; border: none;
  background: rgba(0,0,0,.7); color: #fff;
  font-size: 12px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}

/* 聊天气泡里的图片 */
.imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.msg-img { max-width: 160px; max-height: 200px; border-radius: 6px; display: block; }

/* 设置弹层 */
.mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  display: flex; align-items: flex-end;
  z-index: 20;
}
.mask.hidden { display: none; }
.sheet {
  width: 100%;
  max-height: min(92vh, calc(var(--vvh, 100vh) - 24px));
  background: #f7f7f7;
  border-radius: 16px 16px 0 0;
  display: flex; flex-direction: column;
}
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: #fff;
  border-radius: 16px 16px 0 0;
}
.sheet-head h2 { margin: 0; font-size: 17px; color: #000; }
.ghost {
  background: transparent; border: none; color: var(--muted);
  font-size: 20px; cursor: pointer; padding: 6px;
}
.sheet-body {
  padding: 16px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 12px;
}
.sheet-body label { font-size: 13px; color: var(--muted); }
.sheet-body input, .sheet-body textarea, .sheet-body select {
  width: 100%;
  background: #fff;
  border: 1px solid #e6e6e6;
  border-radius: 8px;
  color: var(--text);
  padding: 10px 12px;
  font-size: 16px;
  line-height: 1.5;
  outline: none;
  font-family: inherit;
}
/* 设置里的大文本框：够高、字号大、随内容自动伸展（封顶 60vh 后内部滚动）*/
.sheet-body textarea {
  padding: 12px 14px;
  resize: none;
  overflow-y: hidden;
  min-height: 110px;
  max-height: 60vh;
  scrollbar-width: thin;
}
#cfgPersona { min-height: 190px; }
#cfgStyleNotes { min-height: 150px; }
#cfgMemory { min-height: 100px; }
#cfgExamples { min-height: 170px; }
#cfgHabits { min-height: 92px; }
#packInput { min-height: 110px; }
.sheet-body .hint { color: var(--muted); font-size: 12px; }
.avatar-row { display: flex; align-items: center; gap: 10px; }
.avatar-preview {
  flex: none; width: 56px; height: 56px;
  border-radius: 8px;
  background: linear-gradient(135deg, #07c160, #7c5cff);
  background-size: cover; background-position: center;
  color: #fff; font-size: 24px; font-weight: 600;
  display: grid; place-items: center;
}
.avatar-preview.me { background: linear-gradient(135deg, #7a8a99, #4a5a6a); }
.avatar-row button {
  background: #fff; border: 1px solid #e6e6e6; border-radius: 8px;
  color: var(--text); padding: 8px 12px; font-size: 14px; cursor: pointer;
}
.sheet-body hr { border: none; border-top: 1px solid var(--border); width: 100%; }
.row { display: flex; gap: 10px; }
.row button { flex: 1; border: none; border-radius: 8px; padding: 12px; font-size: 15px; cursor: pointer; }
.primary { background: var(--green); color: #fff; font-weight: 500; }
.danger { background: transparent; color: var(--danger); border: 1px solid #f3c5c5; }
.test-btn {
  align-self: flex-start;
  background: #fff; border: 1px solid #e6e6e6; border-radius: 8px;
  color: var(--text); padding: 9px 14px; font-size: 14px; cursor: pointer;
}
.conn-result { font-size: 12px; line-height: 1.5; margin: 0; }
.conn-result.ok { color: var(--green); }
.conn-result.err { color: var(--danger); }
.footnote { font-size: 11px; color: var(--muted); line-height: 1.5; margin: 0; }

/* 左右分段选择（截图学习时选模仿哪一侧） */
.seg { display: flex; gap: 10px; }
.seg button {
  flex: 1; background: #fff; border: 1px solid #e6e6e6; border-radius: 8px;
  padding: 10px; font-size: 13px; color: var(--text); cursor: pointer;
}
.seg button.sel { background: var(--green); border-color: var(--green); color: #fff; font-weight: 500; }

/* 长期记忆分组 */
details.mem-group { background: #fff; border: 1px solid #e6e6e6; border-radius: 8px; padding: 2px 12px; }
.mem-group summary { font-size: 14px; padding: 9px 0; cursor: pointer; }
.mem-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 0; border-top: 1px solid #f0f0f0; font-size: 14px;
}
.mem-item .t { flex: 1; min-width: 0; word-break: break-word; }
.mem-item .x {
  flex: none; border: none; background: transparent; color: var(--danger);
  font-size: 14px; cursor: pointer; padding: 4px 6px;
}
.mem-add-row { display: flex; gap: 8px; align-items: center; }
.mem-add-row select { flex: none; width: 92px; }
.mem-add-row input { flex: 1; min-width: 0; }
.mem-add-row button { flex: none; }
.learn-pairs { display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.5; }
.learn-pairs .pair { background: #fff; border: 1px solid #eee; border-radius: 6px; padding: 6px 8px; }

/* 设置里的复选项 */
.check-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
.check-row input { flex: none; width: 18px; height: 18px; }

/* 会话列表（微信式：头像 + 名字/时间 + 最后一句 + 未读红点） */
.chat-list { display: flex; flex-direction: column; background: #fff; }
.chat-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 12px 14px; background: transparent; border: none;
  cursor: pointer; text-align: left; font: inherit; color: var(--text);
  position: relative;
}
.chat-row:active, .chat-row.active { background: #f0f0f0; }
/* 微信式分隔线：从头像右侧起的一条细线 */
.chat-row:not(:last-child)::after {
  content: ''; position: absolute; left: 76px; right: 0; bottom: 0;
  height: 1px; background: #efefef;
}
.chat-av {
  flex: none; width: 46px; height: 46px; border-radius: 6px;
  background: linear-gradient(135deg, #07c160, #7c5cff);
  background-size: cover; background-position: center;
  color: #fff; font-size: 19px; font-weight: 600;
  display: grid; place-items: center; position: relative;
}
.chat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.chat-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.chat-name {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 17px; font-weight: 500; color: #000;
}
.chat-time { flex: none; color: #b2b2b2; font-size: 12px; padding-top: 2px; }
.chat-prev { font-size: 14px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge {
  position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px;
  border-radius: 9px; background: var(--danger); color: #fff;
  font-size: 11px; font-weight: 600; line-height: 18px;
  text-align: center; padding: 0 4px; box-sizing: border-box;
}
.chat-x {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; color: #aaa;
  background: transparent; border: none; font-size: 13px; cursor: pointer; padding: 0;
  opacity: 0; transition: opacity .15s;
}
.chat-row.show-x .chat-x { opacity: 1; }
@media (hover: hover) { .chat-row:hover .chat-x { opacity: 1; } }
.chat-row:active .chat-x { color: #888; }

/* 新建人物：预设选择 */
.preset-list { display: flex; flex-direction: column; gap: 8px; }
.preset-row {
  display: flex; flex-direction: column; gap: 2px; width: 100%;
  padding: 10px 12px; background: #fff; border: 1px solid #eee;
  border-radius: 8px; cursor: pointer; text-align: left; font: inherit; color: var(--text);
}
.preset-row:active { background: #f0f0f0; }
.preset-name { font-size: 15px; font-weight: 600; }
.preset-tag { font-size: 12px; color: var(--muted); }
.preset-habit { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <header class="topbar">
    <!-- 会话列表头（默认首页） -->
    <div id="listHeader" class="topbar-row">
      <span class="nav" style="visibility:hidden">＋</span>
      <div class="meta">
        <div class="name">AI 陪伴</div>
        <div class="status" id="listStatus">—</div>
      </div>
      <button class="nav dots" id="newChatTop" title="新建人物">＋</button>
    </div>
    <!-- 聊天头（进入某个聊天时显示） -->
    <div id="chatHeader" class="topbar-row">
      <button type="button" class="nav back" id="openChats" title="返回列表">‹</button>
      <div class="meta">
        <div class="name" id="personaName">还没设人物</div>
        <div class="status" id="status">未连接</div>
      </div>
      <button class="nav dots" id="openSettings" title="设置">···</button>
    </div>
  </header>

  <!-- 会话列表屏（首页）：所有人物各占一条，点进去聊 -->
  <main id="listScreen" class="list-screen">
    <div id="chatList" class="chat-list"></div>
  </main>

  <main id="chat" class="chat" aria-live="polite"></main>

  <form id="composer" class="composer">
    <div id="previews" class="previews"></div>
    <div class="composer-row">
      <button type="button" id="imgBtn" class="tool" title="发图片/拍一张">＋</button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
      <div class="input-wrap">
        <textarea id="input" rows="1" enterkeyhint="send"></textarea>
      </div>
      <button id="send" type="button" class="send-btn">发送</button>
    </div>
  </form>

  <!-- 设置弹层 -->
  <div id="settingsMask" class="mask hidden">
    <div class="sheet">
      <div class="sheet-head">
        <h2>设置</h2>
        <button class="ghost" id="closeSettings">✕</button>
      </div>
      <div class="sheet-body">
        <label>接入点地址（默认方舟，别改）</label>
        <input id="cfgBase" type="text" placeholder="https://ark.cn-beijing.volces.com/api/v3" />

        <label>API Key <span class="hint">（只存在本机浏览器）</span></label>
        <input id="cfgKey" type="password" placeholder="粘贴方舟 API Key" autocomplete="off" />

        <label>模型 / 接入点 ID <span class="hint">（识图用，视觉/vision 模型的 ep-）</span></label>
        <input id="cfgModel" type="text" placeholder="例如 ep-xxxxxxxx 或 doubao 视觉模型" />

        <button type="button" id="testConn" class="test-btn">测试连接</button>
        <p id="connResult" class="conn-result" hidden></p>

        <hr />
        <label>云函数地址 <span class="hint">（选填：填了聊天走云端，切后台/杀掉 App 也能收到锁屏回复）</span></label>
        <input id="cfgFn" type="text" placeholder="https://xxx.apigw.tencentcs.com/release/" />
        <div class="row">
          <button type="button" class="test-btn" id="subBtn">订阅锁屏推送</button>
        </div>
        <p id="subResult" class="conn-result" hidden></p>
        <p class="hint" style="margin:0;">需先部署云函数；iPhone 必须从「添加到主屏幕」的 App 里点订阅，Safari 网页不支持。</p>

        <hr />

        <label>人物名字</label>
        <input id="cfgName" type="text" placeholder="例如：阿哲" />

        <label>TA 的头像 <span class="hint">（显示在 TA 的消息左边）</span></label>
        <div class="avatar-row">
          <div class="avatar-preview" id="avatarPreview">Ta</div>
          <button type="button" id="avatarBtn">选择图片</button>
          <button type="button" id="avatarClear">恢复默认</button>
          <input type="file" id="avatarInput" accept="image/*" hidden />
        </div>

        <label>我的头像 <span class="hint">（显示在我的消息右边）</span></label>
        <div class="avatar-row">
          <div class="avatar-preview me" id="myAvatarPreview">我</div>
          <button type="button" id="myAvatarBtn">选择图片</button>
          <button type="button" id="myAvatarClear">恢复默认</button>
          <input type="file" id="myAvatarInput" accept="image/*" hidden />
        </div>

        <label>人格设定 <span class="hint">（决定它是谁、怎么说话）</span></label>
        <textarea id="cfgPersona" rows="8" placeholder="粘贴人格卡：它是谁、你们的关系、说话风格、口头禅、底线……"></textarea>

        <label>说话风格校准卡 <span class="hint">（去 AI 味的核心，可手写，也可用下面的截图学习）</span></label>
        <textarea id="cfgStyleNotes" rows="6" placeholder="它真实的说话方式：句长、语气词、标点、emoji 习惯、称呼、典型句式……"></textarea>

        <label>从真实聊天截图学习</label>
        <div id="learnShots" class="previews"></div>
        <div class="row">
          <button type="button" class="test-btn" id="learnBtn">添加聊天截图</button>
          <input type="file" id="learnInput" accept="image/*" multiple hidden />

      const kbUp = vh < baseH - 80;                          // 高度骤降 = 键盘弹起
      document.documentElement.style.setProperty('--vvh', vh + 'px');
      document.documentElement.style.height = vh + 'px';
      document.body.style.height = vh + 'px';
      // 阻止 iOS 把整个页面上推（内部 .chat/.sheet-body 自己滚，body 不需要滚）
      document.documentElement.style.overflow = kbUp ? 'hidden' : '';
      document.body.style.overflow = kbUp ? 'hidden' : '';
      window.scrollTo(0, 0);
      document.querySelectorAll('.mask:not(.hidden)').forEach((m) => { m.style.height = vh + 'px'; });
      if (kbUp && document.body.classList.contains('in-chat')) {
        requestAnimationFrame(() => { el.chat.scrollTop = el.chat.scrollHeight; });
      }
    };
    window.visualViewport.addEventListener('resize', onVv);
    window.visualViewport.addEventListener('scroll', onVv);
    onVv();
  }

  let cfg = loadJSON(CFG_KEY, DEFAULTS);
  let history = loadJSON(HIST_KEY, []);   // [{role, content, images?:[dataUri], t}]

  // 老记录没有时间戳：按每分钟一条向现在倒推补齐（仅用于时间展示），补完持久化一次
  function ensureHistoryTimes() {
    let changed = false;
    const n = history.length;
    history.forEach((m, i) => {
      if (!m.t || typeof m.t !== 'number') {
        m.t = Date.now() - (n - 1 - i) * 60000;
        changed = true;
      }
    });
    if (changed) saveHistory();
  }
  let pendingImages = [];                 // 待发送的图片 dataUri
  let busy = false;

  let mem = loadMemory();                 // {upto,lastRun,items}
  let chats = null;                       // {active, list:[...]} 多人物列表
  initChats();                            // 首启把单聊迁移成第一个人物；已有则切到活跃人物
  let memBusy = false;                    // 记忆整理并发锁
  let learnImages = [];                   // 截图 dataUri，仅内存，绝不持久化
  let learnSide = 'left';                 // 模仿左/右侧气泡
  let learnBusy = false;
  let learntPairs = [];                   // 本次分析产出、待复核的样例
  let learntNotes = '';                   // 本次分析产出、待复核的风格卡

  // ---------- 持久化 ----------
  function loadJSON(key, fallback) {
    const clone = (v) => (Array.isArray(v) ? v.slice() : { ...v });
    let v = null;
    try { v = JSON.parse(localStorage.getItem(key) || 'null'); }
    catch (e) { v = null; }
    if (v == null) return clone(fallback);
    // 数组类型必须按数组读；存坏了（对象/字符串）就重置，避免 {...[]} 退化成 {} 导致 .push 崩溃
    if (Array.isArray(fallback)) return Array.isArray(v) ? v : clone(fallback);
    return { ...fallback, ...v };
  }
  function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

  // 只给最近若干条保留图片，旧的降级成「[图片]」文字，防爆 localStorage
  function saveHistory(source = history) {
    stampActiveChat(source);   // 会话列表的「最后一句/时间」跟着每次落盘更新
    const flat = source.map((m) => ({ ...m }));
    let previous = [];
    try {
      const stored = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
      if (Array.isArray(stored)) previous = stored;
    } catch (e) {}
    for (let i = 0; i < flat.length - KEEP_IMG_RECENT; i++) {
      if (flat[i].images && flat[i].images.length) {
        const t = (flat[i].content || '').trim();
        flat[i].content = t ? t + ' [图片已清理]' : '[图片已清理]';
        flat[i].images = [];
      }
    }
    // localStorage is small on mobile. Keep text before old image data, but
    // never report a message as sent when even its text cannot be saved.
    for (let i = -1; i < flat.length; i++) {
      if (i >= 0) {
        if (!flat[i].images || !flat[i].images.length) continue;
        const t = (flat[i].content || '').trim();
        flat[i].content = t ? t + ' [图片已清理]' : '[图片已清理]';
        flat[i].images = [];
      }
      try {
        saveJSON(HIST_KEY, flat);
        const newlyDropped = flat.reduce((n, m, index) => {
          const hadImage = source[index] && source[index].images && source[index].images.length;
          const stillHasImage = m.images && m.images.length;
          const old = previous[index];
          const wasStored = old && old.images && old.images.length;
          return n + (hadImage && !stillHasImage && (!old || wasStored) ? 1 : 0);
        }, 0);
        if (newlyDropped) flashToast('聊天存储空间有限：' + newlyDropped + ' 条图片已清理；请导出聊天备份');
        return true;
      } catch (e) {
        if (e.name !== 'QuotaExceededError' && e.name !== 'NS_ERROR_DOM_QUOTA_REACHED' && e.code !== 22 && e.code !== 1014) return false;
      }
    }
    return false;
  }

  // ---------- 长期记忆持久化（坏数据全量自愈） ----------
  function uid() {
    return 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function loadMemory() {
    let v = null;
    try { v = JSON.parse(localStorage.getItem(MEM_KEY) || 'null'); }
    catch (e) { v = null; }
    if (!v || typeof v !== 'object' || Array.isArray(v)) return { upto: 0, lastRun: 0, items: [] };

    let upto = Number(v.upto);
    if (!isFinite(upto) || upto < 0) upto = 0;
    if (upto > history.length) upto = history.length;   // 历史被外部删短时夹紧
    let lastRun = Number(v.lastRun);
    if (!isFinite(lastRun) || lastRun < 0) lastRun = 0;

    const items = [];
    const seen = {};
    if (Array.isArray(v.items)) {
      for (const it of v.items) {
        if (!it || typeof it !== 'object' || !isCat(it.cat)) continue;
        const text = typeof it.text === 'string' ? it.text.trim() : '';
        if (!text) continue;
        let id = typeof it.id === 'string' && it.id ? it.id : uid();
        if (seen[id]) id = uid();
        seen[id] = 1;
        let t = Number(it.t);
        if (!isFinite(t) || t < 0) t = Date.now();
        items.push({ id, cat: it.cat, text: text.slice(0, MEM_TEXT_MAX), t });
        if (items.length >= MEM_ITEMS_MAX) break;
      }
    }
    return { upto, lastRun, items };
  }

  // 返回 false = localStorage 写不进去（通常是超限）；交调用方决定提示
  function saveMem() {
    try { saveJSON(MEM_KEY, mem); return true; }
    catch (e) { return false; }
  }

  // ---------- 状态 ----------
  function configured() { return !!(cfg.apiKey && cfg.model); }

  function refresh() {
    el.name.textContent = cfg.name || '还没设人物';
    if (!configured()) {
      el.status.textContent = '未连接（去设置填 API Key 和模型）';
      el.status.className = 'status';
    } else {
      // 已配置：状态行平时隐藏，只在输入中/失败/切后台时临时出现
      el.status.textContent = '';
      el.status.className = 'status idle';
    }
  }

  // ================= 多人物：人物列表 / 切换 =================
  // （CHATS_KEY / PERS_FIELDS 在顶部常量区，initChats 启动即用）
  function chatSnapshot() {           // 从当前 cfg 抄一份人物字段
    const o = {};
    for (const k of PERS_FIELDS) o[k] = cfg[k];
    return o;
  }
  function applyChatSnapshot(s) {     // 把列表项的人物字段写进 cfg
    for (const k of PERS_FIELDS) {
      const v = s ? s[k] : undefined;
      cfg[k] = (v === undefined || v === null) ? '' : v;
    }
  }
  function syncChatSnapshot() {       // cfg 变化后同步回活跃列表项
    if (!chats || !chats.list) return;
    const c = chats.list.find((x) => x.id === chats.active);
    if (!c) return;
    Object.assign(c, chatSnapshot());
    saveJSON(CHATS_KEY, chats);
  }

  // 会话列表预览：微信单聊最后一条直接显示内容，不加「我:/Ta:」前缀
  function previewOf(m) {
    if (!m) return '';
    const t = String(m.content || '').trim().replace(/\s+/g, ' ');
    const hasImg = m.images && m.images.length;
    if (!t) return hasImg ? '[图片]' : '';
    return (hasImg ? '[图片] ' : '') + t.slice(0, 30);
  }
  // 把活跃人物的历史尾条抄进列表项（saveHistory 会自动跑）
  function stampActiveChat(source = history) {
    if (!chats || !chats.list) return;
    const c = chats.list.find((x) => x.id === chats.active);
    if (!c) return;
    const last = source && source.length ? source[source.length - 1] : null;
    c.lastText = last ? previewOf(last) : '';
    c.lastAt = (last && last.t) || c.lastAt || Date.now();
    try { saveJSON(CHATS_KEY, chats); } catch (e) {}
  }
  // 老记录 / 迁移过来的人物没有预览：启动时补一次
  function backfillChatStamps() {
    if (!chats || !chats.list) return;
    let changed = false;
    for (const c of chats.list) {
      if (c.lastAt && c.lastText != null) continue;
      try {
        const h = loadJSON(c.histKey || ('ai_companion_hist_' + c.id), []);
        const last = h.length ? h[h.length - 1] : null;
        c.lastAt = (last && last.t) || Date.now();
        c.lastText = last ? previewOf(last) : '';
        changed = true;
      } catch (e) {}
    }
    if (changed) { try { saveJSON(CHATS_KEY, chats); } catch (e) {} }
  }

  // 首次启动：把现有单聊迁移成第一个人物（沿用旧 history/mem 键，不复制数据）；
  // 已有列表：切到活跃人物，把它的历史/记忆装进来
  function initChats() {
    const legacyHist = HIST_KEY, legacyMem = MEM_KEY;
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(CHATS_KEY) || 'null'); } catch (e) { raw = null; }
    if (!raw || !Array.isArray(raw.list) || !raw.list.length) {
      const c = Object.assign({ id: 'c0', histKey: legacyHist, memKey: legacyMem, t: Date.now() }, chatSnapshot());
      if (!c.proactive) c.proactive = true;
      chats = { active: 'c0', list: [c] };
      saveJSON(CHATS_KEY, chats);
      return;
    }
    chats = raw;
    const c = chats.list.find((x) => x.id === chats.active) || chats.list[0];
    if (!c) return;
    chats.active = c.id;
    HIST_KEY = c.histKey || ('ai_companion_hist_' + c.id);
    MEM_KEY = c.memKey || ('ai_companion_mem_' + c.id);
    c.histKey = HIST_KEY; c.memKey = MEM_KEY;
    applyChatSnapshot(c);
    saveJSON(CFG_KEY, cfg);
    saveJSON(CHATS_KEY, chats);
    history = loadJSON(HIST_KEY, []);
    mem = loadMemory();
    ensureHistoryTimes();
  }

  function switchChat(id) {
    if (id === chats.active) {                       // 点活跃人物 = 进聊天
      const cur = chats.list.find((x) => x.id === id);
      if (cur && cur.unread) {                        // 快路径也要清未读红点
        cur.unread = 0;
        saveJSON(CHATS_KEY, chats);
      }
      setChatOpen(true);
      return;
    }
    // 回复进行中也允许切换：先把当前人物的消息落盘，再让进行中的 turn「脱钩」
    // （runTurn 闭包会自己检测到 chats.active 已变，回复到达后静默写回本会话+亮红点）
    syncChatSnapshot();
    saveHistory();
    try { saveMem(); } catch (e) {}
    if (busy) {
      busy = false;
      activePlan = null;
      activeTurnId = null;
      el.send.disabled = false;
      el.status.textContent = '';
      el.status.className = 'status idle';
    }
    const c = chats.list.find((x) => x.id === id);
    if (!c) return;
    chats.active = id;
    HIST_KEY = c.histKey || ('ai_companion_hist_' + c.id);   // 旧版数据兜底
    MEM_KEY = c.memKey || ('ai_companion_mem_' + c.id);
    if (c.histKey !== HIST_KEY || c.memKey !== MEM_KEY) {
      c.histKey = HIST_KEY; c.memKey = MEM_KEY;
      saveJSON(CHATS_KEY, chats);
    }
    applyChatSnapshot(c);
    saveJSON(CFG_KEY, cfg);
    c.unread = 0;                        // 进了聊天就视为已读
    saveJSON(CHATS_KEY, chats);
    history = loadJSON(HIST_KEY, []);
    mem = loadMemory();
    ensureHistoryTimes();
    refresh();
    renderHistory();
    setChatOpen(true);
    // 云端主动消息是单例快照：切人物就把当前人物同步上去，避免定时器还拿上一个人物的快照发言（串角色）
    void syncState();
    // 被后台打断的恢复只属于发起的那个人物，切到它时再续
    if (resumePending && resumeChatId === id && document.visibilityState === 'visible') {
      void resumeTurn();
    }
  }

  function isChatOpen() { return document.body.classList.contains('in-chat'); }
  // 首页会话列表 / 聊天屏 互相切换；回列表时顺手重绘（刷新最后一句、未读数）
  function setChatOpen(open) {
    document.body.classList.toggle('in-chat', !!open);
    if (!open) { renderChatList(); return; }
    // 显示后再滚：display:none 状态下 scrollHeight 为 0，先渲染后显示会停在最顶上
    requestAnimationFrame(() => {
      el.chat.scrollTop = el.chat.scrollHeight;
      requestAnimationFrame(() => { el.chat.scrollTop = el.chat.scrollHeight; });
    });
  }
  // 有消息进来但人不在聊天屏 → 记未读，列表上亮红点
  function noteUnread() {
    if (!chats || isChatOpen()) return;
    const c = chats.list.find((x) => x.id === chats.active);
    if (!c) return;
    c.unread = Math.min((c.unread || 0) + 1, 99);
    try { saveJSON(CHATS_KEY, chats); } catch (e) {}
    renderChatList();
  }

  function fmtChatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    if (d.toDateString() === new Date().toDateString()) return p(d.getHours()) + ':' + p(d.getMinutes());
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  function renderChatList() {
    const box = el.chatList;
    if (!box) return;
    el.listStatus.textContent = chats.list.length + ' 个人物';
    box.innerHTML = '';
    const frag = document.createDocumentFragment();
    const collapseAllX = (except) => {
      box.querySelectorAll('.chat-row.show-x').forEach((r) => { if (r !== except) r.classList.remove('show-x'); });
    };
    chats.list.slice().sort((a, b) => (b.lastAt || b.t || 0) - (a.lastAt || a.t || 0)).forEach((c) => {
      // 用 div 而非 button：里面要嵌删除按钮（button 里不能套 button）
      const row = document.createElement('div');
      row.className = 'chat-row';
      row.setAttribute('role', 'button');
      row.tabIndex = 0;
      const av = document.createElement('span');
      av.className = 'chat-av';
      if (c.avatar) av.style.backgroundImage = 'url(' + c.avatar + ')';
      av.textContent = c.avatar ? '' : (c.name || '?').slice(0, 1);
      if (c.unread) {
        const bd = document.createElement('span');
        bd.className = 'badge';
        bd.textContent = c.unread > 99 ? '99+' : c.unread;
        av.appendChild(bd);
      }
      const main = document.createElement('span');
      main.className = 'chat-main';
      const top = document.createElement('span');
      top.className = 'chat-top';
      const nm = document.createElement('span');
      nm.className = 'chat-name';
      nm.textContent = c.name || '未命名';
      const tm = document.createElement('span');
      tm.className = 'chat-time';
      tm.textContent = fmtChatTime(c.lastAt || c.t);
      top.appendChild(nm); top.appendChild(tm);
      const prev = document.createElement('span');
      prev.className = 'chat-prev';
      prev.textContent = c.lastText || '还没有对话';
      main.appendChild(top); main.appendChild(prev);
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'chat-x'; x.textContent = '✕'; x.title = '删除这个人物';
      x.addEventListener('click', (ev) => { ev.stopPropagation(); deleteChat(c.id); });
      row.appendChild(av); row.appendChild(main); row.appendChild(x);
      // 微信列表不常驻删除钮：长按 / 右键 / 桌面悬停才露出 ✕
      let holdTimer = null, holdFired = false;
      const fireHold = () => {
        holdFired = true;
        collapseAllX(row);
        row.classList.add('show-x');
        if (navigator.vibrate) navigator.vibrate(15);
      };
      row.addEventListener('touchstart', () => {
        holdFired = false;
        holdTimer = setTimeout(fireHold, 500);
      }, { passive: true });
      const cancelHold = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } };
      row.addEventListener('touchend', cancelHold);
      row.addEventListener('touchmove', cancelHold);
      row.addEventListener('touchcancel', cancelHold);
      row.addEventListener('contextmenu', (ev) => {
        ev.preventDefault();
        collapseAllX(row);
        row.classList.add('show-x');
      });
      row.addEventListener('click', () => {
        if (holdFired) { holdFired = false; return; }   // 长按抬手的 click：保留 ✕，不进会话
        if (row.classList.contains('show-x')) {          // 露出状态下的普通点击：只收起
          row.classList.remove('show-x');
          return;
        }
        collapseAllX(null);
        switchChat(c.id);
      });
      // 键盘可达
      row.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          collapseAllX(null);
          switchChat(c.id);
        }
      });
      frag.appendChild(row);
    });
    box.appendChild(frag);
  }

  function newChat() {           // ＋ 新建：先弹预设选择
    renderPresetList();
    el.presetMask.classList.remove('hidden');
  }
  // 从预设/空白/克隆 创建人物并进入设置
  function newChatFromPreset(src) {
    const id = 'c' + Date.now().toString(36);
    const base = src === 'clone' ? chatSnapshot()
      : src && typeof src === 'object' ? pickPresetFields(src)
      : {};
    const c = Object.assign({
      id,
      histKey: 'ai_companion_hist_' + id,
      memKey: 'ai_companion_mem_' + id,
      t: Date.now(),
    }, base);
    for (const k of PERS_FIELDS) if (c[k] === undefined || c[k] === null) c[k] = '';
    if (!c.name) c.name = '新人物';
    if (typeof c.proactive !== 'boolean') c.proactive = true;
    chats.list.push(c);
    saveJSON(CHATS_KEY, chats);
    el.presetMask.classList.add('hidden');
    switchChat(id);
    appendHint('已新建人物，去设置里微调人设。');
    openSettings();
  }
  function pickPresetFields(p) {
    const o = {};
    for (const k of PERS_FIELDS) if (p[k] !== undefined) o[k] = p[k];
    return o;
  }
  function renderPresetList() {
    const box = el.presetList;
    box.innerHTML = '';
    const frag = document.createDocumentFragment();
    const add = (title, tag, habit, src) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'preset-row';
      const nm = document.createElement('div'); nm.className = 'preset-name'; nm.textContent = title;
      const tg = document.createElement('div'); tg.className = 'preset-tag'; tg.textContent = tag;
      b.appendChild(nm); b.appendChild(tg);
      if (habit) {
        const h = document.createElement('div'); h.className = 'preset-habit';
        h.textContent = '作息：' + habit;
        b.appendChild(h);
      }
      b.addEventListener('click', () => newChatFromPreset(src));
      frag.appendChild(b);
    };
    add('＋ 空白人物', '自己从头填人设、风格和日常习惯', '', null);
    add('复制当前人物', '克隆「' + (cfg.name || '当前人物') + '」的人设和习惯', '', 'clone');
    for (const p of PRESETS) add(p.name, p.tagline, p.habits, p);
    box.appendChild(frag);
  }

  function deleteChat(id) {
    if (chats.list.length <= 1) { flashToast('至少保留一个人物'); return; }
    if (chats.active === id && (busy || paBusy)) { flashToast('回复进行中，稍后再删'); return; }
    const idx = chats.list.findIndex((x) => x.id === id);
    if (idx < 0) return;
    const c = chats.list[idx];
    if (!confirm('删除「' + (c.name || '未命名') + '」？它的聊天记录和长期记忆会一并删除。')) return;
    try { localStorage.removeItem(c.histKey || ('ai_companion_hist_' + c.id)); } catch (e) {}
    try { localStorage.removeItem(c.memKey || ('ai_companion_mem_' + c.id)); } catch (e) {}
    if (resumePending && resumeChatId === id) { resumePending = false; resumeChatId = null; }
    const wasActive = chats.active === id;
    chats.list.splice(idx, 1);
    if (wasActive) {
      const next = chats.list[0];
      chats.active = next.id;
      HIST_KEY = next.histKey || ('ai_companion_hist_' + next.id);
      MEM_KEY = next.memKey || ('ai_companion_mem_' + next.id);
      applyChatSnapshot(next);
      saveJSON(CFG_KEY, cfg);
      history = loadJSON(HIST_KEY, []);
      mem = loadMemory();
      ensureHistoryTimes();
      refresh();
      renderHistory();
    }
    saveJSON(CHATS_KEY, chats);
    setChatOpen(false);   // 删除在列表里进行，停在列表
    // best-effort 联动云端：从 roster 移除该人物，删掉其快照/节奏/未补单消息（失败不影响本地）
    void syncState({ deletedIds: [id] });
  }

  // 往【非活跃】人物的历史里写云端补单消息（不切 UI、不播动画），只更新它的列表行预览/未读。
  // mutator(h) 返回 {save:bool 是否落盘, bump:bool 是否未读+1}，返回 null/{} 表示无操作。
  // 人物已删除时返回 {gone:true}（调用方应 ack 丢弃这条云端消息）。
  function mutateOtherChatHistory(chatId, mutator) {
    const c = chats.list.find((x) => x.id === chatId);
    if (!c) return { gone: true };
    const hk = c.histKey || ('ai_companion_hist_' + c.id);
    let h = [];
    try { h = JSON.parse(localStorage.getItem(hk) || '[]'); } catch (e) { h = []; }
    if (!Array.isArray(h)) h = [];
    const r = mutator(h) || {};
    if (r.save) {
      try { localStorage.setItem(hk, JSON.stringify(h)); } catch (e) { return { error: true }; }
      const last = h[h.length - 1];
      if (last) {
        c.lastText = previewOf(last);
        c.lastAt = Number(last.t) || Date.now();
      }
    }
    if (r.bump) c.unread = (c.unread || 0) + 1;
    if (r.save || r.bump) {
      saveJSON(CHATS_KEY, chats);
      if (!isChatOpen()) renderChatList();   // 在聊天页不重绘列表，返回时 setChatOpen(false) 会刷
    }
    return r;
  }

  // ---------- 图片压缩 ----------
  function compressImage(file, maxEdge, quality) {
    maxEdge = maxEdge || IMG_MAX;
    quality = quality != null ? quality : IMG_QUALITY;
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        let { width, height } = img;
        if (width > maxEdge || height > maxEdge) {
          const s = Math.min(maxEdge / width, maxEdge / height);
          width = Math.round(width * s);
          height = Math.round(height * s);
        }
        const c = document.createElement('canvas');
        c.width = width; c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
      img.src = url;
    });
  }

  // 头像：中心裁成正方形 96px
  function makeAvatar(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const size = 96;
        const s = Math.min(img.width, img.height);
        const sx = (img.width - s) / 2;
        const sy = (img.height - s) / 2;
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
        resolve(c.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
      img.src = url;
    });
  }

  // ---------- 渲染 ----------
  // ---------- 微信式时间标签 ----------
  let lastLabelT = 0;            // 上一条时间标签对应的时刻
  let lastMsgRole = '';          // 上一条气泡是谁发的
  let lastMsgT = 0;              // 上一条气泡的时刻
  const TIME_GAP_MS = 5 * 60 * 1000;   // 间隔 5 分钟显示时间

  function isSameDay(a, b) {
    const d = new Date(a), e = new Date(b);
    return d.getFullYear() === e.getFullYear() && d.getMonth() === e.getMonth() && d.getDate() === e.getDate();
  }
  function dayDiffToNow(t) {
    const x = new Date(t); x.setHours(0, 0, 0, 0);
    const y = new Date(); y.setHours(0, 0, 0, 0);
    return Math.round((y - x) / 86400000);
  }
  function clockCN(d) {
    const h = d.getHours();
    const seg = h < 5 ? '凌晨' : h < 9 ? '早上' : h < 11 ? '上午' : h < 13 ? '中午' : h < 18 ? '下午' : '晚上';
    return seg + (h % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function timeLabelText(t) {
    const d = new Date(t), now = new Date(), c = clockCN(d);
    if (isSameDay(t, now.getTime())) return c;
    const dd = dayDiffToNow(t);
    if (dd === 1) return '昨天 ' + c;
    if (dd > 1 && dd <= 6 && d.getFullYear() === now.getFullYear()) return '周' + '日一二三四五六'[d.getDay()] + ' ' + c;
    if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + c;
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + c;
  }
  function addTimeLabel(text) {
    const div = document.createElement('div');
    div.className = 'time-label';
    div.textContent = text;
    el.chat.appendChild(div);
  }
  function maybeTimeLabel(t) {
    if (!lastLabelT || !isSameDay(lastMsgT, t) || t - lastLabelT >= TIME_GAP_MS) {
      addTimeLabel(timeLabelText(t));
    }
    lastLabelT = Math.max(lastLabelT, t);
  }

  // ---------- 模型输出 JSON 的容错抽取（风格学习与记忆整理共用） ----------
  function tryParse(s) {
    try { return JSON.parse(s); } catch (e) { return undefined; }
  }

  // 字符串感知的括号扫描：从 start 处的开括号起，深度首次归零的结束位置（不含），找不到 -1
  function scanBalanced(text, start) {
    const open = text[start];
    const close = open === '{' ? '}' : ']';
    let depth = 0;
    let quote = null;
    for (let i = start; i < text.length; i++) {
      const ch = text[i];
      if (quote) {
        if (ch === '\\') { i++; continue; }
        if (ch === quote) quote = null;
        continue;
      }
      if (ch === '"' || ch === "'" || ch === '`') { quote = ch; continue; }
      if (ch === open) depth++;
      else if (ch === close) {
        depth--;
        if (depth === 0) return i + 1;
      }
    }
    return -1;
  }

  // 只动结构不动正文：去 BOM/零宽字符、修尾逗号（用 charCode 判断，避免源码含不可见字符）
  function cleanStruct(s) {
    let out = '';
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c === 0xFEFF || (c >= 0x200B && c <= 0x200F)) continue;
      out += s[i];
    }
    return out.replace(/,\s*([}\]])/g, '$1');
  }

  function extractJSON(text) {
    if (typeof text !== 'string') return null;
    let s = text.trim();
    if (!s) return null;

    // 1. 去 ```json 围栏
    const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence) s = fence[1].trim();

    // 2. 直接解析
    let v = tryParse(s);
    if (v !== undefined) return v;

    // 3. 找最先出现的 { 或 [，平衡截取首个完整对象
    let first = -1;
    const fc = s.indexOf('{');
    const fs = s.indexOf('[');
    if (fc >= 0 && (fs < 0 || fc < fs)) first = fc;
    else if (fs >= 0) first = fs;
    if (first >= 0) {
      const candidates = [];
      const end = scanBalanced(s, first);
      if (end > first) candidates.push(s.slice(first, end));
      // 4. 贪婪兜底：首个开括号到同类最后一个闭括号
      const closeCh = s[first] === '{' ? '}' : ']';
      const last = s.lastIndexOf(closeCh);
      if (last > first) candidates.push(s.slice(first, last + 1));
      for (const t of candidates) {
        v = tryParse(t);
        if (v !== undefined) return v;
        v = tryParse(cleanStruct(t));
        if (v !== undefined) return v;
      }
    }

    // 5. 原文清洗后最后一试
    v = tryParse(cleanStruct(s));
    return v === undefined ? null : v;
  }

  // ---------- 对话样例解析 ----------
  function parseExamples(raw) {
    const out = [];
    const lines = (raw || '').split('\n').map((s) => s.trim()).filter(Boolean);
    for (const line of lines) {
      const m = line.match(/^(我|你|Ta|ta|他|她|对方|A)\s*[:：]\s*([\s\S]*)$/);
      if (!m) continue;
      const text = m[2].trim();
      if (!text) continue;
      out.push({ role: m[1] === '我' ? 'user' : 'assistant', content: text });
    }
    return out;
  }

  // ---------- 学习产出样例的合并（保护手写区） ----------
  const LEARN_MARK = '# 学习样例';
  const normKey = (s) => (s || '').replace(/\s+/g, ' ').trim().toLowerCase();
  const flatOne = (s) => (s || '').replace(/\s*\n\s*/g, ' ').trim();

  // 把「我:…/Ta:…」文本按相邻 user→assistant 配成对
  function parsePairsFromText(text) {
    const msgs = parseExamples(text);
    const pairs = [];
    for (let i = 0; i + 1 < msgs.length; i++) {
      if (msgs[i].role === 'user' && msgs[i + 1].role === 'assistant') {
        pairs.push({ user: msgs[i].content, ta: msgs[i + 1].content });
      }
    }
    return pairs;
  }

  // 新 pairs 合并进 examples 原文：Ta 回复归一化去重，学习区 FIFO 限 30 组/总 80 行，手写区不动
  function mergeLearntExamples(raw, newPairs) {
    raw = raw || '';
    const markIdx = raw.lastIndexOf(LEARN_MARK);
    const hasMark = markIdx >= 0;
    const head = (hasMark ? raw.slice(0, markIdx) : raw).replace(/\s+$/, '');
    const pairs = parsePairsFromText(hasMark ? raw.slice(markIdx + LEARN_MARK.length) : '');

    const seen = {};
    parseExamples(head).forEach((m) => { if (m.role === 'assistant') seen[normKey(m.content)] = 1; });
    pairs.forEach((p) => { seen[normKey(p.ta)] = 1; });

    for (const p of newPairs || []) {
      const u = flatOne(p.user);
      const t = flatOne(p.ta);
      if (!u || !t || u.length > 100 || t.length > 100) continue;
      const k = normKey(t);
      if (seen[k]) continue;
      seen[k] = 1;
      pairs.push({ user: u, ta: t });
    }

    const headLines = head ? head.split('\n').length : 0;
    const budget = EX_LINES_MAX - headLines - (head ? 1 : 0) - 1;   // 末项 = 标记行
    const maxGroups = Math.max(0, Math.min(LEARN_PAIRS_MAX, Math.floor(budget / 2)));
    const finalPairs = pairs.slice(-maxGroups);

    let out = head;
    if (finalPairs.length) {
      if (out) out += '\n';
      out += LEARN_MARK + '\n' + finalPairs.map((p) => '我: ' + p.user + '\nTa: ' + p.ta).join('\n');
    }
    return out;
  }

  // ---------- 系统提示词 ----------
  // 自动记忆 → 注入文本。预算内 bond 优先占位，显示顺序按 CATS（bond 在最后）
  function buildMemoryBlock() {
    if (!mem.items.length) return '';
    const groups = {};
    CATS.forEach((c) => { groups[c.key] = []; });
    for (const it of mem.items) (groups[it.cat] || groups.fact).push(it);
    CATS.forEach((c) => groups[c.key].sort((a, b) => b.t - a.t));

    const priority = ['bond', 'fact', 'like', 'event', 'goal', 'relation'];
    const chosen = {};
    priority.forEach((k) => { chosen[k] = []; });
    let used = 0;
    let progressed = true;
    while (progressed && used < MEM_INJECT_CHARS) {
      progressed = false;
      for (const k of priority) {
        const idx = chosen[k].length;
        if (idx >= groups[k].length) continue;
        const line = '- ' + groups[k][idx].text;
        if (used + line.length + 1 > MEM_INJECT_CHARS) continue;
        chosen[k].push(groups[k][idx]);
        used += line.length + 1;
        progressed = true;
      }
    }

    const blocks = [];
    for (const c of CATS) {
      if (!chosen[c.key].length) continue;
      blocks.push(CAT_NAMES[c.key] + '\n' + chosen[c.key].map((it) => '- ' + it.text).join('\n'));
    }
    return blocks.join('\n');
  }

  const REAL_RULES =
    '【真人微信说话规则（这是真人聊天，不是写文章，也不是客服）】\n' +
    '1. 禁止排比、对仗、分点、"首先/其次/总之/总的来说"、首尾呼应、升华主题这类总结腔和小作文。\n' +
    '2. 禁止模板式共情与套话："我能理解你的感受""谢谢你愿意告诉我""你已经很棒了"之类不许说。\n' +
    '3. 禁止为了延续对话而问空洞问题（"你觉得呢？""今天过得怎么样？"），除非这个人物此时真的会问。\n' +
    '4. 不要每句都先照顾情绪再回应、不要复述总结用户的话、不要每问必答；可以只接住其中一个点，甚至跑题。\n' +
    '5. "哈哈"只在真的好笑时用，不拿它垫场；emoji/表情只按风格卡的真实习惯使用，没有这个习惯就一个都别用。\n' +
    '6. 允许极短回复：嗯、哦、行、好、？、在忙、一个表情，都可以。\n' +
    '7. 允许语气词、省略、不完整句、口头表达的粗糙感；允许不完美回应——没接住、敷衍一下、先说自己的事，都符合真人。\n' +
    '8. 用口语不用书面语，不用敬语，不堆砌感叹号；不知道就说不知道或含糊带过，不许编造。\n' +
    '9. 回复长度跟着对方上一句话的长度、话题分量和你们的关系走：对方说六个字，你不要回六十字。\n' +
    '10. 你一次想说好几句时，每句单独占一行（用回车换行分隔），系统会自动把它们拆成多个微信气泡依次发出；绝不要在一行里连写好几句话。\n' +
    '11. 上方「说话风格校准卡」来自 TA 的真实聊天记录，是说话方式的最高依据；与其下方任何规则冲突，一律以校准卡为准。\n' +
    '12. 直接输出要发给对方的话。严禁输出思考过程、思路、分析、计划、提纲、"### 回复"之类的标题或任何 Markdown 标记——你在心里想，不要写出来。';

  function buildSystem() {
    const persona = String(cfg.persona || '').trim();
    const notes = (cfg.styleNotes || '').trim();
    const habits = (cfg.habits || '').trim();
    const memory = cfg.memory.trim();
    const name = cfg.name.trim();
    const memBlock = buildMemoryBlock();
    const parts = [];
    parts.push('你要扮演一个具体的人，和屏幕前的用户说话。');
    if (name) parts.push('你扮演的人叫「' + name + '」。');
    if (persona) parts.push('【人物设定】\n' + persona);
    if (habits) parts.push('【你的日常习惯（作息/饭点——聊天和主动找他都要贴合）】\n' + habits);
    if (notes) parts.push(
      '【说话风格校准卡】\n' +
      '以下要点提取自 TA 的真实微信聊天记录，是 TA 真实的说话方式。与其他任何规则冲突时，说话方式一律以此为准，严格贴合，不要美化。\n' +
      notes
    );
    if (memory) parts.push('【关于用户 · 手写补充（最高优先级，始终相信）】\n' + memory);
    if (memBlock) parts.push('【关于用户 · 长期记忆（自动整理，供理解上下文）】\n' + memBlock);
    parts.push(REAL_RULES);
    parts.push(
      '【其他】\n' +
      '1. 始终以这个人物的身份、语气、口吻说话，不要跳出来说"我是AI"。\n' +
      '2. 如果用户在消息里附带了图片，就认真"看懂"图片内容并自然地回应（识别图中是什么、有什么细节、对方可能想表达的）。\n' +
      '3. 回复用中文，口语化，长度贴合人物风格。'
    );
    return parts.join('\n\n');
  }

  // ---------- 组装请求消息 ----------
  function buildMessages(includeIncomplete = false) {
    const system = buildSystem();
    const messages = [{ role: 'system', content: system }];
    let used = system.length;
    let exampleUsed = 0;
    for (const ex of parseExamples(cfg.examples).slice(0, EX_INJECT)) {
      const size = ex.content.length + 32;
      if (exampleUsed + size > EXAMPLE_CHARS || used + size > CONTEXT_CHARS) break;
      messages.push({ role: ex.role, content: ex.content });
      exampleUsed += size;
      used += size;
    }
    // 从最新消息向前选取，优先保留最近对话；只重发本轮用户的图片。
    const selected = [];
    let recentUserKept = false;
    for (let i = history.length - 1; i >= 0 && selected.length < 30; i--) {
      const m = history[i];
      if (!m || typeof m !== 'object') continue;
      const role = m.role === 'user' ? 'user' : 'assistant';
      const imgs = role === 'user' && Array.isArray(m.images) ? m.images : [];
      const text = typeof m.content === 'string' ? m.content : '';
      const hasOldImage = imgs.length > 0 && i !== history.length - 1;
      const content = (text || (hasOldImage ? '[图片]' : ' ')) + (hasOldImage && text ? ' [附图]' : '') +
        (m.incomplete && !includeIncomplete ? ' [回复中断]' : '');
      const size = content.length + 32;
      if (selected.length && used + size > CONTEXT_CHARS && !(includeIncomplete && role === 'user' && !recentUserKept)) break;
      used += size;
      if (role === 'user') recentUserKept = true;
      if (imgs.length && i === history.length - 1) {
        selected.push({ role, content: [{ type: 'text', text }, ...imgs.map((u) => ({ type: 'image_url', image_url: { url: u } }))] });
      } else {
        selected.push({ role, content });
      }
    }
    return messages.concat(selected.reverse());
  }

  // ---------- 调用方舟（流式打字机 + 超时，绝不死等） ----------
  // 处理一行 SSE：有增量就回调；返回 true = 收到 [DONE]
  function sseLine(line, onDelta, state) {
    const t = line.trim();
    if (!t.startsWith('data:')) return false;
    const data = t.slice(5).trim();
    if (!data) return false;
    if (data === '[DONE]') { state.done = true; return true; }
    try {
      const j = JSON.parse(data);
      const choice = j.choices && j.choices[0];
      const c = choice && choice.delta && choice.delta.content;
      if (c) onDelta(c);
      if (choice && choice.finish_reason) state.finishReason = choice.finish_reason;
    } catch (e) {}
    return false;
  }

  // 模型偶发把"思路/分析"连同"### 回复"一起吐出来：实时截掉思考段。
  // 返回 { planning:true/false, reply: 可显示文本（还在思考时为 null） }
  function splitPlan(raw) {
    const s = String(raw || '');
    const thinkRe = /(?:^|[\n。])[ \t]*(?:#{1,6}[ \t]*)?(?:思路|思考(?:过程)?|分析(?:过程)?|推理(?:过程)?|内心(?:OS|os|独白)?|脑内小剧场)\s*[:：]?/;
    const tm = s.match(thinkRe);
    if (!tm) return { planning: false, reply: s };
    const tail = s.slice(tm.index + tm[0].length);
    // 思考段之后的"回复"出口（取最后一个，防思考里提到这个词）
    const exitRe = /(?:^|[\n。])[ \t]*(?:#{1,6}[ \t]*)?(?:最终(?:回复|回答)|回复内容|回复|回答|台词|她?要说的话|开口说)\s*[:：]?[ \t]*(?=\n|$)/g;
    let m, cut = -1;
    while ((m = exitRe.exec(tail)) !== null) cut = m.index + m[0].length;
    if (cut < 0) {
      // 也兼容"回复：xxx"写在同一行
      const inline = tail.match(/(?:最终)?回复\s*[:：]\s*(?=\S)/);
      if (inline) return { planning: false, reply: tail.slice(inline.index + inline[0].length) };
      return { planning: true, reply: null };
    }
    return { planning: false, reply: tail.slice(cut) };
  }
  // 定稿用：拿到出口后的回复；模型漏写出口时退回原文，避免空消息
  function sanitizeReply(raw) {
    const r = splitPlan(raw);
    return r.reply != null ? r.reply.trim() : String(raw || '').trim();
  }

  async function callArk(messages, onDelta, opts) {
    opts = opts || {};
    const url = (cfg.base.replace(/\/+$/, '')) + '/chat/completions';
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), opts.timeout || 60000);
    const payload = {
      model: opts.model || cfg.model,
      messages: messages,
      temperature: opts.temperature != null ? opts.temperature : 0.8,
      max_tokens: opts.maxTokens || 2048,
      stream: opts.stream === false ? false : true,
    };
    let hadDelta = false;
    const emitDelta = (delta) => { hadDelta = true; onDelta(delta); };
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
        body: JSON.stringify(payload),
        signal: ctrl.signal,
      });
      if (!res.ok) {
        let detail = '';
        try { detail = await res.text(); } catch (e) {}
        throw new Error('HTTP ' + res.status + (detail ? '：' + detail.slice(0, 300) : ''));
      }

      // 老浏览器没有流读取器时降级为一次性响应
      if (!res.body || !res.body.getReader) {
        const j = await res.json();
        const content = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if (content) emitDelta(content);
        if (j.choices && j.choices[0] && j.choices[0].finish_reason === 'length') {
          const err = new Error('回复达到长度上限'); err.code = 'STREAM_INTERRUPTED'; throw err;
        }
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      const state = { done: false, finishReason: '' };
      while (true) {
        const r = await reader.read();
        if (r.done) break;
        buf += decoder.decode(r.value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, idx);
          buf = buf.slice(idx + 1);
          if (sseLine(line, emitDelta, state)) break;
        }
        if (state.done) break;
      }
      // 个别实现不发尾部换行，残留内容再处理一次
      if (!state.done && buf.trim()) sseLine(buf, emitDelta, state);
      if (!state.done || state.finishReason === 'length') {
        const err = new Error(state.finishReason === 'length' ? '回复达到长度上限' : '连接提前结束');
        err.code = 'STREAM_INTERRUPTED';
        throw err;
      }
    } catch (e) {
      if (hadDelta && e.code !== 'STREAM_INTERRUPTED') {
        const err = new Error('连接提前结束'); err.code = 'STREAM_INTERRUPTED'; throw err;
      }
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  async function send() {
    if (!configured()) syncFromFields();
    if (busy) return;
    const text = el.input.value.trim();
    if (!text && pendingImages.length === 0) {
      flashToast('输入框是空的，先打字再发送');
      return;
    }
    if (!configured()) {
      openSettings();
      el.connResult.hidden = false;
      el.connResult.className = 'conn-result err';
      el.connResult.textContent = '还没配好：填「API Key」和「模型/接入点 ID」，再点「测试连接」或「保存」。';
      appendHint('⚠ 还没配好 API Key / 模型，去 ··· 设置里填一下。');
      return;
    }

    const images = pendingImages.slice();
    pendingImages = [];
    renderPreviews();

    const turnId = uid();
    const now = Date.now();
    const msg = { role: 'user', content: text, turnId: turnId, t: now };
    if (images.length) msg.images = images;
    history.push(msg);
    if (!saveHistory()) {
      history.pop();
      pendingImages = images;
      renderPreviews();
      flashToast('本机存储空间不足，消息未发送；请先导出聊天备份');
      return;
    }
    if (images.length) {
      try {
        const saved = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
        const last = saved[saved.length - 1];
        if (!last || !last.images || !last.images.length) {
          flashToast('本机空间紧张：这张图片未长期保存，请导出聊天备份');
        }
      } catch (e) {}
    }
    addBubble('me', text, images, now);
    el.input.value = '';
    autosize();
    await runTurn(turnId);
  }

  function buildCallPlan() {
    return { messages: buildMessages(), model: cfg.model };
  }

  // 云端 /chat：返回完整回复（切后台后由云函数继续跑，回复经 Web Push 送达）
  async function remoteChat(plan, turnId) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 90000);
    try {
      const res = await cloudFetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: plan.messages,
          model: plan.model,
          turnId: turnId,
          chatId: chats.active,
          name: cfg.name || '',
        }),
        signal: ctrl.signal,
      });
      let j = null;
      try { j = await res.json(); } catch (e) {}
      if (!res.ok) throw new Error((j && j.error) ? j.error : ('云函数 HTTP ' + res.status));
      return { reply: typeof j.reply === 'string' ? j.reply : '', incomplete: j.incomplete === true };
    } finally {
      clearTimeout(timer);
    }
  }

  // 整段回复到手后，快速逐字放出（按 \n 自然分多个气泡）
  function revealFull(full, onUpdate) {
    return new Promise((resolve) => {
      let i = 0;
      const step = () => {
        i += 3;
        onUpdate(full.slice(0, Math.min(i, full.length)));
        el.chat.scrollTop = el.chat.scrollHeight;
        if (i < full.length) setTimeout(step, 16);
        else resolve();
      };
      step();
    });
  }

  // 切后台瞬间把本轮交给云函数：云端重跑并推送回复到锁屏（每个 turnId 只交一次）
  async function cloudRelay(plan, turnId) {
    if (!(cfg.fnUrl || '').trim()) return false;
    if (cloudCompleted.has(turnId)) return true;
    if (cloudFlights.has(turnId)) return cloudFlights.get(turnId);
    const flight = (async () => {
      try {
        const res = await cloudFetch('/relay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: plan.messages, model: plan.model,
            turnId: turnId, chatId: chats.active, name: cfg.name || '',
          }),
        });
        if (!res.ok) throw new Error('云端接管 HTTP ' + res.status);
        cloudCompleted.add(turnId);
        if (cloudCompleted.size > 100) cloudCompleted.delete(cloudCompleted.values().next().value);
        return true;
      } catch (e) {
        console.warn('云端接管失败', e);
        return false;
      } finally {
        cloudFlights.delete(turnId);
      }
    })();
    cloudFlights.set(turnId, flight);
    return flight;
  }

  // 等模型回复一轮（假定 history 末尾是待回复的用户消息）。
  // 前台一律直连方舟真流式（首字 1~2 秒）；切后台由云函数接管推送；弱网时云函数兜底。
  async function runTurn(turnId, isRetry, viaCloud) {
    const plan = buildCallPlan();
    const useCloud = !!(cfg.fnUrl || '').trim();
    const ownerChatId = chats.active;        // 本轮回复的归属人物（回复到达时可能已被切走）
    const isDetached = () => chats.active !== ownerChatId;
    // 发送前输入框有焦点才在回复后 refocus：用户点发送按钮阅读时，不强制弹键盘打断
    const hadInputFocus = document.activeElement === el.input;
    let retrying = false;
    activePlan = plan;
    activeTurnId = turnId;
    busy = true;
    bgDuringTurn = false;
    el.send.disabled = true;
    el.status.textContent = '对方正在输入…';
    el.status.className = 'status';

    // 多气泡：模型每输出一个换行，就定稿当前气泡、冒出下一个
    const first = addBubble('ta', '');
    first.classList.add('typing');
    const lineBubbles = [first];
    let acc = '';          // 模型原始输出（可能含思考段）
    let shown = '';        // 过滤后实际显示
    const syncBubbles = () => {
      const lines = shown.split('\n');
      while (lineBubbles.length < lines.length) {
        lineBubbles[lineBubbles.length - 1].classList.remove('typing');
        lineBubbles.push(addBubble('ta', ''));
      }
      lineBubbles.forEach((b) => b.classList.remove('typing'));
      for (let i = 0; i < lines.length; i++) {
        lineBubbles[i].querySelector('.bubble').textContent = lines[i];
      }
      // 模型刚输出换行、下一句还没来：最后一个空气泡显示输入态
      if (lines[lines.length - 1] === '') lineBubbles[lineBubbles.length - 1].classList.add('typing');
      el.chat.scrollTop = el.chat.scrollHeight;
    };

    try {
      if (viaCloud) {
        // 仅弱网降级时走这里：云端整段返回，快速回放
        const result = await remoteChat(plan, turnId);
        const full = sanitizeReply(result.reply);
        await revealFull(full, (t) => { acc = t; shown = splitPlan(t).reply || ''; syncBubbles(); });
        if (result.incomplete) { const err = new Error('回复达到长度上限'); err.code = 'STREAM_INTERRUPTED'; throw err; }
      } else {
        // 前台真流式：模型边想边出字；思考段实时藏住，多气泡实时生长
        await callArk(plan.messages, (delta) => {
          acc += delta;
          if (isDetached()) return;          // 已切到别人：只攒文本，不动当前界面
          const sp = splitPlan(acc);
          shown = sp.reply == null ? '' : sp.reply;
          syncBubbles();
        }, { model: plan.model });
      }

      // 用户已切到别的会话/新建了人物：回复只静落发起会话+亮红点，不碰当前界面
      if (isDetached()) {
        const parked = sanitizeReply(acc);
        if (parked) parkAssistantTo(ownerChatId, turnId, parked, false);
        return;
      }

      // 收尾：剥离思考段，丢掉空白行对应的气泡，保留的逐句定稿
      acc = sanitizeReply(acc);
      shown = acc;
      syncBubbles();
      let lines = acc.split('\n');
      while (lineBubbles.length > lines.length) {
        const b = lineBubbles.pop();
        b.remove();
      }
      for (let i = lines.length - 1; i >= 0; i--) {
        if (!lines[i].trim()) {
          lineBubbles[i].remove();
          lineBubbles.splice(i, 1);
          lines.splice(i, 1);
        }
      }
      lineBubbles.forEach((b) => b.classList.remove('typing'));
      acc = lines.join('\n');
      // 锁屏推送可能已抢先把同一 turnId 的回复补进来了，不能重复
      const alreadyAnswered = history.some((m) => m.role === 'assistant' && m.turnId === turnId);
      if (alreadyAnswered) {
        lineBubbles.forEach((b) => b.remove());
        return;
      }
      if (acc) {
        history.push({ role: 'assistant', content: acc, turnId: turnId, t: Date.now() });
        if (!saveHistory()) appendHint('⚠ 回复已显示，但本机存储已满；请立即导出聊天备份。');
        noteUnread();
      } else {
        lineBubbles.forEach((b) => b.remove());
        addBubble('ta', '（空回复）');
      }
      el.status.textContent = '';
      el.status.className = 'status idle';
      markActive();             // 刚说过话，推后她下次主动的时间
      void maybeAutoMemory();   // 后台静默整理，不 await、不影响界面
      void syncState();         // 把最新对话同步给云端

      // 本轮切到过后台：像微信一样在回复到达时弹通知
      if (!alreadyAnswered && bgDuringTurn && acc && 'Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(cfg.name || 'Ta', { body: acc.split('\n')[0], icon: 'icon.png' });
        } catch (e) {}
      }
    } catch (e) {
      lineBubbles.forEach((b) => b.remove());
      const raw = e.message || String(e);

      // 页面在后台 / 刚切后台不久：请求是被系统挂起掐断的，不算失败，保留用户消息，回前台自动续
      const bgInterrupt = document.hidden || (hiddenAt && Date.now() - hiddenAt < 20000);
      if (bgInterrupt) {
        // 直连流被系统掐断：交给云函数重跑，回复走锁屏推送；云端模式本身就会推
        if (!viaCloud) void cloudRelay(plan, turnId);
        resumePending = true;
        resumeChatId = ownerChatId;
        if (!isDetached()) {
          el.status.textContent = '已切到后台，回复会推送到锁屏';
          el.status.className = 'status';
        }
        return;
      }

      // 已切到别的会话才失败：不回滚消息（会误删别的会话的消息）、不弹错、不抢重试，
      // 等切回发起会话或重开 App 时由 resumeTurn 续跑；长回复中断则把半成品落库
      if (isDetached()) {
        if (e.code === 'STREAM_INTERRUPTED') {
          const partial = splitPlan(acc).reply;
          if (partial && partial.trim()) parkAssistantTo(ownerChatId, turnId, partial.trim(), true);
          return;
        }
        resumePending = true;
        resumeChatId = ownerChatId;
        return;
      }

      if (e.code === 'STREAM_INTERRUPTED') {
        if (history.some((m) => m.role === 'assistant' && m.turnId === turnId)) {
          renderHistory();
          return;
        }
        const partial = splitPlan(acc).reply;
        if (partial && partial.trim()) {
          history.push({ role: 'assistant', content: partial.trim(), turnId, incomplete: true, t: Date.now() });
          if (!saveHistory()) appendHint('⚠ 回复中断，且本机空间不足，未能保存已显示的文字。');
          noteUnread();
          renderHistory();
        }
        appendHint('⚠ ' + raw + (partial && partial.trim() ? '，可点“继续生成”。' : '，请重新发送。'));
        el.status.textContent = '回复中断';
        el.status.className = 'status err';
        return;
      }

      // 前台网络抖动（Wi-Fi/蜂窝切换、弱网）：悄悄自动重试；配了云函数则改走云端兜底
      const netBlip = /Failed to fetch|NetworkError|Load failed|fetch failed/i.test(raw);
      if (netBlip && !isRetry) {
        retrying = true;
        el.status.textContent = useCloud && !viaCloud ? '网络抖动，正在切换云端…' : '网络抖动，正在重试…';
        el.status.className = 'status';
        await new Promise((r) => setTimeout(r, 1500));
        return runTurn(turnId, true, useCloud);
      }

      let tip = raw;
      if (/abort|Failed to fetch|NetworkError|Load failed|fetch failed/i.test(raw)) tip = '网络问题，连不上方舟（' + raw + '）';
      else if (raw.indexOf('401') >= 0) tip = 'API Key 不对或过期（HTTP 401），去设置换成「推理 API Key」';
      else if (raw.indexOf('404') >= 0) tip = '模型/接入点 ID 找不到（HTTP 404），确认是 ep- 开头';
      else if (raw.indexOf('429') >= 0) tip = '请求太频繁或额度用完了（HTTP 429）';
      appendHint('⚠ 发送失败：' + tip);
      el.status.textContent = '发送失败';
      el.status.className = 'status err';
      history.pop();            // 回滚刚才那条用户消息
      saveHistory();
    } finally {
      bgDuringTurn = false;
      if (retrying) return;     // 交给递归的那一轮管理 busy / 发送按钮
      if (isDetached()) return; // 全局 busy/UI 已属于新会话，这一轮只负责落库，别碰
      busy = false;
      activePlan = null;
      activeTurnId = null;
      el.send.disabled = false;
      void consumePushQueue();
      if (resumePending && document.visibilityState === 'visible') {
        hiddenAt = 0;
        void resumeTurn();
      }
      if (!document.hidden && hadInputFocus) el.input.focus();
    }
  }

  // 回前台 / 重开 App 时，把"已发出但没收到回复"的最后一条用户消息重新跑一轮
  async function resumeTurn() {
    if (busy || !configured() || !resumePending) return;
    if (resumeChatId !== chats.active) return;   // 恢复只属于发起人物，切错人物不动
    const last = history[history.length - 1];
    if (!last || last.role !== 'user') { resumePending = false; resumeChatId = null; return; }
    if (document.visibilityState !== 'visible') return;   // 还在后台就再等等
    resumePending = false;
    await sleep((cfg.fnUrl || '').trim() ? 3000 : 800);  // 云端模式：先等锁屏推送补单
    const relay = cloudFlights.get(last.turnId);
    if (relay) await Promise.race([relay, sleep(12000)]);
    await consumePushQueue();
    const cur = history[history.length - 1];
    if (document.visibilityState === 'visible' && cur && cur.role === 'user') {
      await runTurn(cur.turnId || uid());
    }
  }

  async function continueIncomplete(turnId) {
    const last = history[history.length - 1];
    if (busy || !last || !last.incomplete || last.turnId !== turnId) return;
    busy = true;
    el.send.disabled = true;
    el.status.textContent = '正在继续回复…';
    el.status.className = 'status';
    const live = addBubble('ta', '');
    live.classList.add('typing');
    let suffix = '';
    try {
      const messages = buildMessages(true);
      messages.push({ role: 'user', content: '你上一条消息因连接中断而未说完。请紧接着未完的地方继续，只输出后续内容，不要重复已经说过的文字。' });
      await callArk(messages, (delta) => {
        suffix += delta;
        live.querySelector('.bubble').textContent = suffix;
      }, { maxTokens: 1024 });
      const more = sanitizeReply(suffix);
      if (!more) throw new Error('模型没有返回后续内容');
      last.content += more;
      delete last.incomplete;
      if (!saveHistory()) appendHint('⚠ 本机存储已满，续写内容未能保存；请立即导出备份。');
      renderHistory();
      el.status.textContent = '';
      el.status.className = 'status idle';
      markActive();
      void maybeAutoMemory();
      void syncState();
    } catch (e) {
      const partial = splitPlan(suffix).reply;
      if (partial && partial.trim()) {
        last.content += partial.trim();
        if (!saveHistory()) appendHint('⚠ 本机存储已满，续写内容未能保存。');
      }
      renderHistory();
      appendHint('⚠ 继续生成失败：' + (e.message || e));
      el.status.textContent = '回复仍未完成';
      el.status.className = 'status err';
    } finally {
      live.remove();
      busy = false;
      el.send.disabled = false;
    }
  }

  function autosize() {
    el.input.style.height = 'auto';

  function growField(t) {
    if (!t || t.offsetParent === null) return;   // 隐藏时不算高度
    t.style.height = 'auto';
    const cap = Math.floor(window.innerHeight * 0.6);
    const h = Math.min(t.scrollHeight, cap);
    t.style.height = h + 'px';
    t.style.overflowY = t.scrollHeight > cap ? 'auto' : 'hidden';
  }
  function growAllFields() {
    document.querySelectorAll('.sheet-body textarea').forEach(growField);
  }
  document.querySelectorAll('.sheet-body textarea').forEach((t) =>
    t.addEventListener('input', () => growField(t)));
  window.addEventListener('resize', growAllFields);

  function exportHistory() {
    const out = el.historyResult;
    out.hidden = false;
    try {
      const payload = {
        type: 'ai-companion-history', version: 2, exportedAt: new Date().toISOString(),
        personaName: cfg.name, messages: history, memory: mem,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const safeName = (cfg.name || '角色').replace(/[\\/:*?"<>|\s]+/g, '_');
      a.download = 'ai-companion-' + safeName + '-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      out.className = 'conn-result ok';
      out.textContent = '已生成当前角色「' + (cfg.name || '') + '」的备份（' + history.length + ' 条聊天、' + mem.items.length +
        ' 条记忆）。只含当前角色，其他角色请逐个导出；文件含私人内容，请妥善保存。';
    } catch (e) {
      out.className = 'conn-result err';
      out.textContent = '导出失败：' + (e.message || e);
    }
  }

  async function importHistory(file) {
    const out = el.historyResult;
    out.hidden = false;
    if (busy) { out.className = 'conn-result err'; out.textContent = '请等当前回复结束再恢复备份。'; return; }
    if (!file || file.size > 200 * 1024 * 1024) {
      out.className = 'conn-result err'; out.textContent = '请选择不超过 200 MB 的聊天备份 JSON 文件。'; return;
    }
    try {
      const data = JSON.parse(await file.text());
      if (!data || data.type !== 'ai-companion-history' || ![1, 2].includes(data.version) ||
          !Array.isArray(data.messages) || data.messages.length > 10000) throw new Error('备份格式不正确');
      const restored = data.messages.map((m) => {
        if (!m || (m.role !== 'user' && m.role !== 'assistant') || typeof m.content !== 'string') {
          throw new Error('备份中有无效消息');
        }
        const t = Number(m.t);
        const item = { role: m.role, content: m.content, t: Number.isFinite(t) && t > 0 ? t : Date.now() };
        if (typeof m.turnId === 'string') item.turnId = m.turnId;
        if (typeof m.paId === 'string') item.paId = m.paId;
        if (m.role === 'assistant' && m.incomplete === true) item.incomplete = true;
        if (Array.isArray(m.images)) {
          item.images = m.images.filter((s) => typeof s === 'string' && /^data:image\//.test(s));
        }
        return item;
      });
      let restoredMem = { upto: 0, lastRun: 0, items: [] };
      if (data.version === 2) {
        if (!data.memory || !Array.isArray(data.memory.items)) throw new Error('备份中的长期记忆格式不正确');
        const items = data.memory.items.slice(0, MEM_ITEMS_MAX).map((it) => {
          if (!it || !isCat(it.cat) || typeof it.text !== 'string' || !it.text.trim()) {
            throw new Error('备份中有无效记忆');
          }
          return { id: typeof it.id === 'string' && it.id ? it.id : uid(),
            cat: it.cat, text: it.text.trim().slice(0, MEM_TEXT_MAX),
            t: Number.isFinite(Number(it.t)) ? Number(it.t) : Date.now() };
        });
        restoredMem = {
          upto: Math.min(Math.max(0, Number(data.memory.upto) || 0), restored.length),
          lastRun: Number(data.memory.lastRun) || 0, items,
        };
      }
      let warning = data.version === 1 ? '旧格式备份不含记忆，当前长期记忆会清空。' : '长期记忆也会从备份恢复。';
      if (data.personaName && data.personaName !== cfg.name) warning += ' 备份角色与当前角色不同，请检查人物设置。';
      if (!confirm('确定替换当前 ' + history.length + ' 条聊天和 ' + mem.items.length + ' 条记忆吗？\n' + warning + '\n建议先导出当前备份。')) return;
      if (busy) throw new Error('当前正在回复，请稍后再恢复');
      const oldHistory = localStorage.getItem(HIST_KEY);
      if (!saveHistory(restored)) throw new Error('本机存储空间不足，原聊天记录未更改');
      try {
        saveJSON(MEM_KEY, restoredMem);
      } catch (e) {
        try {
          if (oldHistory == null) localStorage.removeItem(HIST_KEY);
          else localStorage.setItem(HIST_KEY, oldHistory);
        } catch (rollbackError) {
          throw new Error('记忆保存失败，聊天记录可能已恢复；请重新导入备份');
        }
        throw new Error('记忆保存失败，原聊天和记忆未更改');
      }
      history = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
      mem = restoredMem;
      renderHistory();
      out.className = 'conn-result ok';
      out.textContent = '已恢复 ' + history.length + ' 条聊天和 ' + mem.items.length + ' 条记忆。较早的图片可能只保留为「图片已清理」标记。';
    } catch (e) {
      out.className = 'conn-result err';
      out.textContent = '恢复失败：' + (e.message || e);
    }
  }

  async function testConn() {
    syncFromFields();
    const key = cfg.apiKey;
    const model = cfg.model;
    const base = cfg.base.replace(/\/+$/, '');
    const out = el.connResult;
    if (!key || !model) {
      out.hidden = false;
      out.className = 'conn-result err';
      out.textContent = '先填好「API Key」和「模型 / 接入点 ID」。';
      return;
    }
    out.hidden = false;
    out.className = 'conn-result';
    out.textContent = '正在测试…';
    try {
      const res = await fetch(base + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: model, messages: [{ role: 'user', content: '你好' }], max_tokens: 4, stream: false }),
      });
      if (res.ok) {
        out.className = 'conn-result ok';
        out.textContent = '✅ 连接成功，配置已自动保存，直接去聊天吧。';
      } else {
        let d = ''; try { d = await res.text(); } catch (e) {}
        out.className = 'conn-result err';
        out.textContent = '❌ HTTP ' + res.status + '：' + d.slice(0, 260);
        if (res.status === 401) out.textContent += ' ← API Key 不对/过期（别把 AK/SK 里的 Secret Key 当 API Key）';
        else if (res.status === 404) out.textContent += ' ← 模型/接入点 ID 找不到，确认是 ep- 开头';
      }
    } catch (e) {
      out.className = 'conn-result err';
      out.textContent = '❌ 无法连接方舟：' + (e.message || e) + '（通常是浏览器跨域拦截，或手机网络不通）。';
    }
  }

    el.learnShots.classList.add('show');

  async function learnStyle() {
    if (learnBusy) return;
    if (!configured()) { flashToast('先在上面填好 API Key 和模型'); return; }
    if (learnImages.length === 0) { flashToast('先添加聊天截图'); return; }

    learnBusy = true;
    el.learnRun.disabled = true;
    el.learnResult.hidden = false;
    el.learnResult.className = 'conn-result';
    el.learnResult.textContent = '正在分析 ' + learnImages.length + ' 张截图…';
    el.learnReview.hidden = true;

    const sideText = learnSide === 'left' ? '左侧气泡' : '右侧气泡';
    const sideWord = learnSide === 'left' ? '左' : '右';
    const system =
      '你是资深的中文聊天语言风格分析师。任务：阅读用户提供的微信聊天截图，精确识别指定一侧说话人的真实语言风格，并输出结构化 JSON。' +
      '你只做客观分析和忠实摘录：不美化、不润色、不补全、不发明台词，不写任何 JSON 以外的文字。';
    const text =
      '下面是 ' + learnImages.length + ' 张微信聊天截图，按时间先后排列。\n\n' +
      '【气泡方位常识】微信聊天界面：屏幕左侧气泡是「手机主人的聊天对象」发的；屏幕右侧绿色气泡是「这台手机的主人」发的。忽略状态栏、时间条、未读红点、输入框等非对话内容。\n\n' +
      '【本次要模仿的人】请只分析并模仿【' + sideText + '】的说话人，下文称「目标人物」；另一侧称「对方」。目标人物在我们这里的角色名是「' + cfg.name + '」，仅供你理解，输出中不要提及这个名字。\n\n' +
      '【任务】\n' +
      '1. 逐张 OCR 气泡文字。同一侧连续多条消息合并为该侧的一次发言，原文照录，条间用空格连接。\n' +
      '2. 产出 styleNotes：有证据才写、没证据不写、不许编造。覆盖：句长与一次发几条；语气词、口头禅、方言、高频词；标点习惯；emoji/表情包/颜文字的频率与种类；对对方的称呼；回应节奏（秒回短打/跑题/反问/只回自己关心的点）；情绪表达方式；典型的开场、收尾、拒绝、安慰句式。\n' +
      '3. 摘录 8~16 组 examples：每组 user 是「对方」的发言，ta 是紧随其后「目标人物」的回应。必须忠于截图原文，保留语气词、不完整句、口语错别字和标点；不许重写、翻译、补全。相似内容只留一条。\n\n' +
      '【方位映射】本次目标人物在【' + sideWord + '】侧：严格按该侧归属 user/ta，不要搞反。\n\n' +
      '【输出】只输出一个 JSON 对象：\n' +
      '{"styleNotes":"可用换行分点写","examples":[{"user":"对方的话","ta":"目标人物的话"}]}\n' +
      '若截图里辨认不出任何对话气泡，输出 {"error":"无法识别聊天内容"}。';

    const content = [{ type: 'text', text: text }];
    learnImages.forEach((u) => content.push({ type: 'image_url', image_url: { url: u } }));

    let out = '';
    try {
      await callArk(
        [{ role: 'system', content: system }, { role: 'user', content: content }],
        (s) => { out += s; },
        { maxTokens: 2200, temperature: 0.2, timeout: 120000 }
      );
      const obj = extractJSON(out);
      if (!obj || typeof obj !== 'object') throw new Error('模型没有返回可识别的 JSON');
      if (obj.error) throw new Error(String(obj.error));

      learntNotes = typeof obj.styleNotes === 'string' ? obj.styleNotes.trim() : '';
      const rawPairs = Array.isArray(obj.examples) ? obj.examples : [];
      learntPairs = [];
      for (const p of rawPairs) {
        if (!p || typeof p !== 'object') continue;
        const u = flatOne(p.user);
        const t = flatOne(p.ta);
        if (!u || !t) continue;
        learntPairs.push({ user: u, ta: t });
        if (learntPairs.length >= LEARN_ADD_MAX) break;
      }
      if (!learntNotes && learntPairs.length === 0) throw new Error('分析结果为空，换几张更清晰的截图试试');

      el.learnNotesPrev.textContent = learntNotes || '（没有产出风格卡）';
      el.learnPairsPrev.innerHTML = '';
      learntPairs.forEach((p) => {
        const d = document.createElement('div');
        d.className = 'pair';
        d.style.whiteSpace = 'pre-wrap';
        d.textContent = '我: ' + p.user + '\nTa: ' + p.ta;
        el.learnPairsPrev.appendChild(d);
      });
      el.learnResult.hidden = true;
      el.learnReview.hidden = false;
    } catch (e) {
      el.learnResult.className = 'conn-result err';
      el.learnResult.textContent = '分析失败：' + (e.message || e);
    } finally {
      learnBusy = false;
      el.learnRun.disabled = false;
    }
  }
