<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#07c160" />
  <title>AI 陪伴</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
:root {
  --topbar: #ededed;          /* 顶栏/聊天底，微信灰 */
  --chatbg: #ededed;
  --composer-bg: #f7f7f7;      /* 输入区 */
  --panel: #ffffff;
  --border: #e0e0e0;
  --text: #191919;
  --muted: #9a9a9a;
  --green: #07c160;            /* 微信绿 */
  --mine: #95ec69;             /* 我方气泡 */
  --theirs: #ffffff;           /* 对方气泡 */
  --danger: #fa5151;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--chatbg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  display: flex;
  flex-direction: column;
  -webkit-tap-highlight-color: transparent;
}

/* 顶栏 */
.topbar {
  display: flex; align-items: center; gap: 4px;
  padding: 10px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  background: var(--topbar);
  border-bottom: 1px solid var(--border);
}
.topbar .nav {
  flex: none; width: 36px; height: 36px;
  display: grid; place-items: center;
  background: transparent; border: none; color: #191919;
  font-size: 24px; line-height: 1; cursor: pointer; padding: 0;
}
.topbar .nav.back { font-size: 32px; padding-bottom: 4px; }
.topbar .nav.dots { letter-spacing: -3px; font-weight: 700; }
.topbar .meta { flex: 1; min-width: 0; text-align: center; }
.topbar .name {
  font-size: 17px; font-weight: 600; color: #000;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar .status { font-size: 12px; color: var(--muted); margin-top: 1px; }
.status.ok { color: var(--green); }
.status.err { color: var(--danger); }

/* 聊天区 */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 14px 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
  background: var(--chatbg);
}
.msg { max-width: 76%; display: flex; }
.msg.me { align-self: flex-end; }
.msg.ta { align-self: flex-start; gap: 8px; align-items: flex-start; }
.avatar-img {
  flex: none; width: 36px; height: 36px;
  border-radius: 6px;
  background: linear-gradient(135deg, #07c160, #7c5cff);
  background-size: cover; background-position: center;
  color: #fff; font-size: 16px; font-weight: 600;
  display: grid; place-items: center;
}
.bubble {
  padding: 9px 12px;
  border-radius: 8px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 16px;
  color: #000;
  position: relative;
}
.msg.me .bubble { background: var(--mine); border-top-right-radius: 2px; }
.msg.ta .bubble { background: var(--theirs); border-top-left-radius: 2px; box-shadow: 0 1px 1px rgba(0,0,0,.05); }
.typing .bubble { color: var(--muted); }
.typing .bubble::after { content: " ···"; animation: blink 1.2s infinite; }
@keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }

.hint-block {
  align-self: center;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
  padding: 7px 14px;
  background: rgba(0,0,0,.04);
  border-radius: 6px;
}
.toast {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 64px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.78);
  color: #fff;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
  z-index: 30;
  display: none;
  pointer-events: none;
  white-space: nowrap;
}

/* 输入区 */
.composer {
  padding: 8px 10px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  background: var(--composer-bg);
  border-top: 1px solid var(--border);
}
.composer-row { display: flex; gap: 8px; align-items: flex-end; }
.input-wrap { flex: 1; min-width: 0; }
.composer textarea {
  width: 100%;
  resize: none;
  background: #fff;
  border: 1px solid #e6e6e6;
  border-radius: 8px;
  color: var(--text);
  padding: 9px 12px;
  font-size: 16px;
  line-height: 1.4;
  max-height: 120px;
  outline: none;
  font-family: inherit;
}
.composer button { flex: none; cursor: pointer; }
.composer .tool {
  width: 40px; height: 40px;
  background: transparent; border: none; color: #191919;
  font-size: 30px; line-height: 1; padding: 0;
}
.send-btn {
  height: 40px; padding: 0 16px;
  border: none; border-radius: 6px;
  background: var(--green); color: #fff;
  font-size: 15px; font-weight: 500;
}
.composer button:disabled { opacity: .4; }

/* 待发送图片预览 */
.previews { display: none; flex-wrap: wrap; gap: 8px; padding: 0 4px 8px; }
.previews.show { display: flex; }
.preview { position: relative; }
.preview img {
  width: 64px; height: 64px; object-fit: cover;
  border-radius: 6px; display: block;
  border: 1px solid var(--border);
}
.previews .preview-x {
  position: absolute; top: -7px; right: -7px;
  width: 20px; height: 20px; padding: 0;
  border-radius: 50%; border: none;
  background: rgba(0,0,0,.7); color: #fff;
  font-size: 12px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}

/* 聊天气泡里的图片 */
.imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.msg-img { max-width: 160px; max-height: 200px; border-radius: 6px; display: block; }

/* 设置弹层 */
.mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  display: flex; align-items: flex-end;
  z-index: 20;
}
.mask.hidden { display: none; }
.sheet {
  width: 100%;
  max-height: 92vh;
  background: #f7f7f7;
  border-radius: 16px 16px 0 0;
  display: flex; flex-direction: column;
}
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: #fff;
  border-radius: 16px 16px 0 0;
}
.sheet-head h2 { margin: 0; font-size: 17px; color: #000; }
.ghost {
  background: transparent; border: none; color: var(--muted);
  font-size: 20px; cursor: pointer; padding: 6px;
}
.sheet-body {
  padding: 16px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 12px;
}
.sheet-body label { font-size: 13px; color: var(--muted); }
.sheet-body input, .sheet-body textarea {
  width: 100%;
  background: #fff;
  border: 1px solid #e6e6e6;
  border-radius: 8px;
  color: var(--text);
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  resize: vertical;
}
.sheet-body .hint { color: var(--muted); font-size: 12px; }
.avatar-row { display: flex; align-items: center; gap: 10px; }
.avatar-preview {
  flex: none; width: 56px; height: 56px;
  border-radius: 8px;
  background: linear-gradient(135deg, #07c160, #7c5cff);
  background-size: cover; background-position: center;
  color: #fff; font-size: 24px; font-weight: 600;
  display: grid; place-items: center;
}
.avatar-row button {
  background: #fff; border: 1px solid #e6e6e6; border-radius: 8px;
  color: var(--text); padding: 8px 12px; font-size: 14px; cursor: pointer;
}
.sheet-body hr { border: none; border-top: 1px solid var(--border); width: 100%; }
.row { display: flex; gap: 10px; }
.row button { flex: 1; border: none; border-radius: 8px; padding: 12px; font-size: 15px; cursor: pointer; }
.primary { background: var(--green); color: #fff; font-weight: 500; }
.danger { background: transparent; color: var(--danger); border: 1px solid #f3c5c5; }
.test-btn {
  align-self: flex-start;
  background: #fff; border: 1px solid #e6e6e6; border-radius: 8px;
  color: var(--text); padding: 9px 14px; font-size: 14px; cursor: pointer;
}
.conn-result { font-size: 12px; line-height: 1.5; margin: 0; }
.conn-result.ok { color: var(--green); }
.conn-result.err { color: var(--danger); }
.footnote { font-size: 11px; color: var(--muted); line-height: 1.5; margin: 0; }

/* 调试横幅（排查用，问题解决后可删） */
.dbg {
  position: fixed; left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 58px);
  padding: 5px 12px;
  font-size: 12px; line-height: 1.55;
  color: #c0392b;
  background: rgba(255,247,230,.97);
  border-top: 1px solid #f0d9a8; border-bottom: 1px solid #f0d9a8;
  pointer-events: none;
  white-space: pre-wrap; word-break: break-all;
  z-index: 19;
}
  </style>
</head>
<body>
  <header class="topbar">
    <span class="nav back">‹</span>
    <div class="meta">
      <div class="name" id="personaName">还没设人物</div>
      <div class="status" id="status">未连接</div>
    </div>
    <button class="nav dots" id="openSettings" title="设置">···</button>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <form id="composer" class="composer">
    <div id="previews" class="previews"></div>
    <div class="composer-row">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="输入…" enterkeyhint="send"></textarea>
      </div>
      <button type="button" id="imgBtn" class="tool" title="发图片/拍一张">＋</button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
      <button id="send" type="button" class="send-btn" onclick="if(window.__tapSend)window.__tapSend()">发送</button>
    </div>
  </form>

  <!-- 设置弹层 -->
  <div id="settingsMask" class="mask hidden">
    <div class="sheet">
      <div class="sheet-head">
        <h2>设置</h2>
        <button class="ghost" id="closeSettings">✕</button>
      </div>
      <div class="sheet-body">
        <label>接入点地址（默认方舟，别改）</label>
        <input id="cfgBase" type="text" placeholder="https://ark.cn-beijing.volces.com/api/v3" />

        <label>API Key <span class="hint">（只存在本机浏览器）</span></label>
        <input id="cfgKey" type="password" placeholder="粘贴方舟 API Key" autocomplete="off" />

        <label>模型 / 接入点 ID <span class="hint">（识图需选「视觉/vision」模型，如豆包视觉）</span></label>
        <input id="cfgModel" type="text" placeholder="例如 ep-xxxxxxxx 或 doubao 视觉模型" />
        <button type="button" id="testConn" class="test-btn">测试连接</button>
        <p id="connResult" class="conn-result" hidden></p>

        <hr />

        <label>人物名字</label>
        <input id="cfgName" type="text" placeholder="例如：阿哲" />

        <label>头像 <span class="hint">（显示在 TA 的消息左边）</span></label>
        <div class="avatar-row">
          <div class="avatar-preview" id="avatarPreview">Ta</div>
          <button type="button" id="avatarBtn">选择图片</button>
          <button type="button" id="avatarClear">恢复默认</button>
          <input type="file" id="avatarInput" accept="image/*" hidden />
        </div>

        <label>人格设定 <span class="hint">（决定它是谁、怎么说话）</span></label>
        <textarea id="cfgPersona" rows="8" placeholder="粘贴人格卡：它是谁、你们的关系、说话风格、口头禅、底线……"></textarea>

        <label>关于你（长期记忆，它越聊越懂你）</label>
        <textarea id="cfgMemory" rows="4" placeholder="例如：我是亚马逊操盘手，做欧洲站；喜欢……；最近在忙……"></textarea>

        <label>对话样例（可选，教它怎么回，每行一条，格式「我:…」/「Ta:…」）</label>
        <textarea id="cfgExamples" rows="6" placeholder="我: 今天好累&#10;Ta: 累就早点睡，别硬撑啦"></textarea>

        <div class="row">
          <button class="primary" id="saveSettings">保存</button>
          <button class="danger" id="clearChat">清空对话</button>
        </div>
        <p class="footnote">所有设置与聊天记录都只存在这台设备的浏览器 localStorage 中，不上传任何第三方。（单文件版 v1）</p>
      </div>
    </div>
  </div>

  <script>
/* AI 陪伴 —— 纯前端 PWA，接入火山方舟（支持识图，需视觉模型）。单文件版，无需 sw.js。 */
(() => {
  'use strict';

  const CFG_KEY = 'ai_companion_config_v2';
  const HIST_KEY = 'ai_companion_history';
  const IMG_MAX = 1024;          // 发送前最长边压缩到 1024px
  const IMG_QUALITY = 0.82;
  const KEEP_IMG_RECENT = 20;    // 只给最近 20 条消息保留图片（省 localStorage）

  const DEFAULTS = {
    base: 'https://ark.cn-beijing.volces.com/api/v3',
    apiKey: 'ark-a20f5e9d-d47b-4502-a5f5-928c802049b0-ac6a6',
    model: 'ep-20261015151239-2qsmw',
    name: '阿哲',
    avatar: '',
    persona: '你是「阿哲」，用户多年的老朋友，关系亲近、互相信任。性格温和、细心、幽默；说话像用微信聊天一样自然口语化，不端着、不说教、不用敬语。你很懂用户，能从字里行间听出用户的情绪和没说出口的意思，先接住情绪、再轻松地回应，偶尔开个无伤大雅的玩笑。回复用中文，简短亲切，一般 1~4 句话。',
    memory: '',
    examples: '',
  };

  const $ = (id) => document.getElementById(id);
  const el = {
    name: $('personaName'), status: $('status'),
    chat: $('chat'), composer: $('composer'), input: $('input'), send: $('send'),
    imgBtn: $('imgBtn'), fileInput: $('fileInput'), previews: $('previews'),
    openSettings: $('openSettings'), closeSettings: $('closeSettings'), mask: $('settingsMask'),
    cfgBase: $('cfgBase'), cfgKey: $('cfgKey'), cfgModel: $('cfgModel'), cfgName: $('cfgName'),
    cfgPersona: $('cfgPersona'), cfgMemory: $('cfgMemory'), cfgExamples: $('cfgExamples'),
    saveSettings: $('saveSettings'), clearChat: $('clearChat'),
    avatarPreview: $('avatarPreview'), avatarBtn: $('avatarBtn'),
    avatarClear: $('avatarClear'), avatarInput: $('avatarInput'),
    testConn: $('testConn'), connResult: $('connResult'),
  };

  let cfg = loadJSON(CFG_KEY, DEFAULTS);
  let history = loadJSON(HIST_KEY, []);   // [{role, content, images?:[dataUri]}]
  let pendingImages = [];                 // 待发送的图片 dataUri
  let busy = false;

  // ---------- 屏幕内调试 + 错误兜底（排查用，之后可删） ----------
  function dbg(msg) {
    try { console.log('[dbg]', msg); } catch (e) {}
    let d = document.getElementById('dbg');
    if (!d) { d = document.createElement('div'); d.id = 'dbg'; d.className = 'dbg'; document.body.appendChild(d); }
    const t = new Date();
    const p = function (n) { return ('0' + n).slice(-2); };
    d._log = d._log || [];
    d._log.push(p(t.getHours()) + ':' + p(t.getMinutes()) + ':' + p(t.getSeconds()) + ' ' + msg);
    if (d._log.length > 10) d._log = d._log.slice(-10);
    d.textContent = '调试 · ' + d._log.join('\n');
  }
  window.addEventListener('error', function (e) {
    try { dbg('JS错误: ' + (e.message || e.type) + ' @行' + e.lineno); } catch (x) {}
  });
  window.addEventListener('unhandledrejection', function (e) {
    try { dbg('未处理异常: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason))); } catch (x) {}
  });

  // ---------- 持久化 ----------
  function loadJSON(key, fallback) {
    try { return { ...fallback, ...(JSON.parse(localStorage.getItem(key) || 'null') || {}) }; }
    catch { return { ...fallback }; }
  }
  function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

  // 只给最近若干条保留图片，旧的降级成「[图片]」文字，防爆 localStorage
  function saveHistory() {
    const flat = history.map((m) => ({ ...m }));
    for (let i = 0; i < flat.length - KEEP_IMG_RECENT; i++) {
      if (flat[i].images && flat[i].images.length) {
        const t = (flat[i].content || '').trim();
        flat[i].content = t ? t + ' [图片]' : '[图片]';
        flat[i].images = [];
      }
    }
    saveJSON(HIST_KEY, flat);
  }

  // ---------- 状态 ----------
  function configured() { return !!(cfg.apiKey && cfg.model); }

  function refresh() {
    el.name.textContent = cfg.name || '还没设人物';
    if (!configured()) {
      el.status.textContent = '未连接（去设置填 API Key 和模型）';
      el.status.className = 'status';
    } else {
      el.status.textContent = cfg.name ? `正在扮演 ${cfg.name}` : '已连接';
      el.status.className = 'status ok';
    }
  }

  // ---------- 图片压缩 ----------
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        let { width, height } = img;
        if (width > IMG_MAX || height > IMG_MAX) {
          const s = Math.min(IMG_MAX / width, IMG_MAX / height);
          width = Math.round(width * s);
          height = Math.round(height * s);
        }
        const c = document.createElement('canvas');
        c.width = width; c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(c.toDataURL('image/jpeg', IMG_QUALITY));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
      img.src = url;
    });
  }

  // 头像：中心裁成正方形 96px
  function makeAvatar(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const size = 96;
        const s = Math.min(img.width, img.height);
        const sx = (img.width - s) / 2;
        const sy = (img.height - s) / 2;
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
        resolve(c.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
      img.src = url;
    });
  }

  function renderAvatarPreview() {
    const p = el.avatarPreview;
    p.style.backgroundImage = cfg.avatar ? 'url(' + cfg.avatar + ')' : '';
    p.textContent = cfg.avatar ? '' : (cfg.name || 'Ta').slice(0, 1);
  }

  function setAvatar(dataUri) {
    cfg.avatar = dataUri;
    saveJSON(CFG_KEY, cfg);
    renderAvatarPreview();
    renderHistory();
  }

  async function onFiles(files) {
    for (const f of Array.from(files || [])) {
      try { pendingImages.push(await compressImage(f)); } catch (e) { console.warn(e); }
    }
    renderPreviews();
  }

  function renderPreviews() {
    el.previews.innerHTML = '';
    if (pendingImages.length === 0) { el.previews.classList.remove('show'); return; }
    el.previews.classList.add('show');
    pendingImages.forEach((src, i) => {
      const w = document.createElement('div');
      w.className = 'preview';
      const img = document.createElement('img');
      img.src = src;
      const x = document.createElement('button');
      x.type = 'button';
      x.className = 'preview-x';
      x.textContent = '✕';
      x.onclick = () => { pendingImages.splice(i, 1); renderPreviews(); };
      w.appendChild(img); w.appendChild(x);
      el.previews.appendChild(w);
    });
  }

  // ---------- 渲染 ----------
  function addBubble(role, text, images) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    if (role === 'ta') {
      const av = document.createElement('div');
      av.className = 'avatar-img';
      if (cfg.avatar) av.style.backgroundImage = 'url(' + cfg.avatar + ')';
      else av.textContent = (cfg.name || 'Ta').slice(0, 1);
      wrap.appendChild(av);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (text) { const p = document.createElement('span'); p.textContent = text; bubble.appendChild(p); }
    if (images && images.length) {
      const g = document.createElement('div');
      g.className = 'imgs';
      for (const src of images) {
        const im = document.createElement('img');
        im.src = src;
        im.className = 'msg-img';
        g.appendChild(im);
      }
      bubble.appendChild(g);
    }
    wrap.appendChild(bubble);
    el.chat.appendChild(wrap);
    el.chat.scrollTop = el.chat.scrollHeight;
    return wrap;
  }

  function renderHistory() {
    el.chat.innerHTML = '';
    if (history.length === 0) {
      appendHint('还没有对话。设置好人物和 API 后，跟它聊第一句吧。');
    } else {
      for (const m of history) {
        addBubble(m.role === 'user' ? 'me' : 'ta', m.content, m.images);
      }
    }
  }

  function appendHint(t) {
    const d = document.createElement('div');
    d.className = 'hint-block';
    d.textContent = t;
    el.chat.appendChild(d);
    el.chat.scrollTop = el.chat.scrollHeight;
  }

  let toastTimer = null;
  function flashToast(msg) {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast'; t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.display = 'none'; }, 1800);
  }

  // ---------- 对话样例解析 ----------
  function parseExamples(raw) {
    const out = [];
    const lines = (raw || '').split('\n').map((s) => s.trim()).filter(Boolean);
    for (const line of lines) {
      const m = line.match(/^(我|你|Ta|ta|他|她|对方|A)\s*[:：]\s*([\s\S]*)$/);
      if (!m) continue;
      const text = m[2].trim();
      if (!text) continue;
      out.push({ role: m[1] === '我' ? 'user' : 'assistant', content: text });
    }
    return out;
  }

  // ---------- 系统提示词 ----------
  function buildSystem() {
    const persona = cfg.persona.trim();
    const memory = cfg.memory.trim();
    const name = cfg.name.trim();
    const parts = [];
    parts.push('你要扮演一个具体的人，和屏幕前的用户说话。');
    if (name) parts.push('你扮演的人叫「' + name + '」。');
    if (persona) parts.push('【人物设定】\n' + persona);
    if (memory) parts.push('【关于用户（长期记忆，需始终相信并据此理解用户）】\n' + memory);
    parts.push(
      '【规则】\n' +
      '1. 始终以这个人物的身份、语气、口吻说话，不要跳出来说"我是AI"。\n' +
      '2. 自然地理解用户的情绪和没说出口的意思，像老朋友一样回应，但不要过度说教。\n' +
      '3. 如果用户在消息里附带了图片，就认真地"看懂"图片内容并自然地回应（识别图中是什么、有什么细节、对方可能想表达的）。\n' +
      '4. 回复用中文，口语化，长度贴合人物风格（亲切自然，别长篇大论）。'
    );
    return parts.join('\n\n');
  }

  // ---------- 组装请求消息 ----------
  function buildMessages() {
    const messages = [{ role: 'system', content: buildSystem() }];
    for (const ex of parseExamples(cfg.examples).slice(0, 12)) {
      messages.push({ role: ex.role, content: ex.content });
    }
    const tail = history.slice(-30);
    for (let i = 0; i < tail.length; i++) {
      const m = tail[i];
      const role = m.role === 'user' ? 'user' : 'assistant';
      const hasImg = m.images && m.images.length;
      if (role === 'user' && hasImg) {
        const parts = m.images.map((u) => ({ type: 'image_url', image_url: { url: u } }));
        parts.unshift({ type: 'text', text: m.content || '' });
        messages.push({ role, content: parts });
      } else {
        const text = m.content || (role === 'user' && hasImg ? '[图片]' : '');
        messages.push({ role, content: text || ' ' });
      }
    }
    return messages;
  }

  // ---------- 调用方舟（非流式 + 60s 超时，绝不死等） ----------
  async function callArk(messages, onDelta) {
    const url = (cfg.base.replace(/\/+$/, '')) + '/chat/completions';
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 60000);
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
        body: JSON.stringify({ model: cfg.model, messages, temperature: 0.8, max_tokens: 2048, stream: false }),
        signal: ctrl.signal,
      });
      if (!res.ok) {
        let detail = '';
        try { detail = await res.text(); } catch (e) {}
        throw new Error('HTTP ' + res.status + (detail ? '：' + detail.slice(0, 300) : ''));
      }
      const j = await res.json();
      const content = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      if (content) onDelta(content);
    } finally {
      clearTimeout(timer);
    }
  }

  async function send() {
    dbg('send进入 | 输入=' + el.input.value.length + '字 | busy=' + busy + ' | 配置=' + configured());
    if (!configured()) syncFromFields();
    if (busy) { dbg('busy=true 中止'); return; }
    const text = el.input.value.trim();
    if (!text && pendingImages.length === 0) {
      flashToast('输入框是空的，先打字再发送');
      return;
    }
    if (!configured()) {
      openSettings();
      el.connResult.hidden = false;
      el.connResult.className = 'conn-result err';
      el.connResult.textContent = '还没配好：填「API Key」和「模型/接入点 ID」，再点「测试连接」或「保存」。';
      appendHint('⚠ 还没配好 API Key / 模型，去 ··· 设置里填一下。');
      return;
    }

    const images = pendingImages.slice();
    pendingImages = [];
    renderPreviews();

    const msg = { role: 'user', content: text };
    if (images.length) msg.images = images;
    history.push(msg);
    addBubble('me', text, images);
    dbg('已上屏绿气泡，准备请求');
    el.input.value = '';
    autosize();
    saveHistory();

    const messages = buildMessages();

    busy = true;
    el.send.disabled = true;
    el.status.textContent = '对方正在输入…';
    el.status.className = 'status';

    const typing = addBubble('ta', '');
    typing.classList.add('typing');
    let acc = '';

    try {
      await callArk(messages, (delta) => {
        typing.classList.remove('typing');
        acc += delta;
        typing.querySelector('.bubble').textContent = acc || '···';
        el.chat.scrollTop = el.chat.scrollHeight;
      });
      typing.classList.remove('typing');
      typing.querySelector('.bubble').textContent = acc || '（空回复）';
      dbg('回复长度=' + acc.length);
      history.push({ role: 'assistant', content: acc });
      saveHistory();
      el.status.textContent = '正在扮演 ' + (cfg.name || 'Ta');
      el.status.className = 'status ok';
    } catch (e) {
      dbg('出错：' + (e.message || e));
      typing.remove();
      const raw = e.message || String(e);
      let tip = raw;
      if (/Failed to fetch|NetworkError|Load failed|fetch failed/i.test(raw)) tip = '网络/跨域问题，连不上方舟（' + raw + '）';
      else if (raw.indexOf('401') >= 0) tip = 'API Key 不对或过期（HTTP 401），去设置换成「推理 API Key」';
      else if (raw.indexOf('404') >= 0) tip = '模型/接入点 ID 找不到（HTTP 404），确认是 ep- 开头';
      else if (raw.indexOf('429') >= 0) tip = '请求太频繁或额度用完了（HTTP 429）';
      appendHint('⚠ 发送失败：' + tip);
      el.status.textContent = '发送失败';
      el.status.className = 'status err';
      history.pop();            // 回滚刚才那条用户消息
      saveHistory();
    } finally {
      busy = false;
      el.send.disabled = false;
      el.input.focus();
    }
  }

  function autosize() {
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 120) + 'px';
  }

  // ---------- 设置 ----------
  function openSettings() {
    el.cfgBase.value = cfg.base;
    el.cfgKey.value = cfg.apiKey;
    el.cfgModel.value = cfg.model;
    el.cfgName.value = cfg.name;
    el.cfgPersona.value = cfg.persona;
    el.cfgMemory.value = cfg.memory;
    el.cfgExamples.value = cfg.examples;
    renderAvatarPreview();
    el.mask.classList.remove('hidden');
  }
  function syncFromFields() {
    cfg.base = el.cfgBase.value.trim() || DEFAULTS.base;
    cfg.apiKey = el.cfgKey.value.trim();
    cfg.model = el.cfgModel.value.trim();
    cfg.name = el.cfgName.value.trim();
    cfg.persona = el.cfgPersona.value;
    cfg.memory = el.cfgMemory.value;
    cfg.examples = el.cfgExamples.value;
    saveJSON(CFG_KEY, cfg);
  }
  function closeSettings() { syncFromFields(); el.mask.classList.add('hidden'); }

  function saveSettings() {
    syncFromFields();
    closeSettings();
    refresh();
    renderHistory();
    appendHint('设置已保存。');
  }

  function clearChat() {
    if (!confirm('确定清空所有本地对话吗？（不影响设置）')) return;
    history = [];
    pendingImages = [];
    renderPreviews();
    saveHistory();
    renderHistory();
    appendHint('对话已清空。');
  }

  async function testConn() {
    syncFromFields();
    const key = cfg.apiKey;
    const model = cfg.model;
    const base = cfg.base.replace(/\/+$/, '');
    const out = el.connResult;
    if (!key || !model) {
      out.hidden = false;
      out.className = 'conn-result err';
      out.textContent = '先填好「API Key」和「模型 / 接入点 ID」。';
      return;
    }
    out.hidden = false;
    out.className = 'conn-result';
    out.textContent = '正在测试…';
    try {
      const res = await fetch(base + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: model, messages: [{ role: 'user', content: '你好' }], max_tokens: 4, stream: false }),
      });
      if (res.ok) {
        out.className = 'conn-result ok';
        out.textContent = '✅ 连接成功，配置已自动保存，直接去聊天吧。';
      } else {
        let d = ''; try { d = await res.text(); } catch (e) {}
        out.className = 'conn-result err';
        out.textContent = '❌ HTTP ' + res.status + '：' + d.slice(0, 260);
        if (res.status === 401) out.textContent += ' ← API Key 不对/过期（别把 AK/SK 里的 Secret Key 当 API Key）';
        else if (res.status === 404) out.textContent += ' ← 模型/接入点 ID 找不到，确认是 ep- 开头';
      }
    } catch (e) {
      out.className = 'conn-result err';
      out.textContent = '❌ 无法连接方舟：' + (e.message || e) + '（通常是浏览器跨域拦截，或手机网络不通）。';
    }
  }

  // ---------- 事件 ----------
  let lastSend = 0;
  function triggerSend() {
    const now = Date.now();
    if (now - lastSend < 300) { dbg('300ms内重复触发，忽略'); return; }
    lastSend = now;
    dbg('触发发送');
    send();
  }
  window.__tapSend = triggerSend;
  el.send.addEventListener('click', (e) => { e.preventDefault(); triggerSend(); });
  el.send.addEventListener('touchend', (e) => { triggerSend(); });
  el.send.addEventListener('pointerup', (e) => { triggerSend(); });
  el.composer.addEventListener('submit', (e) => { e.preventDefault(); triggerSend(); });
  document.addEventListener('click', function (e) {
    if (e.target && e.target.closest && e.target.closest('#send')) triggerSend();
  }, true);
  document.addEventListener('touchend', function (e) {
    if (e.target && e.target.closest && e.target.closest('#send')) triggerSend();
  }, true);
  el.input.addEventListener('input', autosize);
  el.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  el.imgBtn.addEventListener('click', () => el.fileInput.click());
  el.fileInput.addEventListener('change', (e) => { onFiles(e.target.files); e.target.value = ''; });
  el.avatarBtn.addEventListener('click', () => el.avatarInput.click());
  el.avatarInput.addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try { setAvatar(await makeAvatar(f)); }
    catch (err) { el.status.textContent = '头像读取失败'; el.status.className = 'status err'; }
  });
  el.avatarClear.addEventListener('click', () => setAvatar(''));
  el.openSettings.addEventListener('click', openSettings);
  el.closeSettings.addEventListener('click', closeSettings);
  el.mask.addEventListener('click', (e) => { if (e.target === el.mask) closeSettings(); });
  el.saveSettings.addEventListener('click', saveSettings);
  el.clearChat.addEventListener('click', clearChat);
  el.testConn.addEventListener('click', testConn);

  // ---------- 启动 ----------
  // 一次性配置导入：用带 ?key=&model= 的链接打开一次，自动填好并存本机，然后清掉网址参数
  try {
    const q = new URLSearchParams(location.search);
    const into = {};
    if (q.get('key')) into.apiKey = q.get('key');
    if (q.get('model')) into.model = q.get('model');
    if (q.get('name')) into.name = q.get('name');
    if (q.get('persona')) into.persona = q.get('persona');
    if (Object.keys(into).length) {
      cfg = Object.assign({}, cfg, into);
      saveJSON(CFG_KEY, cfg);
      history.replaceState(null, '', location.pathname);
    }
  } catch (e) {}

  refresh();
  renderHistory();
  dbg('已加载 单文件v1 · ' + (configured() ? ('已连接 ' + (cfg.name || '')) : '未连接'));

  // 彻底清理旧版 service worker 与其缓存，以后每次加载都是最新文件
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
  }
  if (window.caches && window.caches.keys) {
    window.caches.keys().then(function (ks) {
      ks.forEach(function (k) { window.caches.delete(k); });
    }).catch(function () {});
  }
})();
  </script>
