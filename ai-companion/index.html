<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#07c160" />
  <!-- iPhone 加到主屏幕后的全屏 App 模式与图标 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="阿哲" />
  <link rel="apple-touch-icon" href="icon.png" />
  <title>AI 陪伴</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
:root {
  --topbar: #ededed;          /* 顶栏/聊天底，微信灰 */
  --chatbg: #ededed;
  --composer-bg: #f7f7f7;      /* 输入区 */
  --panel: #ffffff;
  --border: #e0e0e0;
  --text: #191919;
  --muted: #9a9a9a;
  --green: #07c160;            /* 微信绿 */
  --mine: #95ec69;             /* 我方气泡 */
  --theirs: #ffffff;           /* 对方气泡 */
  --danger: #fa5151;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--chatbg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  display: flex;
  flex-direction: column;
  -webkit-tap-highlight-color: transparent;
}

/* 顶栏 */
.topbar {
  display: flex; align-items: center; gap: 4px;
  padding: 10px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  background: var(--topbar);
  border-bottom: 1px solid var(--border);
}
.topbar .nav {
  flex: none; width: 36px; height: 36px;
  display: grid; place-items: center;
  background: transparent; border: none; color: #191919;
  font-size: 24px; line-height: 1; cursor: pointer; padding: 0;
}
.topbar .nav.back { font-size: 32px; padding-bottom: 4px; }
.topbar .nav.dots { letter-spacing: -3px; font-weight: 700; }
.topbar .meta { flex: 1; min-width: 0; text-align: center; }
.topbar .name {
  font-size: 17px; font-weight: 600; color: #000;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar .status { font-size: 12px; color: var(--muted); margin-top: 1px; }
.status.ok { color: var(--green); }
.status.err { color: var(--danger); }
.status.idle { visibility: hidden; }   /* 平时不显示，顶栏只留名字；保留占位不跳动 */

/* 聊天区 */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 14px 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
  background: var(--chatbg);
}
.msg { max-width: 76%; display: flex; }
.msg.me { align-self: flex-end; }
.msg.ta { align-self: flex-start; gap: 8px; align-items: flex-start; }
.avatar-img {
  flex: none; width: 36px; height: 36px;
  border-radius: 6px;
  background: linear-gradient(135deg, #07c160, #7c5cff);
  background-size: cover; background-position: center;
  color: #fff; font-size: 16px; font-weight: 600;
  display: grid; place-items: center;
}
.bubble {
  padding: 9px 12px;
  border-radius: 8px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 16px;
  color: #000;
  position: relative;
}
.msg.me .bubble { background: var(--mine); border-top-right-radius: 2px; }
.msg.ta .bubble { background: var(--theirs); border-top-left-radius: 2px; box-shadow: 0 1px 1px rgba(0,0,0,.05); }
.typing .bubble { color: var(--muted); }
.typing .bubble::after { content: " ···"; animation: blink 1.2s infinite; }
@keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }

.hint-block {
  align-self: center;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
  padding: 7px 14px;
  background: rgba(0,0,0,.04);
  border-radius: 6px;
}
.toast {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 64px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.78);
  color: #fff;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
  z-index: 30;
  display: none;
  pointer-events: none;
  white-space: nowrap;
}

/* 输入区 */
.composer {
  padding: 8px 10px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  background: var(--composer-bg);
  border-top: 1px solid var(--border);
}
.composer-row { display: flex; gap: 8px; align-items: flex-end; }
.input-wrap { flex: 1; min-width: 0; }
.composer textarea {
  width: 100%;
  resize: none;
  background: #fff;
  border: 1px solid #e6e6e6;
  border-radius: 8px;
  color: var(--text);
  padding: 9px 12px;
  font-size: 16px;
  line-height: 1.4;
  max-height: 120px;
  outline: none;
  font-family: inherit;
}
.composer button { flex: none; cursor: pointer; }
.composer .tool {
  width: 40px; height: 40px;
  background: transparent; border: none; color: #191919;
  font-size: 28px; line-height: 1; padding: 0;
  opacity: .55;
}
.composer .tool.on { opacity: 1; filter: drop-shadow(0 0 4px rgba(7,193,96,.5)); }
.send-btn {
  height: 40px; padding: 0 16px;
  border: none; border-radius: 6px;
  background: var(--green); color: #fff;
  font-size: 15px; font-weight: 500;
}
.composer button:disabled { opacity: .4; }

/* 待发送图片预览 */
.previews { display: none; flex-wrap: wrap; gap: 8px; padding: 0 4px 8px; }
.previews.show { display: flex; }
.preview { position: relative; }
.preview img {
  width: 64px; height: 64px; object-fit: cover;
  border-radius: 6px; display: block;
  border: 1px solid var(--border);
}
.previews .preview-x {
  position: absolute; top: -7px; right: -7px;
  width: 20px; height: 20px; padding: 0;
  border-radius: 50%; border: none;
  background: rgba(0,0,0,.7); color: #fff;
  font-size: 12px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}

/* 聊天气泡里的图片 */
.imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.msg-img { max-width: 160px; max-height: 200px; border-radius: 6px; display: block; }

/* 设置弹层 */
.mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  display: flex; align-items: flex-end;
  z-index: 20;
}
.mask.hidden { display: none; }
.sheet {
  width: 100%;
  max-height: 92vh;
  background: #f7f7f7;
  border-radius: 16px 16px 0 0;
  display: flex; flex-direction: column;
}
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: #fff;
  border-radius: 16px 16px 0 0;
}
.sheet-head h2 { margin: 0; font-size: 17px; color: #000; }
.ghost {
  background: transparent; border: none; color: var(--muted);
  font-size: 20px; cursor: pointer; padding: 6px;
}
.sheet-body {
  padding: 16px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 12px;
}
.sheet-body label { font-size: 13px; color: var(--muted); }
.sheet-body input, .sheet-body textarea, .sheet-body select {
  width: 100%;
  background: #fff;
  border: 1px solid #e6e6e6;
  border-radius: 8px;
  color: var(--text);
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  resize: vertical;
}
.sheet-body .hint { color: var(--muted); font-size: 12px; }
.avatar-row { display: flex; align-items: center; gap: 10px; }
.avatar-preview {
  flex: none; width: 56px; height: 56px;
  border-radius: 8px;
  background: linear-gradient(135deg, #07c160, #7c5cff);
  background-size: cover; background-position: center;
  color: #fff; font-size: 24px; font-weight: 600;
  display: grid; place-items: center;
}
.avatar-row button {
  background: #fff; border: 1px solid #e6e6e6; border-radius: 8px;
  color: var(--text); padding: 8px 12px; font-size: 14px; cursor: pointer;
}
.sheet-body hr { border: none; border-top: 1px solid var(--border); width: 100%; }
.row { display: flex; gap: 10px; }
.row button { flex: 1; border: none; border-radius: 8px; padding: 12px; font-size: 15px; cursor: pointer; }
.primary { background: var(--green); color: #fff; font-weight: 500; }
.danger { background: transparent; color: var(--danger); border: 1px solid #f3c5c5; }
.test-btn {
  align-self: flex-start;
  background: #fff; border: 1px solid #e6e6e6; border-radius: 8px;
  color: var(--text); padding: 9px 14px; font-size: 14px; cursor: pointer;
}
.conn-result { font-size: 12px; line-height: 1.5; margin: 0; }
.conn-result.ok { color: var(--green); }
.conn-result.err { color: var(--danger); }
.footnote { font-size: 11px; color: var(--muted); line-height: 1.5; margin: 0; }

/* 左右分段选择（截图学习时选模仿哪一侧） */
.seg { display: flex; gap: 10px; }
.seg button {
  flex: 1; background: #fff; border: 1px solid #e6e6e6; border-radius: 8px;
  padding: 10px; font-size: 13px; color: var(--text); cursor: pointer;
}
.seg button.sel { background: var(--green); border-color: var(--green); color: #fff; font-weight: 500; }

/* 长期记忆分组 */
details.mem-group { background: #fff; border: 1px solid #e6e6e6; border-radius: 8px; padding: 2px 12px; }
.mem-group summary { font-size: 14px; padding: 9px 0; cursor: pointer; }
.mem-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 0; border-top: 1px solid #f0f0f0; font-size: 14px;
}
.mem-item .t { flex: 1; min-width: 0; word-break: break-word; }
.mem-item .x {
  flex: none; border: none; background: transparent; color: var(--danger);
  font-size: 14px; cursor: pointer; padding: 4px 6px;
}
.mem-add-row { display: flex; gap: 8px; align-items: center; }
.mem-add-row select { flex: none; width: 92px; }
.mem-add-row input { flex: 1; min-width: 0; }
.mem-add-row button { flex: none; }
.learn-pairs { display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.5; }
.learn-pairs .pair { background: #fff; border: 1px solid #eee; border-radius: 6px; padding: 6px 8px; }

/* 设置里的复选项 */
.check-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
.check-row input { flex: none; width: 18px; height: 18px; }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="nav back">‹</span>
    <div class="meta">
      <div class="name" id="personaName">还没设人物</div>
      <div class="status" id="status">未连接</div>
    </div>
    <button class="nav dots" id="openSettings" title="设置">···</button>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <form id="composer" class="composer">
    <div id="previews" class="previews"></div>
    <div class="composer-row">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="输入…" enterkeyhint="send"></textarea>
      </div>
      <button type="button" id="netBtn" class="tool" title="联网开关">🌐</button>
      <button type="button" id="imgBtn" class="tool" title="发图片/拍一张">＋</button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
      <button id="send" type="button" class="send-btn" onclick="if(window.__tapSend)window.__tapSend()">发送</button>
    </div>
  </form>

  <!-- 设置弹层 -->
  <div id="settingsMask" class="mask hidden">
    <div class="sheet">
      <div class="sheet-head">
        <h2>设置</h2>
        <button class="ghost" id="closeSettings">✕</button>
      </div>
      <div class="sheet-body">
        <label>接入点地址（默认方舟，别改）</label>
        <input id="cfgBase" type="text" placeholder="https://ark.cn-beijing.volces.com/api/v3" />

        <label>API Key <span class="hint">（只存在本机浏览器）</span></label>
        <input id="cfgKey" type="password" placeholder="粘贴方舟 API Key" autocomplete="off" />

        <label>模型 / 接入点 ID <span class="hint">（识图用，视觉/vision 模型的 ep-）</span></label>
        <input id="cfgModel" type="text" placeholder="例如 ep-xxxxxxxx 或 doubao 视觉模型" />

        <label>联网接入点 ID <span class="hint">（可选！填支持「联网搜索」的文本模型 ep-，如豆包1.5-pro；填了纯文字就能上网查）</span></label>
        <input id="cfgSearch" type="text" placeholder="不填则不能联网；填 ep-xxxxxxxx" />

        <button type="button" id="testConn" class="test-btn">测试连接</button>
        <p id="connResult" class="conn-result" hidden></p>

        <hr />
        <label>云函数地址 <span class="hint">（选填：填了聊天走云端，切后台/杀掉 App 也能收到锁屏回复）</span></label>
        <input id="cfgFn" type="text" placeholder="https://xxx.apigw.tencentcs.com/release/" />
        <div class="row">
          <button type="button" class="test-btn" id="subBtn">订阅锁屏推送</button>
        </div>
        <p id="subResult" class="conn-result" hidden></p>
        <p class="hint" style="margin:0;">需先部署云函数；iPhone 必须从「添加到主屏幕」的 App 里点订阅，Safari 网页不支持。</p>

        <hr />

        <label>人物名字</label>
        <input id="cfgName" type="text" placeholder="例如：阿哲" />

        <label>头像 <span class="hint">（显示在 TA 的消息左边）</span></label>
        <div class="avatar-row">
          <div class="avatar-preview" id="avatarPreview">Ta</div>
          <button type="button" id="avatarBtn">选择图片</button>
          <button type="button" id="avatarClear">恢复默认</button>
          <input type="file" id="avatarInput" accept="image/*" hidden />
        </div>

        <label>人格设定 <span class="hint">（决定它是谁、怎么说话）</span></label>
        <textarea id="cfgPersona" rows="8" placeholder="粘贴人格卡：它是谁、你们的关系、说话风格、口头禅、底线……"></textarea>

        <label>说话风格校准卡 <span class="hint">（去 AI 味的核心，可手写，也可用下面的截图学习）</span></label>
        <textarea id="cfgStyleNotes" rows="6" placeholder="它真实的说话方式：句长、语气词、标点、emoji 习惯、称呼、典型句式……"></textarea>

        <label>从真实聊天截图学习</label>
        <div id="learnShots" class="previews"></div>
        <div class="row">
          <button type="button" class="test-btn" id="learnBtn">添加聊天截图</button>
          <input type="file" id="learnInput" accept="image/*" multiple hidden />
        </div>
        <div class="seg">
          <button type="button" id="sideLeft" class="sel">模仿左边的人（对方）</button>
          <button type="button" id="sideRight">模仿右边的人（机主）</button>
        </div>
        <button type="button" class="test-btn" id="learnRun">开始分析风格</button>
        <p id="learnResult" class="conn-result" hidden></p>
        <div id="learnReview" hidden>
          <details open>
            <summary>风格卡预览</summary>
            <p id="learnNotesPrev" style="font-size:13px;line-height:1.6;white-space:pre-wrap;margin:8px 0;"></p>
          </details>
          <details open>
            <summary>样例预览</summary>
            <div id="learnPairsPrev" class="learn-pairs" style="margin:8px 0;"></div>
          </details>
          <div class="row">
            <button type="button" class="primary" id="learnAdopt">采用，填入下方</button>
            <button type="button" class="danger" id="learnDiscard">放弃</button>
          </div>
        </div>

        <label>关于你（手写补充 · 最高优先级，它始终相信）</label>
        <textarea id="cfgMemory" rows="4" placeholder="例如：我是亚马逊操盘手，做欧洲站；喜欢……；最近在忙……"></textarea>

        <label>长期记忆（自动整理，它越聊越懂你）</label>
        <button type="button" class="test-btn" id="memRun">立即整理记忆</button>
        <p id="memResult" class="conn-result" hidden></p>
        <p id="memMeta" class="hint" style="margin:0;">上次整理：— · 共 0 条</p>
        <div class="mem-add-row">
          <select id="memCat"></select>
          <input id="memText" type="text" maxlength="60" placeholder="手动加一条（不超过 50 字）" />
          <button type="button" class="test-btn" id="memAdd">添加</button>
        </div>
        <div id="memList"></div>
        <div class="row">
          <button type="button" class="danger" id="memClear">清空记忆</button>
        </div>

        <label>对话样例（手写 + 学习产出；每行一条，格式「我:…」/「Ta:…」）</label>
        <textarea id="cfgExamples" rows="7" placeholder="我: 今天好累&#10;Ta: 累就早点睡，别硬撑啦"></textarea>

        <hr />
        <label class="check-row">
          <input type="checkbox" id="cfgProactive" />
          <span>允许 TA 主动发消息</span>
        </label>
        <p class="hint" style="margin:0;">App 开着时她会随机主动说话；你离开一阵再打开，会看到她补发的消息。App 完全关掉时不会发（纯前端没有服务器；锁屏推送得以后加后端）。</p>
        <div class="row">
          <button type="button" class="test-btn" id="notifBtn">开启系统通知（可选）</button>
        </div>
        <p id="notifResult" class="conn-result" hidden></p>

        <hr />
        <label>角色包导入 / 备份 <span class="hint">（换设备或在桌面 App 里恢复角色用）</span></label>
        <input id="packUrl" type="text" placeholder="角色包网址，例如 wanwan.json" />
        <div class="row">
          <button type="button" class="test-btn" id="packFetch">从网址加载并导入</button>
          <button type="button" class="test-btn" id="packExport">导出当前配置</button>
        </div>
        <textarea id="packInput" rows="5" placeholder="也可以把角色包 JSON 直接粘贴在这里，再点下面的导入"></textarea>
        <div class="row">
          <button type="button" class="primary" id="packImport">导入粘贴的角色包</button>
        </div>
        <p id="packResult" class="conn-result" hidden></p>

        <div class="row">
          <button class="primary" id="saveSettings">保存</button>
          <button class="danger" id="clearChat">清空对话</button>
        </div>
        <p class="footnote">所有设置、聊天记录与自动整理的长期记忆都只存在这台设备的浏览器 localStorage 中，不上传任何第三方。</p>
      </div>
    </div>
  </div>

  <script>
/* AI 陪伴 —— 纯前端 PWA，接入火山方舟（支持识图，需视觉模型）。单文件版，无需 sw.js。 */
(() => {
  'use strict';

  const CFG_KEY = 'ai_companion_config_v2';
  const HIST_KEY = 'ai_companion_history';
  const MEM_KEY = 'ai_companion_memory_v1';
  const IMG_MAX = 1024;          // 发送前最长边压缩到 1024px
  const IMG_QUALITY = 0.82;
  const KEEP_IMG_RECENT = 20;    // 只给最近 20 条消息保留图片（省 localStorage）

  // 长期记忆参数
  const MEM_ITEMS_MAX = 60;      // 条目总数上限
  const MEM_TEXT_MAX = 60;       // 单条长度兜底上限
  const MEM_WINDOW = 5;          // 新增这么多条对话后自动整理
  const MEM_FEED_CHARS = 6000;   // 单次喂给模型的新对话字符上限
  const MEM_INJECT_CHARS = 1100; // system prompt 注入自动记忆的字符预算
  // 截图学习参数
  const LEARN_SHOT_MAX = 8;      // 最多上传截图数
  const LEARN_SHOT_EDGE = 1280;  // 截图最长边（要认字，比发图的 1024 略大）
  const LEARN_ADD_MAX = 12;      // 单次学习最多采纳的新样例组数
  const LEARN_PAIRS_MAX = 30;    // examples 学习区最多保留的组数
  const EX_LINES_MAX = 80;       // examples 原始文本总行数上限
  const EX_INJECT = 16;          // buildMessages 注入 few-shot 条数
  // 主动消息参数
  const PA_GAP_MIN = 20 * 60 * 1000;   // 前台时距上次说话，最快 20 分钟再主动
  const PA_GAP_MAX = 75 * 60 * 1000;   // 最迟 75 分钟
  const PA_AWAY_MIN = 35 * 60 * 1000;  // 离开这么久再回来，补发期间消息
  const PA_CHECK_MS = 30000;           // 前台定时检查间隔
  const PA_LINE_MAX = 80;              // 主动消息单条长度上限

  // ---------- 图片压缩 ----------
  function compressImage(file, maxEdge, quality) {
    maxEdge = maxEdge || IMG_MAX;
    quality = quality != null ? quality : IMG_QUALITY;
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        let { width, height } = img;
        if (width > maxEdge || height > maxEdge) {
          const s = Math.min(maxEdge / width, maxEdge / height);
          width = Math.round(width * s);
          height = Math.round(height * s);
        }
        const c = document.createElement('canvas');
        c.width = width; c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
      img.src = url;
    });
  }

  // ---------- 模型输出 JSON 的容错抽取（风格学习与记忆整理共用） ----------
  function tryParse(s) {

  }

  // 字符串感知的括号扫描：从 start 处的开括号起，深度首次归零的结束位置（不含），找不到 -1
  function scanBalanced(text, start) {
    const open = text[start];
    const close = open === '{' ? '}' : ']';
    let depth = 0;
    let quote = null;
    for (let i = start; i < text.length; i++) {
      const ch = text[i];
      if (quote) {
        if (ch === '\\') { i++; continue; }
        if (ch === quote) quote = null;
        continue;
      }
      if (ch === '"' || ch === "'" || ch === '`') { quote = ch; continue; }
      if (ch === open) depth++;
      else if (ch === close) {
        depth--;
        if (depth === 0) return i + 1;
      }
    }
    return -1;
  }

  // 只动结构不动正文：去 BOM/零宽字符、修尾逗号（用 charCode 判断，避免源码含不可见字符）
  function cleanStruct(s) {
    let out = '';
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c === 0xFEFF || (c >= 0x200B && c <= 0x200F)) continue;
      out += s[i];
    }
    return out.replace(/,\s*([}\]])/g, '$1');
  }

  function extractJSON(text) {
    if (typeof text !== 'string') return null;
    let s = text.trim();
    if (!s) return null;

    // 1. 去 ```json 围栏
    const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence) s = fence[1].trim();

    // 2. 直接解析
    let v = tryParse(s);
    if (v !== undefined) return v;

    // 3. 找最先出现的 { 或 [，平衡截取首个完整对象
    let first = -1;
    const fc = s.indexOf('{');
    const fs = s.indexOf('[');
    if (fc >= 0 && (fs < 0 || fc < fs)) first = fc;
    else if (fs >= 0) first = fs;
    if (first >= 0) {
      const candidates = [];
      const end = scanBalanced(s, first);
      if (end > first) candidates.push(s.slice(first, end));
      // 4. 贪婪兜底：首个开括号到同类最后一个闭括号
      const closeCh = s[first] === '{' ? '}' : ']';
      const last = s.lastIndexOf(closeCh);
      if (last > first) candidates.push(s.slice(first, last + 1));
      for (const t of candidates) {
        v = tryParse(t);
        if (v !== undefined) return v;
        v = tryParse(cleanStruct(t));
        if (v !== undefined) return v;
      }
    }

    // 5. 原文清洗后最后一试
    v = tryParse(cleanStruct(s));
    return v === undefined ? null : v;
  }

  // ---------- 对话样例解析 ----------

  // ---------- 学习产出样例的合并（保护手写区） ----------
  const LEARN_MARK = '# 学习样例';
  const normKey = (s) => (s || '').replace(/\s+/g, ' ').trim().toLowerCase();
  const flatOne = (s) => (s || '').replace(/\s*\n\s*/g, ' ').trim();

  // 把「我:…/Ta:…」文本按相邻 user→assistant 配成对
  function parsePairsFromText(text) {
    const msgs = parseExamples(text);
    const pairs = [];
    for (let i = 0; i + 1 < msgs.length; i++) {
      if (msgs[i].role === 'user' && msgs[i + 1].role === 'assistant') {
        pairs.push({ user: msgs[i].content, ta: msgs[i + 1].content });

  }

  // 新 pairs 合并进 examples 原文：Ta 回复归一化去重，学习区 FIFO 限 30 组/总 80 行，手写区不动
  function mergeLearntExamples(raw, newPairs) {
    raw = raw || '';
    const markIdx = raw.lastIndexOf(LEARN_MARK);
    const hasMark = markIdx >= 0;
    const head = (hasMark ? raw.slice(0, markIdx) : raw).replace(/\s+$/, '');
    const pairs = parsePairsFromText(hasMark ? raw.slice(markIdx + LEARN_MARK.length) : '');

    const seen = {};
    parseExamples(head).forEach((m) => { if (m.role === 'assistant') seen[normKey(m.content)] = 1; });
    pairs.forEach((p) => { seen[normKey(p.ta)] = 1; });

    for (const p of newPairs || []) {
      const u = flatOne(p.user);
      const t = flatOne(p.ta);
      if (!u || !t || u.length > 100 || t.length > 100) continue;
      const k = normKey(t);
      if (seen[k]) continue;
      seen[k] = 1;
      pairs.push({ user: u, ta: t });
    }

    const headLines = head ? head.split('\n').length : 0;
    const budget = EX_LINES_MAX - headLines - (head ? 1 : 0) - 1;   // 末项 = 标记行
    const maxGroups = Math.max(0, Math.min(LEARN_PAIRS_MAX, Math.floor(budget / 2)));
    const finalPairs = pairs.slice(-maxGroups);

    let out = head;
    if (finalPairs.length) {
      if (out) out += '\n';
      out += LEARN_MARK + '\n' + finalPairs.map((p) => '我: ' + p.user + '\nTa: ' + p.ta).join('\n');
    }
    return out;
  }

  // ---------- 系统提示词 ----------
  // 自动记忆 → 注入文本。预算内 bond 优先占位，显示顺序按 CATS（bond 在最后）
  function buildMemoryBlock() {
    if (!mem.items.length) return '';
    const groups = {};
    CATS.forEach((c) => { groups[c.key] = []; });
    for (const it of mem.items) (groups[it.cat] || groups.fact).push(it);
    CATS.forEach((c) => groups[c.key].sort((a, b) => b.t - a.t));

    const priority = ['bond', 'fact', 'like', 'event', 'goal', 'relation'];
    const chosen = {};
    priority.forEach((k) => { chosen[k] = []; });
    let used = 0;
    let progressed = true;
    while (progressed && used < MEM_INJECT_CHARS) {
      progressed = false;
      for (const k of priority) {
        const idx = chosen[k].length;
        if (idx >= groups[k].length) continue;
        const line = '- ' + groups[k][idx].text;
        if (used + line.length + 1 > MEM_INJECT_CHARS) continue;
        chosen[k].push(groups[k][idx]);
        used += line.length + 1;
        progressed = true;
      }
    }

    const blocks = [];
    for (const c of CATS) {
      if (!chosen[c.key].length) continue;
      blocks.push(CAT_NAMES[c.key] + '\n' + chosen[c.key].map((it) => '- ' + it.text).join('\n'));
    }
    return blocks.join('\n');
  }

    '9. 回复长度跟着对方上一句话的长度、话题分量和你们的关系走：对方说六个字，你不要回六十字。\n' +
    '10. 你一次想说好几句时，每句单独占一行（用回车换行分隔），系统会自动把它们拆成多个微信气泡依次发出；绝不要在一行里连写好几句话。\n' +
    '11. 上方「说话风格校准卡」来自 TA 的真实聊天记录，是说话方式的最高依据；与其下方任何规则冲突，一律以校准卡为准。';

  function buildSystem() {
    const persona = cfg.persona.trim();
    const notes = (cfg.styleNotes || '').trim();
    const memory = cfg.memory.trim();
    const name = cfg.name.trim();
    const memBlock = buildMemoryBlock();
    const parts = [];
    parts.push('你要扮演一个具体的人，和屏幕前的用户说话。');
    if (name) parts.push('你扮演的人叫「' + name + '」。');
    if (persona) parts.push('【人物设定】\n' + persona);
    if (notes) parts.push(
      '【说话风格校准卡】\n' +
      '以下要点提取自 TA 的真实微信聊天记录，是 TA 真实的说话方式。与其他任何规则冲突时，说话方式一律以此为准，严格贴合，不要美化。\n' +
      notes
    );
    if (memory) parts.push('【关于用户 · 手写补充（最高优先级，始终相信）】\n' + memory);
    if (memBlock) parts.push('【关于用户 · 长期记忆（自动整理，供理解上下文）】\n' + memBlock);
    parts.push(REAL_RULES);
    parts.push(
      '【其他】\n' +
      '1. 始终以这个人物的身份、语气、口吻说话，不要跳出来说"我是AI"。\n' +
      '2. 如果用户在消息里附带了图片，就认真"看懂"图片内容并自然地回应（识别图中是什么、有什么细节、对方可能想表达的）。\n' +
      '3. 回复用中文，口语化，长度贴合人物风格。'
    );
    return parts.join('\n\n');
  }

  // ---------- 组装请求消息 ----------
  function buildMessages() {
    const messages = [{ role: 'system', content: buildSystem() }];
    for (const ex of parseExamples(cfg.examples).slice(0, EX_INJECT)) {
      messages.push({ role: ex.role, content: ex.content });
    }
    const tail = history.slice(-30);
    for (let i = 0; i < tail.length; i++) {
      const m = tail[i];
      if (!m || typeof m !== 'object') continue;          // 坏条目直接跳过
      const role = m.role === 'user' ? 'user' : 'assistant';
      const imgs = Array.isArray(m.images) ? m.images : []; // images 坏了按无图处理
      const hasImg = imgs.length > 0;
      if (role === 'user' && hasImg) {
        const parts = imgs.map((u) => ({ type: 'image_url', image_url: { url: u } }));
        parts.unshift({ type: 'text', text: typeof m.content === 'string' ? m.content : '' });
        messages.push({ role, content: parts });
      } else {
        const rawText = typeof m.content === 'string' ? m.content : '';
        const text = rawText || (role === 'user' && hasImg ? '[图片]' : '');
        messages.push({ role, content: text || ' ' });
      }
    }
    return messages;
  }

  // ---------- 调用方舟（流式打字机 + 超时，绝不死等） ----------
  // 处理一行 SSE：有增量就回调；返回 true = 收到 [DONE]
  function sseLine(line, onDelta) {
    const t = line.trim();
    if (!t.startsWith('data:')) return false;
    const data = t.slice(5).trim();
    if (!data) return false;
    if (data === '[DONE]') return true;
    try {
      const j = JSON.parse(data);
      const c = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
      if (c) onDelta(c);
    } catch (e) {}
    return false;
  }

  async function callArk(messages, onDelta, opts) {
    opts = opts || {};
    const url = (cfg.base.replace(/\/+$/, '')) + '/chat/completions';
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), opts.timeout || 60000);
    const payload = {
      model: opts.model || cfg.model,
      messages: messages,
      temperature: opts.temperature != null ? opts.temperature : 0.8,
      max_tokens: opts.maxTokens || 2048,
      stream: opts.stream === false ? false : true,
    };
    if (opts.tools) payload.tools = opts.tools;
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
        body: JSON.stringify(payload),
        signal: ctrl.signal,
      });
      if (!res.ok) {
        let detail = '';
        try { detail = await res.text(); } catch (e) {}
        throw new Error('HTTP ' + res.status + (detail ? '：' + detail.slice(0, 300) : ''));
      }

      // 老浏览器没有流读取器时降级为一次性响应
      if (!res.body || !res.body.getReader) {
        const j = await res.json();
        const content = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if (content) onDelta(content);
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const r = await reader.read();
        if (r.done) break;
        buf += decoder.decode(r.value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, idx);
          buf = buf.slice(idx + 1);
          if (sseLine(line, onDelta)) return;
        }
      }
      // 个别实现不发尾部换行，残留内容再处理一次
      if (buf.trim() && sseLine(buf, onDelta)) return;
    } finally {
      clearTimeout(timer);
    }
  }

  async function send() {
    if (!configured()) syncFromFields();
    if (busy) return;
    const text = el.input.value.trim();
    if (!text && pendingImages.length === 0) {
      flashToast('输入框是空的，先打字再发送');
      return;
    }
    if (!configured()) {
      openSettings();
      el.connResult.hidden = false;
      el.connResult.className = 'conn-result err';
      el.connResult.textContent = '还没配好：填「API Key」和「模型/接入点 ID」，再点「测试连接」或「保存」。';
      appendHint('⚠ 还没配好 API Key / 模型，去 ··· 设置里填一下。');
      return;
    }

    const images = pendingImages.slice();
    pendingImages = [];
    renderPreviews();

    const turnId = uid();
    const msg = { role: 'user', content: text, turnId: turnId };
    if (images.length) msg.images = images;
    history.push(msg);
    addBubble('me', text, images);
    el.input.value = '';
    autosize();
    saveHistory();

    await runTurn(turnId);
  }

  // 按最后一条用户消息决定路由：有图走视觉；纯文字且🌐开走联网接入点
  function buildCallPlan() {
    const last = history[history.length - 1] || {};
    const hasImg = Array.isArray(last.images) && last.images.length > 0;
    const useSearch = !hasImg && netOn && (cfg.searchModel || '').trim();
    return {
      messages: buildMessages(),
      model: useSearch ? cfg.searchModel.trim() : cfg.model,
      tools: useSearch ? [{ type: 'web_search', web_search: { enable: true } }] : null,
      useSearch: !!useSearch,
    };
  }

  // 云端 /chat：返回完整回复（切后台后由云函数继续跑，回复经 Web Push 送达）
  async function remoteChat(plan, turnId) {
    const base = (cfg.fnUrl || '').trim().replace(/\/*$/, '');
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 90000);
    try {
      const res = await fetch(base + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: plan.messages,
          model: plan.model,
          webSearch: !!plan.useSearch,
          turnId: turnId,
          name: cfg.name || '',
        }),
        signal: ctrl.signal,
      });
      let j = null;
      try { j = await res.json(); } catch (e) {}
      if (!res.ok) throw new Error((j && j.error) ? j.error : ('云函数 HTTP ' + res.status));
      return typeof j.reply === 'string' ? j.reply : '';
    } finally {
      clearTimeout(timer);
    }
  }

  // 整段回复到手后，快速逐字放出（按 \n 自然分多个气泡）
  function revealFull(full, onUpdate) {
    return new Promise((resolve) => {
      let i = 0;
      const step = () => {
        i += 3;
        onUpdate(full.slice(0, Math.min(i, full.length)));
        el.chat.scrollTop = el.chat.scrollHeight;
        if (i < full.length) setTimeout(step, 16);
        else resolve();
      };
      step();
    });
  }

  // 等模型回复一轮（假定 history 末尾是待回复的用户消息）。后台挂起时不判失败、回前台自动续。
  async function runTurn(turnId, isRetry) {
    const plan = buildCallPlan();
    const useCloud = !!(cfg.fnUrl || '').trim();
    let retrying = false;
    busy = true;
    bgDuringTurn = false;
    el.send.disabled = true;
    el.status.textContent = plan.useSearch ? '正在联网查询…' : '对方正在输入…';
    el.status.className = 'status';

    // 多气泡：模型每输出一个换行，就定稿当前气泡、冒出下一个
    const first = addBubble('ta', '');
    first.classList.add('typing');
    const lineBubbles = [first];
    let acc = '';
    const syncBubbles = () => {
      const lines = acc.split('\n');
      while (lineBubbles.length < lines.length) {
        lineBubbles[lineBubbles.length - 1].classList.remove('typing');
        lineBubbles.push(addBubble('ta', ''));
      }
      lineBubbles.forEach((b) => b.classList.remove('typing'));
      for (let i = 0; i < lines.length; i++) {
        lineBubbles[i].querySelector('.bubble').textContent = lines[i];
      }
      // 模型刚输出换行、下一句还没来：最后一个空气泡显示输入态
      if (lines[lines.length - 1] === '') lineBubbles[lineBubbles.length - 1].classList.add('typing');
      el.chat.scrollTop = el.chat.scrollHeight;
    };

    try {
      if (useCloud) {
        const full = await remoteChat(plan, turnId);
        await revealFull(full, (t) => { acc = t; syncBubbles(); });
      } else {
        await callArk(plan.messages, (delta) => { acc += delta; syncBubbles(); }, { model: plan.model, tools: plan.tools });
      }

      // 收尾：丢掉空白行对应的气泡，保留的逐句定稿
      let lines = acc.split('\n');
      while (lineBubbles.length > lines.length) {
        const b = lineBubbles.pop();
        b.remove();
      }
      for (let i = lines.length - 1; i >= 0; i--) {
        if (!lines[i].trim()) {
          lineBubbles[i].remove();
          lineBubbles.splice(i, 1);
          lines.splice(i, 1);
        }
      }
      lineBubbles.forEach((b) => b.classList.remove('typing'));
      acc = lines.join('\n');
      // 锁屏推送可能已抢先把同一 turnId 的回复补进来了，不能重复
      const alreadyAnswered = history.some((m) => m.role === 'assistant' && m.turnId === turnId);
      if (alreadyAnswered) {
        lineBubbles.forEach((b) => b.remove());
        return;
      }
      if (acc) {
        history.push({ role: 'assistant', content: acc, turnId: turnId });
        saveHistory();
      } else {
        lineBubbles.forEach((b) => b.remove());
        addBubble('ta', '（空回复）');
      }
      el.status.textContent = '';
      el.status.className = 'status idle';
      markActive();             // 刚说过话，推后她下次主动的时间
      void maybeAutoMemory();   // 后台静默整理，不 await、不影响界面
      void syncState();         // 把最新对话同步给云端

      // 本轮切到过后台：像微信一样在回复到达时弹通知
      if (!alreadyAnswered && bgDuringTurn && acc && 'Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(cfg.name || 'Ta', { body: acc.split('\n')[0], icon: 'icon.png' });
        } catch (e) {}
      }
    } catch (e) {
      lineBubbles.forEach((b) => b.remove());
      const raw = e.message || String(e);

      // 页面在后台 / 刚切后台不久：请求是被系统挂起掐断的，不算失败，保留用户消息，回前台自动续
      const bgInterrupt = document.hidden || (hiddenAt && Date.now() - hiddenAt < 20000);
      if (bgInterrupt) {
        resumePending = true;
        el.status.textContent = '已切到后台，回到页面会自动继续';
        el.status.className = 'status';
        return;
      }

      // 前台网络抖动（Wi-Fi/蜂窝切换、弱网）：悄悄自动重试一次，不打扰用户
      const netBlip = /Failed to fetch|NetworkError|Load failed|fetch failed/i.test(raw);
      if (netBlip && !isRetry) {
        retrying = true;
        el.status.textContent = '网络抖动，正在重试…';
        el.status.className = 'status';
        await new Promise((r) => setTimeout(r, 1500));
        return runTurn(turnId, true);
      }

      let tip = raw;
      if (/abort|Failed to fetch|NetworkError|Load failed|fetch failed/i.test(raw)) tip = '网络问题，连不上方舟（' + raw + '）';
      else if (raw.indexOf('401') >= 0) tip = 'API Key 不对或过期（HTTP 401），去设置换成「推理 API Key」';
      else if (raw.indexOf('404') >= 0) tip = '模型/接入点 ID 找不到（HTTP 404），确认是 ep- 开头';
      else if (raw.indexOf('429') >= 0) tip = '请求太频繁或额度用完了（HTTP 429）';
      appendHint('⚠ 发送失败：' + tip);
      el.status.textContent = '发送失败';
      el.status.className = 'status err';
      history.pop();            // 回滚刚才那条用户消息
      saveHistory();
    } finally {
      bgDuringTurn = false;
      if (retrying) return;     // 交给递归的那一轮管理 busy / 发送按钮
      busy = false;
      el.send.disabled = false;
      if (!document.hidden) el.input.focus();
    }
  }

  // 回前台 / 重开 App 时，把"已发出但没收到回复"的最后一条用户消息重新跑一轮
  async function resumeTurn() {
    if (busy || !configured() || !resumePending) return;
    const last = history[history.length - 1];
    if (!last || last.role !== 'user') { resumePending = false; return; }
    if (document.visibilityState !== 'visible') return;   // 还在后台就再等等
    resumePending = false;
    await sleep((cfg.fnUrl || '').trim() ? 3000 : 800);  // 云端模式：先等锁屏推送补单
    const cur = history[history.length - 1];
    if (document.visibilityState === 'visible' && cur && cur.role === 'user') {
      await runTurn(cur.turnId || uid());
    }
  }

    const out = el.connResult;

      return;
    }
    out.hidden = false;

    out.textContent = '正在测试…';
    try {
      const res = await fetch(base + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model: model, messages: [{ role: 'user', content: '你好' }], max_tokens: 4, stream: false }),
      });
      if (res.ok) {
        out.className = 'conn-result ok';

        if (res.status === 401) out.textContent += ' ← API Key 不对/过期（别把 AK/SK 里的 Secret Key 当 API Key）';
        else if (res.status === 404) out.textContent += ' ← 模型/接入点 ID 找不到，确认是 ep- 开头';
      }
    } catch (e) {
      out.className = 'conn-result err';
      out.textContent = '❌ 无法连接方舟：' + (e.message || e) + '（通常是浏览器跨域拦截，或手机网络不通）。';

  // ================= 风格学习（真实聊天截图 → 去 AI 味） =================

  async function learnStyle() {

    if (learnImages.length === 0) { flashToast('先添加聊天截图'); return; }

    learnBusy = true;
    el.learnRun.disabled = true;
    el.learnResult.hidden = false;
    el.learnResult.className = 'conn-result';
    el.learnResult.textContent = '正在分析 ' + learnImages.length + ' 张截图…';
    el.learnReview.hidden = true;

    const sideText = learnSide === 'left' ? '左侧气泡' : '右侧气泡';
    const sideWord = learnSide === 'left' ? '左' : '右';
    const system =
      '你是资深的中文聊天语言风格分析师。任务：阅读用户提供的微信聊天截图，精确识别指定一侧说话人的真实语言风格，并输出结构化 JSON。' +
      '你只做客观分析和忠实摘录：不美化、不润色、不补全、不发明台词，不写任何 JSON 以外的文字。';
    const text =
      '下面是 ' + learnImages.length + ' 张微信聊天截图，按时间先后排列。\n\n' +
      '【气泡方位常识】微信聊天界面：屏幕左侧气泡是「手机主人的聊天对象」发的；屏幕右侧绿色气泡是「这台手机的主人」发的。忽略状态栏、时间条、未读红点、输入框等非对话内容。\n\n' +
      '【本次要模仿的人】请只分析并模仿【' + sideText + '】的说话人，下文称「目标人物」；另一侧称「对方」。目标人物在我们这里的角色名是「' + cfg.name + '」，仅供你理解，输出中不要提及这个名字。\n\n' +
      '【任务】\n' +
      '1. 逐张 OCR 气泡文字。同一侧连续多条消息合并为该侧的一次发言，原文照录，条间用空格连接。\n' +
      '2. 产出 styleNotes：有证据才写、没证据不写、不许编造。覆盖：句长与一次发几条；语气词、口头禅、方言、高频词；标点习惯；emoji/表情包/颜文字的频率与种类；对对方的称呼；回应节奏（秒回短打/跑题/反问/只回自己关心的点）；情绪表达方式；典型的开场、收尾、拒绝、安慰句式。\n' +
      '3. 摘录 8~16 组 examples：每组 user 是「对方」的发言，ta 是紧随其后「目标人物」的回应。必须忠于截图原文，保留语气词、不完整句、口语错别字和标点；不许重写、翻译、补全。相似内容只留一条。\n\n' +
      '【方位映射】本次目标人物在【' + sideWord + '】侧：严格按该侧归属 user/ta，不要搞反。\n\n' +
      '【输出】只输出一个 JSON 对象：\n' +
      '{"styleNotes":"可用换行分点写","examples":[{"user":"对方的话","ta":"目标人物的话"}]}\n' +
      '若截图里辨认不出任何对话气泡，输出 {"error":"无法识别聊天内容"}。';

    const content = [{ type: 'text', text: text }];
    learnImages.forEach((u) => content.push({ type: 'image_url', image_url: { url: u } }));

    let out = '';
    try {
      await callArk(
        [{ role: 'system', content: system }, { role: 'user', content: content }],
        (s) => { out += s; },
        { maxTokens: 2200, temperature: 0.2, timeout: 120000 }
      );
      const obj = extractJSON(out);
      if (!obj || typeof obj !== 'object') throw new Error('模型没有返回可识别的 JSON');
      if (obj.error) throw new Error(String(obj.error));

      learntNotes = typeof obj.styleNotes === 'string' ? obj.styleNotes.trim() : '';
      const rawPairs = Array.isArray(obj.examples) ? obj.examples : [];
      learntPairs = [];
      for (const p of rawPairs) {
        if (!p || typeof p !== 'object') continue;
        const u = flatOne(p.user);
        const t = flatOne(p.ta);
        if (!u || !t) continue;
        learntPairs.push({ user: u, ta: t });
        if (learntPairs.length >= LEARN_ADD_MAX) break;
      }
      if (!learntNotes && learntPairs.length === 0) throw new Error('分析结果为空，换几张更清晰的截图试试');

      el.learnNotesPrev.textContent = learntNotes || '（没有产出风格卡）';
      el.learnPairsPrev.innerHTML = '';
      learntPairs.forEach((p) => {
        const d = document.createElement('div');
        d.className = 'pair';
        d.style.whiteSpace = 'pre-wrap';
        d.textContent = '我: ' + p.user + '\nTa: ' + p.ta;
        el.learnPairsPrev.appendChild(d);
      });
      el.learnResult.hidden = true;
      el.learnReview.hidden = false;
    } catch (e) {
      el.learnResult.className = 'conn-result err';
      el.learnResult.textContent = '分析失败：' + (e.message || e);
    } finally {
      learnBusy = false;
      el.learnRun.disabled = false;
    }
  }

  // 采用：写入两个 textarea 并立即持久化（防止用户忘了点底部保存）
  function adoptLearn() {
    if (learntNotes) el.cfgStyleNotes.value = learntNotes.slice(0, 1500);
    if (learntPairs.length) el.cfgExamples.value = mergeLearntExamples(el.cfgExamples.value, learntPairs);
    syncFromFields();
    el.learnReview.hidden = true;
    flashToast('已采用，风格卡和样例已保存');
  }

  function discardLearn() {
    el.learnReview.hidden = true;
  }

  // ================= 长期记忆（自动整理 + 手动管理） =================
  function historyTextSince(upto) {
    const lines = [];
    for (const m of history.slice(upto)) {
      if (!m || typeof m !== 'object') continue;
      const text = typeof m.content === 'string' ? m.content.trim() : '';
      if (m.role === 'user') {
        lines.push('我: ' + (text || ((m.images && m.images.length) ? '[图片]' : '')));
      } else if (m.role === 'assistant') {
        lines.push((cfg.name || 'Ta') + ': ' + text);
      }
    }
    let joined = lines.join('\n');
    if (joined.length > MEM_FEED_CHARS) {
      joined = '（更早的对话本次省略）\n' + joined.slice(joined.length - MEM_FEED_CHARS);
    }
    return joined;
  }

  async function consolidateMemory(manual) {
    if (memBusy) return { ok: false, error: 'busy' };
    memBusy = true;
    try {
      if (mem.upto > history.length) mem.upto = history.length;
      const newChat = historyTextSince(mem.upto) || '（暂无新对话，只做合并与清理）';

      const system =
        '你是长期记忆整理引擎。读取「现有记忆条目」和「新增聊天记录」，对记忆做新增、更新、合并、删除，输出整理后的完整条目集合。' +
        '只依据对话中明确出现的信息：不推测、不脑补、不写评价和鸡汤。';
      const text =
        '【记忆类别】\n' +
        '- fact：用户的客观事实（身份、职业、所在地、处境）\n' +
        '- like：用户明确表达的喜好与厌恶\n' +
        '- event：已发生或确定将发生的事件、近况（尽量带时间）\n' +
        '- relation：用户提到的人际关系及对其态度\n' +
        '- goal：用户的目标、计划、待办、心愿\n' +
        '- bond：用户与「' + cfg.name + '」之间独有的共同经历、梗、约定、默契，必须是双方互动中产生的\n\n' +
        '【现有记忆条目】（JSON；保留 id 表示沿用该条目）\n' +
        JSON.stringify(mem.items.map((it) => ({ id: it.id, cat: it.cat, text: it.text }))) + '\n\n' +
        '【新增聊天记录】（「我:」是用户，「Ta:」是陪伴角色；[图片] 表示当时发了图片，不许猜测图片内容）\n' +
        newChat + '\n\n' +
        '【整理规则】\n' +
        '1. 新增：提炼新对话中明确且以后有用的信息；寒暄、情绪宣泄、一次性无价值内容不收。\n' +
        '2. 更新：同一事实有新说法，用新内容替换并沿用旧 id。\n' +
        '3. 合并：重复或同主题条目合并为一条，保留更具体的。\n' +
        '4. 删除：过时、被否认、错误、过细碎的条目。\n' +
        '5. bond 宁缺毋滥：只有真正属于两人之间的内容才放。\n' +
        '6. 每条第三人称客观陈述，≤50 个汉字，不带「可能/好像」，不抄对话原文。\n' +
        '   正例：{"cat":"fact","text":"用户做欧洲站亚马逊，德国站为主"}\n' +
        '   反例：{"cat":"event","text":"他好像今天有点不开心吧"}\n' +
        '7. 总数 ≤' + MEM_ITEMS_MAX + ' 条，按重要性从高到低排序：稳定常用事实与 bond 靠前，时效性旧事件靠后。\n' +
        '8. 未在新对话中出现但仍有效的旧条目继续保留并保留其 id。\n\n' +
        '【输出】只输出一个 JSON 对象，无解释无围栏：\n' +
        '{"items":[{"id":"m_xxx","cat":"fact","text":"……"}]}\n' +
        '新增条目 id 输出空字符串即可。';

      let out = '';
      await callArk(
        [{ role: 'system', content: system }, { role: 'user', content: text }],
        (s) => { out += s; },
        { model: cfg.model, maxTokens: 3000, temperature: 0.2, timeout: 90000 }
      );

      const obj = extractJSON(out);
      if (!obj || typeof obj !== 'object' || !Array.isArray(obj.items)) throw new Error('整理结果无法识别');

      const oldById = {};
      mem.items.forEach((it) => { oldById[it.id] = it; });
      const seenText = {};
      const newItems = [];
      for (const raw of obj.items) {
        if (!raw || typeof raw !== 'object' || !isCat(raw.cat)) continue;
        const t0 = typeof raw.text === 'string' ? raw.text.trim() : '';
        if (!t0) continue;
        const tx = t0.slice(0, MEM_TEXT_MAX);
        const k = normKey(tx);
        if (seenText[k]) continue;
        seenText[k] = 1;

        const oldId = typeof raw.id === 'string' ? raw.id : '';
        const old = oldId && oldById[oldId];
        if (old) newItems.push({ id: old.id, cat: raw.cat, text: tx, t: old.t });
        else newItems.push({ id: uid(), cat: raw.cat, text: tx, t: Date.now() });
        if (newItems.length >= MEM_ITEMS_MAX) break;
      }

      // fail-closed：自动路径下模型若清空全部条目，保留旧记忆
      if (newItems.length === 0 && mem.items.length > 0 && !manual) throw new Error('empty');

      mem.items = newItems;
      mem.upto = history.length;
      mem.lastRun = Date.now();
      if (!saveMem()) return { ok: false, error: '本机存储已满，先删掉一些旧对话或记忆' };
      return { ok: true, total: newItems.length };
    } catch (e) {
      return { ok: false, error: e.message || String(e) };
    } finally {
      memBusy = false;
    }
  }

  async function maybeAutoMemory() {
    try {
      if (memBusy || !configured()) return;
      if (mem.upto > history.length) mem.upto = history.length;
      if (history.length - mem.upto >= MEM_WINDOW) await consolidateMemory(false);
    } catch (e) {}
  }

  const fmtTime = (ts) => {
    if (!ts) return '—';
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  };

  function updateMemMeta() {
    el.memMeta.textContent = '上次整理：' + fmtTime(mem.lastRun) + ' · 共 ' + mem.items.length + ' 条';
  }

  function renderMemList() {
    el.memList.innerHTML = '';
    if (mem.items.length === 0) {
      const p = document.createElement('p');
      p.className = 'hint';
      p.style.margin = '0';
      p.textContent = '还没有记忆。聊几天它会自己整理，也可以在上面手动加。';
      el.memList.appendChild(p);
      return;
    }
    for (const c of CATS) {
      const its = mem.items.filter((it) => it.cat === c.key).sort((a, b) => b.t - a.t);
      if (its.length === 0) continue;
      const d = document.createElement('details');
      d.className = 'mem-group';
      if (c.key === 'bond') d.open = true;
      const sum = document.createElement('summary');
      sum.textContent = c.name + ' (' + its.length + ')';
      d.appendChild(sum);
      for (const it of its) {
        const row = document.createElement('div');
        row.className = 'mem-item';
        const t = document.createElement('span');
        t.className = 't';
        t.textContent = it.text;
        const x = document.createElement('button');
        x.type = 'button';
        x.className = 'x';
        x.textContent = '删除';
        x.dataset.id = it.id;
        row.appendChild(t); row.appendChild(x);
        d.appendChild(row);
      }
      el.memList.appendChild(d);
    }
  }

  function addMemItem() {
    const cat = el.memCat.value;
    const text = el.memText.value.trim();
    if (!isCat(cat)) { flashToast('选个类别'); return; }
    if (!text) { flashToast('内容是空的'); return; }
    const backup = mem.items;
    mem.items = [{ id: uid(), cat: cat, text: text.slice(0, MEM_TEXT_MAX), t: Date.now() }]
      .concat(backup).slice(0, MEM_ITEMS_MAX);
    if (!saveMem()) {
      mem.items = backup;   // 完整回滚
      flashToast('本机存储已满，先清空部分旧对话或记忆');
      return;
    }
    el.memText.value = '';
    renderMemList();
    updateMemMeta();
  }

  function deleteMemItem(id) {
    const n = mem.items.length;
    mem.items = mem.items.filter((it) => it.id !== id);
    if (mem.items.length === n) return;
    if (!saveMem()) flashToast('本机存储已满，删除未能保存');
    renderMemList();
    updateMemMeta();
  }

  function clearMemory() {
    if (!confirm('确定清空所有长期记忆吗？清空后水位归零，下次整理会从全部历史重建。')) return;
    mem = { upto: 0, lastRun: 0, items: [] };
    if (!saveMem()) flashToast('本机存储已满');
    renderMemList();
    updateMemMeta();
  }

  async function manualMemory() {
    if (memBusy) { flashToast('正在整理中，稍等'); return; }
    el.memRun.disabled = true;
    el.memResult.hidden = false;
    el.memResult.className = 'conn-result';
    el.memResult.textContent = (history.length - mem.upto >= MEM_WINDOW) ? '正在整理…' : '正在合并清理现有记忆…';
    const r = await consolidateMemory(true);
    el.memRun.disabled = false;
    if (r.ok) {
      el.memResult.className = 'conn-result ok';
      el.memResult.textContent = '整理完成，现有 ' + r.total + ' 条记忆。';
      renderMemList();
      updateMemMeta();
    } else {
      el.memResult.className = 'conn-result err';
      el.memResult.textContent = '整理失败：' + r.error + '（原有记忆未动）';
    }
  }

  // ================= 主动消息（前台随机主动 + 回来补发） =================
  let paBusy = false;
  let hiddenAt = 0;             // 最近一次切到后台的时刻
  let resumePending = false;    // 用户消息已发、回复被后台打断，待回前台续
  let bgDuringTurn = false;     // 本轮回复期间是否切过后台
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);

  function humanGap(ms) {
    const m = Math.round(ms / 60000);
    if (m < 60) return m + ' 分钟';
    const h = Math.round(m / 60);
    return h + ' 小时';
  }

  // 双方说过话后：刷新水位，下次主动时间随机推后
  function markActive() {
    const now = Date.now();
    cfg.proactiveLast = now;
    cfg.proactiveNext = now + rand(PA_GAP_MIN, PA_GAP_MAX);
    saveJSON(CFG_KEY, cfg);
  }

  // 让模型以 TA 的身份主动发起；返回清洗后的短句数组，失败 []
  async function genProactiveLines(maxLines) {
    const now = new Date();
    const weekday = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
    const p = (n) => String(n).padStart(2, '0');
    const clock = p(now.getHours()) + ':' + p(now.getMinutes());
    const gap = cfg.proactiveLast ? humanGap(now.getTime() - cfg.proactiveLast) : '';

    const system =
      '你是「' + cfg.name + '」。现在不是回复用户，而是你主动给他发微信。' +
      '严格按你的人物设定和说话风格说话，只输出 JSON，不写别的。';
    const text =
      '现在是周' + weekday + ' ' + clock + (gap ? '，距你们上次说话约 ' + gap : '') + '。\n' +
      '请以「' + cfg.name + '」的身份，主动发 ' + (maxLines === 1 ? '一条' : '一到' + maxLines + '条') + '微信，想到什么发什么。\n' +
      '可选的动机（挑最自然的，也可以不在此列）：\n' +
      '- 早上问醒了没、叮嘱吃早饭；饭点问吃了什么；晚上催睡觉、说晚安\n' +
      '- 你正在做的事、刚看到的东西、路上遇到的事，分享给他\n' +
      '- 突然想他、撒娇、无聊了找他、给他起个话题\n' +
      '- 只发一个表情/颜文字配一两个字\n\n' +
      '要求：\n' +
      '1. 每条独立成句，像真人连发微信，可以只有几个字；忠于你的语气词、标点和 emoji 习惯。\n' +
      '2. 不要查岗式连环质问，不要说"好久没联系""在不在"这种生硬开场，不要自我介绍，不要提 AI。\n' +
      '3. 不要总结、不要小作文，内容要具体（有场景、有细节），别发空洞的"今天过得怎么样"。\n\n' +
      '只输出一个 JSON：{"lines":["第一句","第二句"]}';

    let out = '';
    try {
      await callArk(
        [{ role: 'system', content: system }, { role: 'user', content: text }],
        (s) => { out += s; },
        { model: cfg.model, maxTokens: 600, temperature: 0.9, timeout: 60000 }
      );
      const obj = extractJSON(out);
      if (!obj || !Array.isArray(obj.lines)) return [];
      const lines = [];
      for (const raw of obj.lines) {
        const t = flatOne(raw);
        if (!t) continue;
        lines.push(t.slice(0, PA_LINE_MAX));
        if (lines.length >= maxLines) break;
      }
      return lines;
    } catch (e) {
      return [];
    }
  }

  // 她的消息直接冒出来（无 typing 气泡），逐条发，像真人连发
  async function pushProactive(lines) {
    if (!lines.length) return;
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(cfg.name || 'Ta', { body: lines[0], icon: 'icon.png' }); } catch (e) {}
    }
    for (const line of lines) {
      history.push({ role: 'assistant', content: line });
      addBubble('ta', line);
      await sleep(rand(450, 1100));
    }
    saveHistory();
    markActive();
  }

  async function proactiveMaybe(kind) {
    // 配了云函数：主动消息由云端定时+锁屏推送负责，本地引擎让位，避免两边抢节奏
    if ((cfg.fnUrl || '').trim()) return;
    if (paBusy || busy || !cfg.proactive || !configured() || history.length === 0) return;
    const now = Date.now();
    let due = false;
    let maxLines = 1;
    if (kind === 'away') {
      due = !!cfg.proactiveLast && (now - cfg.proactiveLast >= PA_AWAY_MIN);
      maxLines = 3;
    } else {
      due = document.visibilityState === 'visible' && !!cfg.proactiveNext && now >= cfg.proactiveNext;
      maxLines = 2;
    }
    if (!due) return;

    paBusy = true;
    try {
      const n = maxLines === 1 ? 1 : 1 + Math.floor(Math.random() * maxLines);
      const lines = await genProactiveLines(n);
      await pushProactive(lines);
    } finally {
      paBusy = false;
    }
  }

  // ================= 角色包导入 / 导出 =================
  // 字段白名单：导入绝不碰连接相关字段（base/key/model/searchModel）和头像
  const PACK_FIELDS = ['name', 'persona', 'styleNotes', 'examples', 'memory'];

  function importPack(obj) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('不是有效的角色包');
    let nFields = 0;
    for (const k of PACK_FIELDS) {
      if (typeof obj[k] === 'string') { cfg[k] = obj[k]; nFields++; }
    }
    if (typeof obj.proactive === 'boolean') cfg.proactive = obj.proactive;

    let nMem = 0;
    if (Array.isArray(obj.mem)) {
      const items = [];
      for (const it of obj.mem) {
        if (it && isCat(it.cat) && typeof it.text === 'string' && it.text.trim()) {
          items.push({ id: uid(), cat: it.cat, text: it.text.trim().slice(0, MEM_TEXT_MAX), t: Date.now() });
        }
      }
      if (items.length) {
        mem = { upto: history.length, lastRun: Date.now(), items: items.slice(0, MEM_ITEMS_MAX) };
        nMem = mem.items.length;
      }
    }

    if (!nFields && !nMem) throw new Error('角色包里没有可导入的内容');
    saveJSON(CFG_KEY, cfg);
    saveMem();
    if (!cfg.proactiveLast) markActive();

    // 设置页若正开着，把新值同步到界面
    if (!el.mask.classList.contains('hidden')) {
      PACK_FIELDS.forEach((k) => {
        const node = k === 'name' ? el.cfgName
          : k === 'persona' ? el.cfgPersona
          : k === 'styleNotes' ? el.cfgStyleNotes
          : k === 'examples' ? el.cfgExamples : el.cfgMemory;
        node.value = cfg[k];
      });
      el.cfgProactive.checked = !!cfg.proactive;
      renderMemList();
      updateMemMeta();
    }
    refresh();
    renderHistory();
    return { nFields, nMem };
  }

  async function fetchPack() {
    const out = el.packResult;
    out.hidden = false;
    const raw = el.packUrl.value.trim();
    if (!raw) {
      out.className = 'conn-result err';
      out.textContent = '填角色包网址（例如 wanwan.json）';
      return;
    }
    out.className = 'conn-result';
    out.textContent = '正在下载角色包…';
    try {
      const url = new URL(raw, location.href);
      const res = await fetch(url.href, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const obj = await res.json();
      const r = importPack(obj);
      out.className = 'conn-result ok';
      out.textContent = '✅ 导入成功（' + r.nFields + ' 个字段' + (r.nMem ? '，' + r.nMem + ' 条记忆' : '') + '）。';
    } catch (e) {
      out.className = 'conn-result err';
      out.textContent = '导入失败：' + (e.message || e) + '（网址要和页面同域；本地用 http 打开而不是双击文件）';
    }
  }

  function importPasted() {
    const out = el.packResult;
    out.hidden = false;
    const obj = extractJSON(el.packInput.value);
    if (!obj) {
      out.className = 'conn-result err';
      out.textContent = '粘贴的内容不是可识别的 JSON';
      return;
    }
    try {
      const r = importPack(obj);
      out.className = 'conn-result ok';
      out.textContent = '✅ 导入成功（' + r.nFields + ' 个字段' + (r.nMem ? '，' + r.nMem + ' 条记忆' : '') + '）。';
    } catch (e) {
      out.className = 'conn-result err';
      out.textContent = '导入失败：' + (e.message || e);
    }
  }

  function exportPack() {
    const out = el.packResult;
    const pack = {
      name: cfg.name, persona: cfg.persona, styleNotes: cfg.styleNotes,
      examples: cfg.examples, memory: cfg.memory, proactive: !!cfg.proactive,
      apiKey: cfg.apiKey, model: cfg.model, searchModel: cfg.searchModel, base: cfg.base,
      mem: mem.items.map((it) => ({ cat: it.cat, text: it.text })),
    };
    const text = JSON.stringify(pack, null, 2);
    el.packInput.value = text;
    out.hidden = false;
    out.className = 'conn-result ok';
    let copied = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        out.textContent = '✅ 已复制到剪贴板，也显示在上方文本框。⚠ 内容含 API Key，别发给别人。';
      }).catch(() => {
        out.textContent = '已生成在上方文本框，可全选复制。⚠ 内容含 API Key，别发给别人。';
      });
    } else {
      out.textContent = '已生成在上方文本框，可全选复制。⚠ 内容含 API Key，别发给别人。';
    }
  }

  // ================= 锁屏推送（push-sw.js + 云函数） =================
  function urlBase64ToUint8Array(base64String) {
    const pad = '='.repeat((4 - (base64String.length % 4)) % 4);
    const b64 = (base64String + pad).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(b64);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  // 只保留 push-sw.js，卸掉旧版 sw.js；缓存只清非推送队列
  async function setupPushSW() {
    if (!('serviceWorker' in navigator)) return;
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) {
        const u = (r.active && r.active.scriptURL) || '';
        if (!/push-sw\.js(\?.*)?$/.test(u)) await r.unregister();
      }
    } catch (e) {}
    try {
      if (window.caches && window.caches.keys) {
        const ks = await window.caches.keys();
        for (const k of ks) {
          if (k !== Q_CACHE) await window.caches.delete(k);
        }
      }
    } catch (e) {}
    try {
      await navigator.serviceWorker.register('./push-sw.js?v=3');
    } catch (e) {
      console.warn('push-sw 注册失败', e);
    }
  }

  // 读 SW 缓存里的推送队列，把回复补进对话（按 turnId 去重）
  // 她在云端主动发来的消息：追加进对话（按 id 去重），并告诉云端已补单
  const pendingAck = [];
  // 主动消息逐条冒：正在输入…→ 一句 → 停顿 → 再一句；多条未读排队依次播放
  let paRevealChain = Promise.resolve();
  const paWait = (ms) => new Promise((r) => setTimeout(r, ms));

  function applyProactive(p) {
    if (!p || !p.id || !p.text) return false;
    if (history.some((m) => m.paId === p.id)) return false;
    const full = p.fullText || p.text;
    history.push({ role: 'assistant', content: full, paId: p.id });
    saveHistory();
    pendingAck.push(p.id);
    scheduleAck();
    refresh();
    markActive();              // 她刚主动过，前台计时器重置，不重复主动
    void maybeAutoMemory();

    const lines = full.split('\n').map((s) => s.trim()).filter(Boolean);
    paRevealChain = paRevealChain.then(async () => {
      for (let i = 0; i < lines.length; i++) {
        const b = addBubble('ta', '');
        b.classList.add('typing');
        el.chat.scrollTop = el.chat.scrollHeight;
        await paWait(500 + Math.random() * 600);          // 先"输入"一会
        b.querySelector('.bubble').textContent = lines[i];
        b.classList.remove('typing');
        el.chat.scrollTop = el.chat.scrollHeight;
        if (i < lines.length - 1) await paWait(900 + Math.random() * 1200); // 句间停顿
      }
    });
    return true;
  }

  let ackTimer = null;
  function scheduleAck() {
    clearTimeout(ackTimer);
    ackTimer = setTimeout(ackProactive, 1500);
  }
  async function ackProactive() {
    const fn = (cfg.fnUrl || '').trim();
    const ids = pendingAck.splice(0);
    if (!fn || !ids.length) return;
    try {
      await fetch(fn.replace(/\/*$/, '') + '/ack', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids }),
      });
    } catch (e) {}
  }

  async function consumePushQueue() {
    if (!('caches' in window)) return;
    let arr = null;
    try {
      const c = await caches.open(Q_CACHE);
      const r = await c.match(Q_URL);
      if (!r) return;
      arr = await r.json();
      await c.delete(Q_URL);
    } catch (e) { return; }
    if (!Array.isArray(arr)) return;

    for (const p of arr) {
      if (p && p.type === 'proactive') {
        applyProactive(p);
        continue;
      }
      if (!p || p.type !== 'reply' || !p.text) continue;
      if (p.turnId && history.some((m) => m.role === 'assistant' && m.turnId === p.turnId)) continue;
      const last = history[history.length - 1];
      const match = last && last.role === 'user' && (!p.turnId || last.turnId === p.turnId);
      if (!match) continue;

      history.push({ role: 'assistant', content: p.text, turnId: p.turnId || last.turnId });
      saveHistory();
      for (const ln of p.text.split('\n')) {
        if (ln.trim()) addBubble('ta', ln);
      }
      el.chat.scrollTop = el.chat.scrollHeight;
      resumePending = false;
      refresh();
      markActive();
      void maybeAutoMemory();
    }
  }

  // 把角色快照与近期对话同步给云端（定时主动发言的素材）
  async function syncState() {
    const fn = (cfg.fnUrl || '').trim();
    if (!fn) return;
    const recentText = history.slice(-14).map((m) => {
      if (m.role === 'user') return '我: ' + (m.content || '');
      if (m.role === 'assistant') return (cfg.name || 'Ta') + ': ' + (m.content || '');
      return '';
    }).filter(Boolean).join('\n');
    try {
      await fetch(fn.replace(/\/*$/, '') + '/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          state: {
            name: cfg.name, persona: cfg.persona, styleNotes: cfg.styleNotes,
            recentText, memBlock: buildMemoryBlock(),
            proactive: cfg.proactive !== false,
          },
        }),
      });
    } catch (e) {}
  }

  // 主动消息兜底：直接问云端要未补单的消息（推送丢失/换设备时）
  async function fetchPending() {
    const fn = (cfg.fnUrl || '').trim();
    if (!fn) return;
    try {
      const res = await fetch(fn.replace(/\/*$/, '') + '/pending', { cache: 'no-store' });
      const j = await res.json();
      if (Array.isArray(j.items)) j.items.forEach(applyProactive);
    } catch (e) {}
  }

  function isStandalonePWA() {
    return window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;
  }

  function refreshSubBtn() {
    if (!el.subBtn) return;
    const supported = 'PushManager' in window && 'serviceWorker' in navigator;
    if (!supported) el.subBtn.textContent = '此环境不支持推送';
    else if (cfg.pushSubscribed) el.subBtn.textContent = '已订阅（点此重新登记）';
    else el.subBtn.textContent = isStandalonePWA() ? '订阅锁屏推送' : '订阅锁屏推送（需在主屏幕 App 内）';
  }

  async function subscribePush() {
    const out = el.subResult;
    out.hidden = false;
    const fn = (cfg.fnUrl || '').trim();
    if (!fn) {
      out.className = 'conn-result err';
      out.textContent = '先填「云函数地址」并保存，再订阅。';
      return;
    }
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      out.className = 'conn-result err';
      out.textContent = '这个环境不支持 Web Push：iPhone 要先「添加到主屏幕」，从桌面 App 里订阅。';
      return;
    }
    if (!isStandalonePWA()) {
      out.className = 'conn-result err';
      out.textContent = '请在「添加到主屏幕」后的桌面 App 里点订阅，Safari 网页不支持推送。';
      return;
    }
    out.className = 'conn-result';
    out.textContent = '正在向系统申请推送权限…';
    try {
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUB),
        });
      }
      out.textContent = '正在登记到云函数…';
      const res = await fetch(fn.replace(/\/*$/, '') + '/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subscription: sub.toJSON() }),
      });
      const j = await res.json().catch(() => null);
      if (!res.ok || !j || !j.ok) throw new Error((j && j.error) || ('HTTP ' + res.status));
      cfg.pushSubscribed = true;
      saveJSON(CFG_KEY, cfg);
      refreshSubBtn();
      out.className = 'conn-result ok';
      out.textContent = '✅ 订阅成功：以后发完消息切后台，她的回复会直接推到锁屏。';
    } catch (e) {
      out.className = 'conn-result err';
      out.textContent = '订阅失败：' + (e.message || e);
    }
  }

  // ---------- 事件 ----------
  let lastSend = 0;
  function triggerSend() {
    const now = Date.now();
    if (now - lastSend < 300) return;
    lastSend = now;
    send();
  }
  window.__tapSend = triggerSend;
  el.send.addEventListener('click', (e) => { e.preventDefault(); triggerSend(); });
  el.composer.addEventListener('submit', (e) => { e.preventDefault(); triggerSend(); });
  el.input.addEventListener('input', autosize);
  el.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  function updateNetBtn() {
    const ready = !!(cfg.searchModel || '').trim();
    el.netBtn.classList.toggle('on', ready && netOn);
    el.netBtn.title = ready ? (netOn ? '联网已开启（点按关闭）' : '联网已关闭（点按开启）') : '先在设置里填「联网接入点 ID」';
  }
  el.netBtn.addEventListener('click', () => {
    if (!(cfg.searchModel || '').trim()) { flashToast('先在「···」设置里填联网接入点 ep-'); openSettings(); return; }
    netOn = !netOn;
    updateNetBtn();
    flashToast(netOn ? '🌐 联网已开启：纯文字会先上网查' : '已关闭联网，用模型自身知识回答');
  });
  el.imgBtn.addEventListener('click', () => el.fileInput.click());
  el.fileInput.addEventListener('change', (e) => { onFiles(e.target.files); e.target.value = ''; });
  el.avatarBtn.addEventListener('click', () => el.avatarInput.click());
  el.avatarInput.addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try { setAvatar(await makeAvatar(f)); }
    catch (err) { el.status.textContent = '头像读取失败'; el.status.className = 'status err'; }
  });
  el.avatarClear.addEventListener('click', () => setAvatar(''));
  el.openSettings.addEventListener('click', openSettings);
  el.closeSettings.addEventListener('click', closeSettings);
  el.mask.addEventListener('click', (e) => { if (e.target === el.mask) closeSettings(); });
  el.saveSettings.addEventListener('click', saveSettings);
  el.clearChat.addEventListener('click', clearChat);
  el.testConn.addEventListener('click', testConn);

  // 风格学习
  el.learnBtn.addEventListener('click', () => el.learnInput.click());
  el.learnInput.addEventListener('change', (e) => { onLearnFiles(e.target.files); e.target.value = ''; });
  el.sideLeft.addEventListener('click', () => setLearnSide('left'));
  el.sideRight.addEventListener('click', () => setLearnSide('right'));
  el.learnRun.addEventListener('click', learnStyle);
  el.learnAdopt.addEventListener('click', adoptLearn);
  el.learnDiscard.addEventListener('click', discardLearn);

  // 长期记忆
  el.memRun.addEventListener('click', manualMemory);
  el.memAdd.addEventListener('click', addMemItem);
  el.memText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addMemItem(); }
  });
  el.memList.addEventListener('click', (e) => {
    const b = e.target.closest && e.target.closest('.mem-item .x');
    if (b && b.dataset.id) deleteMemItem(b.dataset.id);
  });
  el.memClear.addEventListener('click', clearMemory);
  CATS.forEach((c) => {
    const o = document.createElement('option');
    o.value = c.key;
    o.textContent = c.name;
    el.memCat.appendChild(o);
  });

  // 系统通知权限（仅当浏览器支持；iOS 需添加到主屏幕后）
  el.notifBtn.addEventListener('click', async () => {
    const out = el.notifResult;
    out.hidden = false;
    if (!('Notification' in window)) {
      out.className = 'conn-result err';
      out.textContent = '这个浏览器不支持通知（iPhone 需先把 App 加到主屏幕）。';
      return;
    }
    if (Notification.permission === 'granted') {
      out.className = 'conn-result ok';
      out.textContent = '✅ 通知已开启：App 开着但你在看别的页面时，她主动发消息会弹通知。';
      return;
    }
    out.className = 'conn-result';
    out.textContent = '正在请求权限…';
    let perm = Notification.permission;
    try { perm = await Notification.requestPermission(); } catch (e) {}
    if (perm === 'granted') {
      out.className = 'conn-result ok';
      out.textContent = '✅ 通知已开启。';
    } else {
      out.className = 'conn-result err';
      out.textContent = '没拿到权限；需要时可在浏览器设置里改。';
    }
  });

  // 角色包
  el.packFetch.addEventListener('click', fetchPack);
  el.packImport.addEventListener('click', importPasted);
  el.packExport.addEventListener('click', exportPack);

  // 锁屏推送
  el.subBtn.addEventListener('click', subscribePush);

  // 控制台自检：__dbg.buildSystem() 看提示词；__dbg.proactiveTest() 立刻看她主动发消息
  window.__dbg = {
    buildSystem,
    consolidateMemory,
    get mem() { return mem; },
    proactiveTest: async () => {
      const lines = await genProactiveLines(3);
      await pushProactive(lines);
    },
  };

  // ---------- 启动 ----------
  // 一次性配置导入：用带 ?key=&model= 的链接打开一次，自动填好并存本机，然后清掉网址参数
  try {
    const q = new URLSearchParams(location.search);
    const into = {};
    if (q.get('key')) into.apiKey = q.get('key');
    if (q.get('model')) into.model = q.get('model');
    if (q.get('name')) into.name = q.get('name');
    if (q.get('persona')) into.persona = q.get('persona');
    if (q.get('styleNotes')) into.styleNotes = q.get('styleNotes');
    if (q.get('memory')) into.memory = q.get('memory');
    if (q.get('examples')) into.examples = q.get('examples');
    if (q.get('proactive') === '1') into.proactive = true;
    let importedAny = Object.keys(into).length > 0;
    if (importedAny) {
      cfg = Object.assign({}, cfg, into);
      saveJSON(CFG_KEY, cfg);
    }
    // 结构化记忆种子：?mem=[{"cat":"fact","text":"…"}]
    const memRaw = q.get('mem');
    if (memRaw) {
      try {
        const arr = JSON.parse(memRaw);
        if (Array.isArray(arr)) {
          const items = [];
          for (const it of arr) {
            if (it && isCat(it.cat) && typeof it.text === 'string' && it.text.trim()) {
              items.push({ id: uid(), cat: it.cat, text: it.text.trim().slice(0, MEM_TEXT_MAX), t: Date.now() });
            }
          }
          if (items.length) {
            mem = { upto: history.length, lastRun: Date.now(), items: items.slice(0, MEM_ITEMS_MAX) };
            saveMem();
            importedAny = true;
          }
        }
      } catch (e) {}
    }
    if (importedAny) history.replaceState(null, '', location.pathname);
  } catch (e) {}

  refresh();
  renderHistory();
  updateNetBtn();

  // 主动消息：老用户第一次升级时没有水位，先建水位不补发；否则回来就看她的"留言"
  if (!cfg.proactiveLast) markActive();
  void proactiveMaybe('away');
  setInterval(() => { void proactiveMaybe('tick'); }, PA_CHECK_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      hiddenAt = Date.now();
      if (busy) bgDuringTurn = true;
      return;
    }
    if (document.visibilityState === 'visible') {
      void resumeTurn();        // 先把被后台打断的回复续上
      const leftLong = !!cfg.proactiveLast && (Date.now() - cfg.proactiveLast >= PA_AWAY_MIN);
      void proactiveMaybe(leftLong ? 'away' : 'tick');
      void fetchPending();      // 兜底拉取云端主动消息
    }
  });

  // 上次在后台时直接划掉了 App：重开后最后一条是用户消息，自动补回复
  if (history.length && history[history.length - 1].role === 'user' && configured()) {
    resumePending = true;
    setTimeout(() => { void resumeTurn(); }, 1000);
  }

  // 推送 SW：注册 push-sw.js（不缓存页面）、卸掉旧版 sw.js、接收后台回复
  void setupPushSW().then(() => {
    void consumePushQueue();
    void syncState();
    void fetchPending();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'push-queued') void consumePushQueue();
      });
    }
  });
})();
  </script>
