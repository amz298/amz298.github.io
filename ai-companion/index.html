  // ================= 长期记忆（自动整理 + 手动管理） =================
  function historyTextSince(upto, src, whoName) {
    const lines = [];
    for (const m of (src || history).slice(upto)) {
      if (!m || typeof m !== 'object') continue;
      const text = typeof m.content === 'string' ? m.content.trim() : '';
      if (m.role === 'user') {
        lines.push('我: ' + (text || ((m.images && m.images.length) ? '[图片]' : '')));
      } else if (m.role === 'assistant') {
        lines.push((whoName || cfg.name || 'Ta') + ': ' + text);
      }
    }
    let joined = lines.join('\n');
    if (joined.length > MEM_FEED_CHARS) {
      joined = '（更早的对话本次省略）\n' + joined.slice(joined.length - MEM_FEED_CHARS);
    }
    return joined;
  }

  async function consolidateMemory(manual) {
    if (memBusy) return { ok: false, error: 'busy' };
    memBusy = true;
    // 整理可能跑 90 秒：先快照发起人物，await 期间用户切人物也不能串写
    const ownerId = chats.active;
    const ownerListItem = chats.list.find((x) => x.id === ownerId);
    const ownerMemKey = ownerListItem ? (ownerListItem.memKey || MEM_KEY) : MEM_KEY;
    const ownerMem = mem;
    const ownerHist = history;
    const ownerName = cfg.name;
    try {
      if (ownerMem.upto > ownerHist.length) ownerMem.upto = ownerHist.length;
      const newChat = historyTextSince(ownerMem.upto, ownerHist, ownerName) || '（暂无新对话，只做合并与清理）';

      const system =
        '你是长期记忆整理引擎。读取「现有记忆条目」和「新增聊天记录」，对记忆做新增、更新、合并、删除，输出整理后的完整条目集合。' +
        '只依据对话中明确出现的信息：不推测、不脑补、不写评价和鸡汤。';
      const text =
        '【记忆类别】\n' +
        '- fact：用户的客观事实（身份、职业、所在地、处境）\n' +
        '- like：用户明确表达的喜好与厌恶\n' +
        '- event：已发生或确定将发生的事件、近况（尽量带时间）\n' +
        '- relation：用户提到的人际关系及对其态度\n' +
        '- goal：用户的目标、计划、待办、心愿\n' +
        '- bond：用户与「' + ownerName + '」之间独有的共同经历、梗、约定、默契，必须是双方互动中产生的\n\n' +
        '【现有记忆条目】（JSON；保留 id 表示沿用该条目）\n' +
        JSON.stringify(ownerMem.items.map((it) => ({ id: it.id, cat: it.cat, text: it.text }))) + '\n\n' +
        '【新增聊天记录】（「我:」是用户，「Ta:」是陪伴角色；[图片] 表示当时发了图片，不许猜测图片内容）\n' +
        newChat + '\n\n' +
        '【整理规则】\n' +
        '1. 新增：提炼新对话中明确且以后有用的信息；寒暄、情绪宣泄、一次性无价值内容不收。\n' +
        '2. 更新：同一事实有新说法，用新内容替换并沿用旧 id。\n' +
        '3. 合并：重复或同主题条目合并为一条，保留更具体的。\n' +
        '4. 删除：过时、被否认、错误、过细碎的条目。\n' +
        '5. bond 宁缺毋滥：只有真正属于两人之间的内容才放。\n' +
        '6. 每条第三人称客观陈述，≤50 个汉字，不带「可能/好像」，不抄对话原文。\n' +
        '   正例：{"cat":"fact","text":"用户做欧洲站亚马逊，德国站为主"}\n' +
        '   反例：{"cat":"event","text":"他好像今天有点不开心吧"}\n' +
        '7. 总数 ≤' + MEM_ITEMS_MAX + ' 条，按重要性从高到低排序：稳定常用事实与 bond 靠前，时效性旧事件靠后。\n' +
        '8. 未在新对话中出现但仍有效的旧条目继续保留并保留其 id。\n\n' +
        '【输出】只输出一个 JSON 对象，无解释无围栏：\n' +
        '{"items":[{"id":"m_xxx","cat":"fact","text":"……"}]}\n' +
        '新增条目 id 输出空字符串即可。';

      let out = '';
      await callArk(
        [{ role: 'system', content: system }, { role: 'user', content: text }],
        (s) => { out += s; },
        { model: cfg.model, maxTokens: 3000, temperature: 0.2, timeout: 90000 }
      );

      const obj = extractJSON(out);
      if (!obj || typeof obj !== 'object' || !Array.isArray(obj.items)) throw new Error('整理结果无法识别');

      const oldById = {};
      ownerMem.items.forEach((it) => { oldById[it.id] = it; });
      const seenText = {};
      const newItems = [];
      for (const raw of obj.items) {
        if (!raw || typeof raw !== 'object' || !isCat(raw.cat)) continue;
        const t0 = typeof raw.text === 'string' ? raw.text.trim() : '';
        if (!t0) continue;
        const tx = t0.slice(0, MEM_TEXT_MAX);
        const k = normKey(tx);
        if (seenText[k]) continue;
        seenText[k] = 1;

        const oldId = typeof raw.id === 'string' ? raw.id : '';
        const old = oldId && oldById[oldId];
        if (old) newItems.push({ id: old.id, cat: raw.cat, text: tx, t: old.t });
        else newItems.push({ id: uid(), cat: raw.cat, text: tx, t: Date.now() });
        if (newItems.length >= MEM_ITEMS_MAX) break;
      }

      // fail-closed：自动路径下模型若清空全部条目，保留旧记忆
      if (newItems.length === 0 && ownerMem.items.length > 0 && !manual) throw new Error('empty');

      ownerMem.items = newItems;
      ownerMem.upto = ownerHist.length;
      ownerMem.lastRun = Date.now();
      if (chats.active === ownerId) {
        // 没切走：全局变量就是 owner 本身，走正常保存
        mem = ownerMem;
        if (!saveMem()) return { ok: false, error: '本机存储已满，先删掉一些旧对话或记忆' };
      } else {
        // 已切到别人：直接写回原人物的键，绝不碰当前全局
        try { saveJSON(ownerMemKey, ownerMem); }
        catch (e) { return { ok: false, error: '记忆保存失败：' + (e.message || e) }; }
      }
      return { ok: true, total: newItems.length };
    } catch (e) {
      return { ok: false, error: e.message || String(e) };
    } finally {
      memBusy = false;
    }
  }

  async function maybeAutoMemory() {
    try {
      if (memBusy || !configured()) return;
      if (mem.upto > history.length) mem.upto = history.length;
      if (history.length - mem.upto >= MEM_WINDOW) await consolidateMemory(false);
    } catch (e) {}
  }

  const fmtTime = (ts) => {
    if (!ts) return '—';
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());

  function addMemItem() {
    const cat = el.memCat.value;
    const text = el.memText.value.trim();
    if (!isCat(cat)) { flashToast('选个类别'); return; }
    if (!text) { flashToast('内容是空的'); return; }
    const backup = mem.items;
    mem.items = [{ id: uid(), cat: cat, text: text.slice(0, MEM_TEXT_MAX), t: Date.now() }]
      .concat(backup).slice(0, MEM_ITEMS_MAX);
    if (!saveMem()) {
      mem.items = backup;   // 完整回滚
      flashToast('本机存储已满，先清空部分旧对话或记忆');
      return;

    el.memText.value = '';

  // ================= 主动消息（前台随机主动 + 回来补发） =================
  let paBusy = false;
  let hiddenAt = 0;             // 最近一次切后台的时刻
  let resumePending = false;    // 用户消息已发、回复被后台打断，待回前台续
  let resumeChatId = null;      // 被打断的那个人物 id，恢复只认它
  let bgDuringTurn = false;     // 本轮回复期间是否切过后台
  const cloudFlights = new Map(); // 正在接管的请求，避免同一轮重复提交
  const cloudCompleted = new Set(); // 已接管的最近轮次
  let activePlan = null;        // 当前进行中的调用参数（切后台时云端接管用）
  let activeTurnId = null;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);

  function humanGap(ms) {
    const m = Math.round(ms / 60000);
    if (m < 60) return m + ' 分钟';
    const h = Math.round(m / 60);
    return h + ' 小时';

  // 双方说过话后：刷新水位，下次主动时间随机推后
  function markActive() {
    const now = Date.now();
    cfg.proactiveLast = now;
    cfg.proactiveNext = now + rand(PA_GAP_MIN, PA_GAP_MAX);

    syncChatSnapshot();

  // 让模型以 TA 的身份主动发起；返回清洗后的短句数组，失败 []
  async function genProactiveLines(maxLines) {
    const now = new Date();
    const weekday = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
    const p = (n) => String(n).padStart(2, '0');
    const clock = p(now.getHours()) + ':' + p(now.getMinutes());
    const gap = cfg.proactiveLast ? humanGap(now.getTime() - cfg.proactiveLast) : '';

    const system =
      '你是「' + cfg.name + '」。现在不是回复用户，而是你主动给他发微信。' +
      '严格按你的人物设定和说话风格说话，只输出 JSON，不写别的。';
    const text =
      '现在是周' + weekday + ' ' + clock + (gap ? '，距你们上次说话约 ' + gap : '') + '。\n' +
      ((cfg.habits || '').trim() ? '【你的日常习惯（主动发消息要贴合你的作息）】\n' + (cfg.habits || '').trim() + '\n\n' : '') +
      '请以「' + cfg.name + '」的身份，主动发 ' + (maxLines === 1 ? '一条' : '一到' + maxLines + '条') + '微信，想到什么发什么。\n' +
      '可选的动机（挑最自然的，也可以不在此列）：\n' +
      '- 早上问醒了没、叮嘱吃早饭；饭点问吃了什么；晚上催睡觉、说晚安\n' +
      '- 你正在做的事、刚看到的东西、路上遇到的事，分享给他\n' +
      '- 突然想他、撒娇、无聊了找他、给他起个话题\n' +
      '- 只发一个表情/颜文字配一两个字\n\n' +
      '要求：\n' +
      '1. 每条独立成句，像真人连发微信，可以只有几个字；忠于你的语气词、标点和 emoji 习惯。\n' +
      '2. 不要查岗式连环质问，不要说"好久没联系""在不在"这种生硬开场，不要自我介绍，不要提 AI。\n' +
      '3. 不要总结、不要小作文，内容要具体（有场景、有细节），别发空洞的"今天过得怎么样"。\n\n' +
      '只输出一个 JSON：{"lines":["第一句","第二句"]}';

    let out = '';
    try {
      await callArk(
        [{ role: 'system', content: system }, { role: 'user', content: text }],
        (s) => { out += s; },
        { model: cfg.model, maxTokens: 600, temperature: 0.9, timeout: 60000 }
      );
      const obj = extractJSON(out);
      if (!obj || !Array.isArray(obj.lines)) return [];
      const lines = [];
      for (const raw of obj.lines) {
        const t = flatOne(raw);
        if (!t) continue;
        lines.push(t.slice(0, PA_LINE_MAX));
        if (lines.length >= maxLines) break;
      }
      return lines;
    } catch (e) {
      return [];
    }
  }

  // 她的消息直接冒出来（无 typing 气泡），逐条发，像真人连发
  async function pushProactive(lines) {
    if (!lines.length) return;
    const ownerId = chats.active;
    const detached = () => chats.active !== ownerId;
    if (!detached() && document.hidden && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(cfg.name || 'Ta', { body: lines[0], icon: 'icon.png' }); } catch (e) {}
    }
    for (let i = 0; i < lines.length; i++) {
      if (detached()) {
        // 已切到别的会话：没冒完的消息静落原会话+亮红点（已冒出的在 switchChat 时随历史落盘）
        const rest = lines.slice(i);
        mutateOtherChatHistory(ownerId, (h) => {
          for (const line of rest) h.push({ role: 'assistant', content: line, t: Date.now() });
          return { save: true, bump: true };
        });
        return;
      }
      const t = Date.now();
      history.push({ role: 'assistant', content: lines[i], t: t });
      addBubble('ta', lines[i], null, t);
      await sleep(rand(450, 1100));
    }
    if (detached()) return;
    saveHistory();
    noteUnread();
    markActive();
  }

  async function proactiveMaybe(kind) {
    // 配了云函数：主动消息由云端定时+锁屏推送负责，本地引擎让位，避免两边抢节奏
    if ((cfg.fnUrl || '').trim()) return;
    if (paBusy || busy || !cfg.proactive || !configured() || history.length === 0) return;
    const now = Date.now();
    let due = false;
    let maxLines = 1;
    if (kind === 'away') {
      due = !!cfg.proactiveLast && (now - cfg.proactiveLast >= PA_AWAY_MIN);
      maxLines = 3;
    } else {
      due = document.visibilityState === 'visible' && !!cfg.proactiveNext && now >= cfg.proactiveNext;
      maxLines = 2;
    }
    if (!due) return;

    paBusy = true;
    try {
      const n = maxLines === 1 ? 1 : 1 + Math.floor(Math.random() * maxLines);
      const lines = await genProactiveLines(n);
      await pushProactive(lines);
    } finally {
      paBusy = false;
    }
  }

  // ================= 角色包导入 / 导出 =================
  // 字段白名单：导入绝不碰连接相关字段（base/key/model）和头像
  const PACK_FIELDS = ['name', 'persona', 'styleNotes', 'examples', 'memory', 'habits'];

  function importPack(obj) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('不是有效的角色包');
    let nFields = 0;
    for (const k of PACK_FIELDS) {
      if (typeof obj[k] === 'string') { cfg[k] = obj[k]; nFields++; }
    }
    if (typeof obj.proactive === 'boolean') cfg.proactive = obj.proactive;

    let nMem = 0;
    if (Array.isArray(obj.mem)) {
      const items = [];
      for (const it of obj.mem) {
        if (it && isCat(it.cat) && typeof it.text === 'string' && it.text.trim()) {
          items.push({ id: uid(), cat: it.cat, text: it.text.trim().slice(0, MEM_TEXT_MAX), t: Date.now() });
        }
      }
      if (items.length) {
        mem = { upto: history.length, lastRun: Date.now(), items: items.slice(0, MEM_ITEMS_MAX) };
        nMem = mem.items.length;
      }
    }

    if (!nFields && !nMem) throw new Error('角色包里没有可导入的内容');
    saveJSON(CFG_KEY, cfg);
    syncChatSnapshot();
    saveMem();
    if (!cfg.proactiveLast) markActive();

    // 设置页若正开着，把新值同步到界面
    if (!el.mask.classList.contains('hidden')) {
      PACK_FIELDS.forEach((k) => {
        const node = k === 'name' ? el.cfgName
          : k === 'persona' ? el.cfgPersona
          : k === 'styleNotes' ? el.cfgStyleNotes
          : k === 'memory' ? el.cfgMemory
          : k === 'habits' ? el.cfgHabits : el.cfgExamples;
        node.value = cfg[k];
      });
      el.cfgProactive.checked = !!cfg.proactive;
      renderMemList();
      updateMemMeta();
      growAllFields();
    }
    refresh();
    renderHistory();
    return { nFields, nMem };
  }

  // ================= 锁屏推送（push-sw.js + 云函数） =================
  function urlBase64ToUint8Array(base64String) {
    const pad = '='.repeat((4 - (base64String.length % 4)) % 4);
    const b64 = (base64String + pad).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(b64);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  // 只保留 push-sw.js，卸掉旧版 sw.js；缓存只清非推送队列
  async function setupPushSW() {
    if (!('serviceWorker' in navigator)) return;
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) {
        const u = (r.active && r.active.scriptURL) || '';
        if (!/push-sw\.js(\?.*)?$/.test(u)) await r.unregister();
      }
    } catch (e) {}
    try {
      if (window.caches && window.caches.keys) {
        const ks = await window.caches.keys();
        for (const k of ks) {
          if (k !== Q_CACHE) await window.caches.delete(k);
        }
      }
    } catch (e) {}
    try {
      await navigator.serviceWorker.register('./push-sw.js?v=5');
    } catch (e) {
      console.warn('push-sw 注册失败', e);
    }
  }

  // 读 SW 缓存里的推送队列，把回复补进对话（按 turnId 去重）
  // 她在云端主动发来的消息：追加进对话（按 id 去重），并告诉云端已补单
  const pendingAck = [];
  // 主动消息逐条冒：正在输入…→ 一句 → 停顿 → 再一句；多条未读排队依次播放
  let paRevealChain = Promise.resolve();
  let paRevealVersion = 0;
  const paWait = (ms) => new Promise((r) => setTimeout(r, ms));

  // 主动消息分发：属于其他人物的写进对方历史并亮红点；属于当前人物的走下面的气泡动画
  function applyProactive(p) {
    if (!p || !p.id || !p.text) return false;
    const chatId = p.chatId || chats.active;   // 旧云端条目可能没有 chatId，归当前人物
    if (chatId !== chats.active) return applyProactiveOther(p, chatId);
    return applyProactiveActive(p);
  }

  // 其他人物的主动消息：不切屏、不播动画，静默落库 + 列表亮未读；无论新旧都要 ack
  function applyProactiveOther(p, chatId) {
    pendingAck.push(p.id);
    scheduleAck();
    const r = mutateOtherChatHistory(chatId, (h) => {
      if (h.some((m) => m.paId === p.id)) return {};          // 已补过：不重复写
      h.push({ role: 'assistant', content: p.fullText || p.text, paId: p.id, t: p.t || Date.now() });
      return { save: true, bump: true };
    });
    return !!r.gone || !!r.save;       // 人物已删（ack 丢弃）或写入成功 → 从队列移除；存储失败则保留重试
  }

  function applyProactiveActive(p) {
    if (history.some((m) => m.paId === p.id)) {
      pendingAck.push(p.id);
      scheduleAck();
      return true;
    }
    const full = p.fullText || p.text;
    const paT = p.t || Date.now();
    history.push({ role: 'assistant', content: full, paId: p.id, t: paT });
    if (!saveHistory()) { history.pop(); return false; }
    noteUnread();
    pendingAck.push(p.id);
    scheduleAck();
    refresh();
    if (history.length === 1) {          // 空对话里冒出第一条：去掉「还没有对话」空提示
      const h0 = el.chat.querySelector('.hint-block');
      if (h0) h0.remove();
    }
    markActive();              // 她刚主动过，前台计时器重置，不重复主动
    void maybeAutoMemory();

    const lines = full.split('\n').map((s) => s.trim()).filter(Boolean);
    const version = paRevealVersion;
    paRevealChain = paRevealChain.then(async () => {
      for (let i = 0; i < lines.length; i++) {
        if (version !== paRevealVersion) return;
        const b = addBubble('ta', '', null, paT);
        b.classList.add('typing');
        el.chat.scrollTop = el.chat.scrollHeight;
        await paWait(500 + Math.random() * 600);          // 先"输入"一会
        if (version !== paRevealVersion) return;
        b.querySelector('.bubble').textContent = lines[i];
        b.classList.remove('typing');
        el.chat.scrollTop = el.chat.scrollHeight;
        if (i < lines.length - 1) await paWait(900 + Math.random() * 1200); // 句间停顿
      }
    });
    return true;
  }

  let ackTimer = null;
  function scheduleAck() {
    clearTimeout(ackTimer);
    ackTimer = setTimeout(ackProactive, 1500);
  }
  async function ackProactive() {
    const fn = (cfg.fnUrl || '').trim();
    const ids = pendingAck.splice(0);
    if (!fn || !ids.length) return;
    try {
      const res = await cloudFetch('/ack', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
    } catch (e) {
      pendingAck.push(...ids);
    }
  }

  let pushQueueBusy = false;
  let pushQueueAgain = false;
  async function consumePushQueue() {
    if (!('caches' in window)) return;
    if (pushQueueBusy) { pushQueueAgain = true; return; }
    pushQueueBusy = true;
    try {
      const c = await caches.open(Q_CACHE);
      const requests = await c.keys();
      for (const request of requests) {
        if (request.url !== Q_URL && !request.url.startsWith(Q_URL + '?id=')) continue;
        const r = await c.match(request);
        if (!r) continue;
        let entries;
        try {
          const value = await r.json();
          entries = request.url === Q_URL && Array.isArray(value) ? value : [value];
        } catch (e) {
          continue;
        }
        // The old worker used one array entry. Keep it until every message
        // has been applied or recognized as a duplicate.
        let done = true;
        for (const p of entries) {
          if (!applyQueuedPush(p)) done = false;
        }
        if (done) await c.delete(request);
      }
    } catch (e) {
      console.warn('推送队列读取失败', e);
    } finally {
      pushQueueBusy = false;
      if (pushQueueAgain) { pushQueueAgain = false; void consumePushQueue(); }
    }
  }

  function applyQueuedPush(p, opts) {
    if (!p || !p.type) return true;
    if (busy) return false;
    if (p.type === 'proactive') return applyProactive(p);
    if (p.type !== 'reply' || !p.text) return true;
    const chatId = p.chatId || chats.active;   // 旧云端条目可能没有 chatId，归当前人物
    if (chatId !== chats.active) return applyReplyOther(p, chatId, opts);
    if (p.turnId && history.some((m) => m.role === 'assistant' && m.turnId === p.turnId)) {
      // 云端 outbox 补单的是完整回复：之前推送/保存的若是截断版，这里升级成完整版
      if (opts && opts.full) {
        const idx = history.findIndex((m) => m.role === 'assistant' && m.turnId === p.turnId);
        if (idx >= 0 && history[idx].content !== p.text) {
          history[idx].content = p.text;
          if (history[idx].incomplete) delete history[idx].incomplete;
          if (!saveHistory()) return false;
          renderHistory();
          noteUnread();
        }
      }
      // An in-memory reply is not enough: a failed localStorage write must
      // leave the push available for recovery after the user frees space.
      try {
        const stored = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
        if (stored.some((m) => m.role === 'assistant' && m.turnId === p.turnId)) return true;
      } catch (e) {}
      return saveHistory();
    }

    const at = p.turnId
      ? history.findIndex((m) => m.role === 'user' && m.turnId === p.turnId)
      : history.length - 1;
    const user = history[at];
    if (!user || user.role !== 'user') return false;
    const repT = Date.now();
    history.splice(at + 1, 0, { role: 'assistant', content: p.text, turnId: p.turnId || user.turnId, t: repT });
    if (!saveHistory()) { history.splice(at + 1, 1); return false; }
    noteUnread();
    renderHistory();
    resumePending = false;
    resumeChatId = null;
    refresh();
    markActive();
    void maybeAutoMemory();
    return true;
  }

  // 回复归属【其他人物】（如切后台期间又切了人物）：写进对方历史、亮未读，不动当前界面
  function applyReplyOther(p, chatId, opts) {
    const r = mutateOtherChatHistory(chatId, (h) => {
      const exIdx = p.turnId ? h.findIndex((m) => m.role === 'assistant' && m.turnId === p.turnId) : -1;
      if (exIdx >= 0) {
        // outbox 完整版升级之前的截断推送：要落盘但不重复计未读
        if (opts && opts.full && h[exIdx].content !== p.text) {
          h[exIdx].content = p.text;
          delete h[exIdx].incomplete;
          return { save: true, bump: false };
        }
        return {};
      }
      const at = p.turnId
        ? h.findIndex((m) => m.role === 'user' && m.turnId === p.turnId)
        : h.length - 1;
      if (at < 0 || !h[at] || h[at].role !== 'user') return { discard: true };  // 提问已删，无家可归
      h.splice(at + 1, 0, { role: 'assistant', content: p.text, turnId: p.turnId || h[at].turnId, t: Date.now() });
      return { save: true, bump: true };
    });
    // 人物已删或提问已删：ack 丢弃；写入成功移除；存储失败保留队列重试
    return !!r.gone || !!r.discard || !!r.save;
  }

  // 回复进行中用户切走/新建了别的会话：回复到达后静默写回发起的那个会话并亮红点，
  // 不碰当前界面。按 turnId 幂等（锁屏补单可能已抢先写入）。
  function parkAssistantTo(chatId, turnId, text, incomplete) {
    return mutateOtherChatHistory(chatId, (h) => {
      if (h.some((m) => m.role === 'assistant' && m.turnId === turnId)) return {};
      const at = h.findIndex((m) => m.role === 'user' && m.turnId === turnId);
      if (at < 0) return { discard: true };
      const m = { role: 'assistant', content: text, turnId: turnId, t: Date.now() };
      if (incomplete) m.incomplete = true;
      h.splice(at + 1, 0, m);
      return { save: true, bump: true };
    });
  }

  // 把角色快照与近期对话同步给云端（多人物：每个 chatId 一份快照，定时器遍历全员主动发言）。
  // extra.deletedIds：删除人物时联动清掉云端该人物的快照/节奏/未补单消息。
  async function syncState(extra) {
    const fn = (cfg.fnUrl || '').trim();
    if (!fn) return;
    const recentText = history.slice(-14).map((m) => {
      if (m.role === 'user') return '我: ' + (m.content || '');
      if (m.role === 'assistant') return (cfg.name || 'Ta') + ': ' + (m.content || '');
      return '';
    }).filter(Boolean).join('\n');
    const body = {
      chatId: chats.active,
      state: {
        name: cfg.name, persona: cfg.persona, styleNotes: cfg.styleNotes,
        habits: cfg.habits, recentText, memBlock: buildMemoryBlock(),
        model: cfg.model, proactive: cfg.proactive !== false,
      },
      roster: chats.list.map((c) => ({ id: c.id, name: c.name || '' })),
    };
    Object.assign(body, extra || {});
    try {
      await cloudFetch('/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    } catch (e) {}
  }

  // 主动消息兜底：直接问云端要未补单的消息（推送丢失/换设备时）
  async function fetchPending() {
    const fn = (cfg.fnUrl || '').trim();
    if (!fn) return;
    try {
      const res = await cloudFetch('/pending', { cache: 'no-store' });
      if (!res) return;
      const j = await res.json();
      if (Array.isArray(j.items)) j.items.forEach((p) => {
        if (p && p.type === 'reply') {
          // 云端补单的完整回复：长回复推送被截断时，这里用完整版升级
          applyQueuedPush(p, { full: true });
          if (p.id) { pendingAck.push(p.id); scheduleAck(); }
        } else {
          applyProactive(p);
        }
      });
    } catch (e) {}
  }

  function isStandalonePWA() {
    return window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;
  }

  function refreshSubBtn() {
    if (!el.subBtn) return;
    const supported = 'PushManager' in window && 'serviceWorker' in navigator;
    if (!supported) el.subBtn.textContent = '此环境不支持推送';
    else if (cfg.pushSubscribed) el.subBtn.textContent = '已订阅（点此重新登记）';
    else el.subBtn.textContent = isStandalonePWA() ? '订阅锁屏推送' : '订阅锁屏推送（需在主屏幕 App 内）';
  }

  async function subscribePush() {
    const out = el.subResult;
    out.hidden = false;
    const fn = (cfg.fnUrl || '').trim();
    if (!fn) {
      out.className = 'conn-result err';
      out.textContent = '先填「云函数地址」并保存，再订阅。';
      return;
    }
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      out.className = 'conn-result err';
      out.textContent = '这个环境不支持 Web Push：iPhone 要先「添加到主屏幕」，从桌面 App 里订阅。';
      return;
    }
    if (!isStandalonePWA()) {
      out.className = 'conn-result err';
      out.textContent = '请在「添加到主屏幕」后的桌面 App 里点订阅，Safari 网页不支持推送。';
      return;
    }
    out.className = 'conn-result';
    out.textContent = '正在向系统申请推送权限…';
    try {
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUB),
        });
      }
      out.textContent = '正在登记到云函数…';
      const res = await cloudFetch('/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subscription: sub.toJSON() }),
      });
      const j = await res.json().catch(() => null);
      if (!res.ok || !j || !j.ok) throw new Error((j && j.error) || ('HTTP ' + res.status));
      cfg.pushSubscribed = true;
      saveJSON(CFG_KEY, cfg);
      refreshSubBtn();
      out.className = 'conn-result ok';
      out.textContent = '✅ 订阅成功：以后发完消息切后台，她的回复会直接推到锁屏。';
    } catch (e) {
      out.className = 'conn-result err';
      out.textContent = '订阅失败：' + (e.message || e);
    }
  }

  // ---------- 事件 ----------
  let lastSend = 0;
  function triggerSend() {
    const now = Date.now();
    if (now - lastSend < 300) return;
    lastSend = now;
    send();
  }
  el.send.addEventListener('click', (e) => { e.preventDefault(); triggerSend(); });
  el.chat.addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('button[data-continue-turn]');
    if (btn) void continueIncomplete(btn.dataset.continueTurn);
  });
  el.composer.addEventListener('submit', (e) => { e.preventDefault(); triggerSend(); });
  el.input.addEventListener('input', autosize);
  el.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  el.imgBtn.addEventListener('click', () => el.fileInput.click());
  el.fileInput.addEventListener('change', (e) => { onFiles(e.target.files); e.target.value = ''; });
  el.avatarBtn.addEventListener('click', () => el.avatarInput.click());
  el.avatarInput.addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try { setAvatar(await makeAvatar(f)); }
    catch (err) { el.status.textContent = '头像读取失败'; el.status.className = 'status err'; }
  });
  el.avatarClear.addEventListener('click', () => setAvatar(''));
  el.openChats.addEventListener('click', () => setChatOpen(false));   // ‹ 返回会话列表
  el.newChatTop.addEventListener('click', newChat);
  el.closePresets.addEventListener('click', () => el.presetMask.classList.add('hidden'));
  el.presetMask.addEventListener('click', (e) => { if (e.target === el.presetMask) el.presetMask.classList.add('hidden'); });
  el.myAvatarBtn.addEventListener('click', () => el.myAvatarInput.click());
  el.myAvatarInput.addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try { setMyAvatar(await makeAvatar(f)); }
    catch (err) { el.status.textContent = '头像读取失败'; el.status.className = 'status err'; }
  });
  el.myAvatarClear.addEventListener('click', () => setMyAvatar(''));
  el.openSettings.addEventListener('click', openSettings);
  el.closeSettings.addEventListener('click', closeSettings);
  el.mask.addEventListener('click', (e) => { if (e.target === el.mask) closeSettings(); });
  el.saveSettings.addEventListener('click', saveSettings);
  el.clearChat.addEventListener('click', clearChat);
  el.testConn.addEventListener('click', testConn);

  // 风格学习
  el.learnBtn.addEventListener('click', () => el.learnInput.click());
  el.learnInput.addEventListener('change', (e) => { onLearnFiles(e.target.files); e.target.value = ''; });
  el.sideLeft.addEventListener('click', () => setLearnSide('left'));
  el.sideRight.addEventListener('click', () => setLearnSide('right'));
  el.learnRun.addEventListener('click', learnStyle);
  el.learnAdopt.addEventListener('click', adoptLearn);
  el.learnDiscard.addEventListener('click', discardLearn);

  // 长期记忆
  el.memRun.addEventListener('click', manualMemory);
  el.memAdd.addEventListener('click', addMemItem);
  el.memText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addMemItem(); }
  });
  el.memList.addEventListener('click', (e) => {
    const b = e.target.closest && e.target.closest('.mem-item .x');
    if (b && b.dataset.id) deleteMemItem(b.dataset.id);
  });
  el.memClear.addEventListener('click', clearMemory);
  CATS.forEach((c) => {
    const o = document.createElement('option');
    o.value = c.key;
    o.textContent = c.name;
    el.memCat.appendChild(o);
  });

  // 系统通知权限（仅当浏览器支持；iOS 需添加到主屏幕后）
  el.notifBtn.addEventListener('click', async () => {
    const out = el.notifResult;
    out.hidden = false;
    if (!('Notification' in window)) {
      out.className = 'conn-result err';
      out.textContent = '这个浏览器不支持通知（iPhone 需先把 App 加到主屏幕）。';
      return;
    }
    if (Notification.permission === 'granted') {
      out.className = 'conn-result ok';
      out.textContent = '✅ 通知已开启：App 开着但你在看别的页面时，她主动发消息会弹通知。';
      return;
    }
    out.className = 'conn-result';
    out.textContent = '正在请求权限…';
    let perm = Notification.permission;
    try { perm = await Notification.requestPermission(); } catch (e) {}
    if (perm === 'granted') {
      out.className = 'conn-result ok';
      out.textContent = '✅ 通知已开启。';
    } else {
      out.className = 'conn-result err';
      out.textContent = '没拿到权限；需要时可在浏览器设置里改。';
    }
  });

  // 角色包
  el.packFetch.addEventListener('click', fetchPack);
  el.packImport.addEventListener('click', importPasted);
  el.packExport.addEventListener('click', exportPack);
  el.historyExport.addEventListener('click', exportHistory);
  el.historyImport.addEventListener('click', () => el.historyFile.click());
  el.historyFile.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (file) void importHistory(file);
  });

  // 锁屏推送
  el.subBtn.addEventListener('click', subscribePush);

  // 控制台自检：__dbg.buildSystem() 看提示词；__dbg.proactiveTest() 立刻看她主动发消息
  window.__dbg = {
    buildSystem,
    consolidateMemory,
    get mem() { return mem; },
    proactiveTest: async () => {
      const lines = await genProactiveLines(3);
      await pushProactive(lines);
    },
  };

  // ---------- 启动 ----------
  // 一次性配置导入：用带 ?key=&model= 的链接打开一次，自动填好并存本机，然后清掉网址参数
  try {
    const q = new URLSearchParams(location.search);
    const into = {};
    if (q.get('key')) into.apiKey = q.get('key');
    if (q.get('model')) into.model = q.get('model');
    if (q.get('name')) into.name = q.get('name');
    if (q.get('persona')) into.persona = q.get('persona');
    if (q.get('styleNotes')) into.styleNotes = q.get('styleNotes');
    if (q.get('memory')) into.memory = q.get('memory');
    if (q.get('examples')) into.examples = q.get('examples');
    if (q.get('proactive') === '1') into.proactive = true;
    let importedAny = Object.keys(into).length > 0;
    if (importedAny) {
      cfg = Object.assign({}, cfg, into);
      saveJSON(CFG_KEY, cfg);
      syncChatSnapshot();
    }
    // 结构化记忆种子：?mem=[{"cat":"fact","text":"…"}]
    const memRaw = q.get('mem');
    if (memRaw) {
      try {
        const arr = JSON.parse(memRaw);
        if (Array.isArray(arr)) {
          const items = [];
          for (const it of arr) {
            if (it && isCat(it.cat) && typeof it.text === 'string' && it.text.trim()) {
              items.push({ id: uid(), cat: it.cat, text: it.text.trim().slice(0, MEM_TEXT_MAX), t: Date.now() });
            }
          }
          if (items.length) {
            mem = { upto: history.length, lastRun: Date.now(), items: items.slice(0, MEM_ITEMS_MAX) };
            saveMem();
            importedAny = true;
          }
        }
      } catch (e) {}
    }
    if (importedAny) history.replaceState(null, '', location.pathname);
  } catch (e) {}

  ensureHistoryTimes();
  backfillChatStamps();
  refresh();
  renderHistory();
  renderChatList();   // 首页就是会话列表

  // 主动消息：老用户第一次升级时没有水位，先建水位不补发；否则回来就看她的"留言"
  if (!cfg.proactiveLast) markActive();
  void proactiveMaybe('away');
  setInterval(() => { void proactiveMaybe('tick'); }, PA_CHECK_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      hiddenAt = Date.now();
      if (busy) {
        bgDuringTurn = true;
        // 立刻把本轮交给云函数（不等 fetch 报错），回复走锁屏推送
        if (activePlan && activeTurnId) void cloudRelay(activePlan, activeTurnId);
      }
      return;
    }
    if (document.visibilityState === 'visible') {
      void consumePushQueue();
      void resumeTurn();        // 先把被后台打断的回复续上
      const leftLong = !!cfg.proactiveLast && (Date.now() - cfg.proactiveLast >= PA_AWAY_MIN);
      void proactiveMaybe(leftLong ? 'away' : 'tick');
      void fetchPending();      // 兜底拉取云端主动消息
    }
  });
  // 直接划掉 App：pagehide 也交一次云端（同一轮进行中的请求会复用）
  window.addEventListener('pagehide', () => {
    hiddenAt = Date.now();
    if (busy && activePlan && activeTurnId) void cloudRelay(activePlan, activeTurnId);
  });

  // 上次在后台时直接划掉了 App：重开后最后一条是用户消息，自动补回复
  if (history.length && history[history.length - 1].role === 'user' && configured()) {
    resumePending = true;
    resumeChatId = chats.active;
    setTimeout(() => { void resumeTurn(); }, 1000);
  }

  // 推送 SW：注册 push-sw.js（不缓存页面）、卸掉旧版 sw.js、接收后台回复
  void setupPushSW().then(() => {
    void consumePushQueue();
    void syncState();
    void fetchPending();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'push-queued') void consumePushQueue();
      });
    }
  });
})();
  </script>
