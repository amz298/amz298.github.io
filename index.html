 <!DOCTYPE html>
  <html>
  <head>
  <meta charset="UTF-8">
  <title>亚马逊运营工具箱</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f0f7f2;display:grid;
      place-items:center;min-height:100vh;margin:0;color:#1e3328;}
    .wrap{text-align:center;}
    h1{color:#2d8659;margin-bottom:30px;}
    .tools{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
    .tool{background:#fff;padding:30px 40px;border-radius:16px;text-decoration:none;
      color:inherit;box-shadow:0 4px 15px rgba(0,0,0,.06);transition:.2s;
      border:2px solid #c9ddd1;min-width:200px;}
    .tool:hover{transform:translateY(-4px);border-color:#2d8659;}
    .tool .ic{font-size:48px;margin-bottom:10px;}
    .tool .n{font-size:18px;font-weight:700;color:#2d8659;}
    .tool .d{font-size:13px;color:#4f6b5b;margin-top:5px;}
  </style>
  </head>
  <body>
  <div class="wrap">
    <h1>🛠️ 亚马逊运营工具箱</h1>
    <div class="tools">
      <a href="profit/" class="tool">
        <div class="ic">💰</div>
        <div class="n">利润计算器</div>
        <div class="d">单SKU + 批量核算</div>
      </a>
      <a href="listing/" class="tool">
        <div class="ic">📋</div>
        <div class="n">Listing提取器</div>
        <div class="d">德语文案自动提取</div>
      </a>
    </div>
  </div>
  </body>
  </html>
